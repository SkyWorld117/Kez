cheese:
  acts:
    description: A Common Tracking Software framework
    version: 44.2.0
    compiler: gcc@13.4.0
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  pythia:
    description: Pythia is a standard tool for the generation of high-energy physics events.
    version: 8.3.16
    compiler: system
    build:
      configurations:
        options:
          - name: --with-hepmc3
            description: Use HepMC3 for event record I/O
            enabled: true
            enabled_value: ${hepmc3.prefix}
            disabled_value: ~
            requires: [hepmc3]
          - name: --with-openmp
            description: Enable OpenMP support
            enabled: false
            enabled_value: ~
          - name: --cxx-common
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  dd4hep:
    description: Detector description toolkit for high energy physics
    version: 01-33
    compiler: gcc@13.4.0
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  intel-oneapi-tbb:
    description: Intel oneAPI Threading Building Blocks for parallel programming
  intel-oneapi:
    version: 2025.1.0.666
  sio:
    description: SIO - Simple IO
    version: 00-02
    compiler: system
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  lcio:
    description: Linear Collider I/O - persistency framework for HEP and HEP-like applications
    version: 02-23
    compiler: system
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  root:
    description: ROOT Data Analysis Framework
    version: 6.36.04
    compiler: system
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  geant4:
    description: Geant4 - A toolkit for the simulation of the passage of particles through matter
    version: 11.3.2
    compiler: system
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  hepmc3:
    description: HepMC3 - A C++ event record for Monte Carlo generators
    version: 3.3.1
    compiler: system
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS_RELEASE
            description: C compiler flags for Release build
            enabled: true
            enabled_value: -O3
          - name: -DCMAKE_CXX_FLAGS_RELEASE
            description: C++ compiler flags for Release build
            enabled: true
            enabled_value: -O3
  xerces-c:
    description: Xerces-C is a validating XML parser written in a portable subset of C++.
    version: 3.3.0
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  boost:
    description: Boost C++ Libraries
    version: 1.89.0
    compiler: system
    build:
      configurations:
        options:
          - name: cxxflags
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3 -fPIC
  eigen:
    description: Eigen C++ Template Library for Linear Algebra
    version: 3.4.1
    compiler: system
  json:
    description: JSON for Modern C++
    version: 3.12.0
    compiler: system
recipe:
  abstract_packages:
    {}
  dependencies:
    - acts
    - pythia
    - dd4hep
    - intel-oneapi-tbb
    - intel-oneapi
    - sio
    - lcio
    - root
    - geant4
    - hepmc3
    - xerces-c
    - boost
    - eigen
    - json