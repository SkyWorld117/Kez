cheese:
  osu:
    description: Ohio State University Micro-Benchmarks
    version: 7.5.1
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  openmpi:
    description: Open Source Implementation of the Message Passing Interface
    version: 5.0.9
    compiler: system
recipe:
  abstract_packages:
    mpi: openmpi
  dependencies:
    - osu
    - openmpi