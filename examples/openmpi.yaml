cheese:
  openmpi:
    description: Open Source Implementation of the Message Passing Interface
    version: 5.0.8
    compiler: system
    build:
      configurations:
        options:
          - name: --enable-memchecker
            description: Enable memory and buffer checks
            enabled: false
            enabled_value: ~
            disabled_value: ~
          - name: --with-mpi-param-check
            description: Enable MPI parameter checking [always | runtime | never]
            enabled: true
            enabled_value: never
          - name: --with-oshmem-param-check
            description: Enable OpenSHMEM parameter checking [always | never]
            enabled: true
            enabled_value: never
          - name: --with-cuda
            description: Build with CUDA support
            enabled: true
            enabled_value: ${cuda.prefix}
            requires: [cuda]
          - name: --with-hcoll
            description: Build with HCOLL support
            enabled: true
            enabled_value: ${hcoll.prefix}
            requires: [hcoll]
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3 ${numactl.includes}
          - name: FCFLAGS
            description: Fortran compiler flags
            enabled: true
            enabled_value: -O3 ${numactl.includes}
  hcoll:
    description: Modern Interface for Mellanox Fabric Collective Accelerator
  ucx:
    description: Unified Communication X
    version: 1.18.1
    compiler: system
    build:
      configurations:
        options:
          - name: use_cuda
            description: Enable CUDA support
            enabled: true
            enabled_value: ${cuda.prefix}
            requires: [cuda]
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  rdma-core:
    description: RDMA core userspace libraries and daemons
  numactl:
    description: NUMA support for Linux
    version: 2.0.19
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  prrte:
    description: PMIx Reference RunTime Environment
    version: 4.0.0
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  pmix:
    description: Process Management Interface for Exascale
    version: 6.0.0
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  libevent:
    description: Event notification library
    version: 2.1.12
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  openssl:
    description: OpenSSL is a robust, commercial-grade, full-featured toolkit for general-purpose cryptography and secure communication over computer networks.
    version: 3.5.2
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  hwloc:
    description: Hardware Locality
    version: 2.12.1
    compiler: system
    build:
      configurations:
        options:
          - name: use_cuda
            description: Use CUDA support
            enabled: true
            enabled_value: ~
            disabled_value: ~
            requires: [cuda]
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  libxml2:
    description: A library for parsing XML documents.
    version: 2.14.5
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  libpciaccess:
    description: Generic PCI access library.
    version: 0.17
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
recipe:
  abstract_packages:
    {}
  dependencies:
    - openmpi
    - hcoll
    - ucx
    - rdma-core
    - numactl
    - prrte
    - pmix
    - libevent
    - openssl
    - hwloc
    - cuda
    - libxml2
    - xz
    - libpciaccess
    - lz4
    - zlib
