cheese:
  sst-elements:
    description: Structural Simulation Toolkit Elements
    version: scc25
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  sst-core:
    description: Structural Simulation Toolkit Core
    version: scc25
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  python:
    description: Python Programming Language
    version: 3.13.9
    compiler: system
    build:
      configurations:
        options:
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
  openmpi:
    description: Open Source Implementation of the Message Passing Interface
    version: 5.0.9
    compiler: system
recipe:
  abstract_packages:
    mpi: openmpi
  dependencies:
    - sst-elements
    - sst-core
    - python
    - openmpi
  targets:
    - sst-elements