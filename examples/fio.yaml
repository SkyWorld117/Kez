cheese:
  fio:
    description: Flexible I/O tester
    version: master
    compiler: system
    build:
      configurations:
        options:
          - name: --extra-cflags
            description: C Flags
            enabled: true
            enabled_value: -O3 ${libaio.includes}
  libaio:
    description: The Linux-native asynchronous I/O facility
    version: master
    compiler: system
recipe:
  abstract_packages: {}
  dependencies:
    - fio
    - libaio
  targets:
    - fio
