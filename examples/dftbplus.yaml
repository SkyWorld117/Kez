cheese:
  dftbplus:
    version: 25.1
    compiler: gcc@14.3.0
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: -DCMAKE_CXX_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: -DCMAKE_Fortran_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3
          - name: -DWITH_MPI
            enabled: true
          - name: -DWITH_OMP
            enabled: true
          - name: -DWITH_ELSI
            enabled: true
          - name: -DWITH_GPU
            enabled: true
          - name: -DCMAKE_EXE_LINKER_FLAGS
            enabled: true
            enabled_value: ${scalapack.ldflags} ${scalapack.libs} ${elpa.ldflags} ${cuda.ldflags} ${nvhpc.nccl_ldflags} ${nvhpc.nccl_libs}
          - name: -DCMAKE_SHARED_LINKER_FLAGS
            enabled: true
            enabled_value: ${scalapack.ldflags} ${scalapack.libs} ${elpa.ldflags} ${cuda.ldflags} ${nvhpc.nccl_ldflags} ${nvhpc.nccl_libs}
  elsi:
    version: 2.12.0
    compiler: gcc@14.3.0
    build:
      configurations:
        options:
          - name: -DCMAKE_C_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: -DCMAKE_CXX_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: -DCMAKE_Fortran_FLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fallow-argument-mismatch
          - name: elpa
            enabled: true

  elpa:
    version: 2026.02.001
    compiler: gcc@14.3.0
    build:
      configurations:
        options:
          - name: CFLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: CXXFLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3 -fPIC
          - name: FCFLAGS
            enabled: true
            enabled_value: -O3 -march=znver3 -mtune=znver3
          - name: LDFLAGS
            enabled: false
          - name: mpi
            enabled: true
          - name: openmp
            enabled: false

          - name: disable-generic-kernels
            enabled: true
          - name: disable-sse-kernels
            enabled: true
          - name: disable-sse-assembly-kernels
            enabled: true
          - name: disable-avx-kernels
            enabled: true
          - name: disable-avx2-kernels
            enabled: false
          - name: disable-avx512-kernels
            enabled: true

          - name: enable-nvidia-gpu-kernels
            enabled: true
          - name: --with-NVIDIA-GPU-compute-capability
            enabled: true
            enabled_value: sm_80
          - name: enable-nvidia-sm80-gpu-kernels
            enabled: true
          - name: enable-cuda-aware-mpi
            enabled: false
          - name: enable-gpu-ccl
            enabled: true
          - name: --with-nccl-path
            enabled: true
            enabled_value: ${nvhpc.nccl_prefix}

          - name: disable-single-precision
            enabled: true
          - name: disable-autotuning
            enabled: false
          - name: disable-timings
            enabled: true

  intel-oneapi-mkl:
    build:
      configurations:
        options:
          - name: fortran_format
            enabled: true
            enabled_value: gf
          - name: integer_size
            enabled: true
            enabled_value: lp64
          - name: multithreaded
            enabled: true
            enabled_value: ~
          - name: multithreading_library
            enabled: true
            enabled_value: gnu
          - name: mpi-family
            enabled: true
            enabled_value: openmpi

  intel-oneapi:
    version: 2025.1.0.666

  nvhpc:
    version: 25.7-x86_64

  openmpi:
    version: 5.0.9
    compiler: gcc@14.3.0

recipe:
  abstract_packages:
    mpi: openmpi
    blas: intel-oneapi-mkl
    lapack: intel-oneapi-mkl
    scalapack: intel-oneapi-mkl
  dependencies:
    - dftbplus
    - elsi
    - elpa
    - cuda
    - nvhpc
    - intel-oneapi
    - intel-oneapi-mkl
    - openmpi

