cheese:
  openmpi:
    description: Open Source Implementation of the Message Passing Interface
    version: 5.0.9
    compiler: system

  cuda:
    description: NVIDIA CUDA Toolkit (standalone, for GPU kernels)
    version: 12.9
    compiler: system

  nvhpc:
    description: NVIDIA HPC SDK (for NCCL collective library)
    version: 25.7-x86_64
    compiler: system

  intel-oneapi-mkl:
    description: Intel oneAPI Math Kernel Library
    build:
      configurations:
        options:
          - name: fortran_format
            enabled: true
            enabled_value: gf
          - name: mpi-family
            enabled: true
            enabled_value: openmpi
          - name: integer_size
            enabled: true
            enabled_value: lp64
          - name: multithreaded
            enabled: false
          - name: multithreading_library
            enabled: true
            enabled_value: gnu

  intel-oneapi:
    version: 2025.1.0.666

  elpa:
    description: ELPA - Eigenvalue soLvers for Petaflop Applications (NVIDIA H200 GPU-optimized)
    version: 2026.02.001
    compiler: system
    build:
      configurations:
        options:
          # Compiler flags
          - name: CFLAGS
            enabled: true
            enabled_value: -O3 -march=znver5 -mtune=znver5 -fPIC -funroll-loops
          - name: CXXFLAGS
            enabled: true
            enabled_value: -O3 -march=znver5 -mtune=znver5 -fPIC -funroll-loops
          - name: FCFLAGS
            enabled: true
            enabled_value: -O3 -march=znver5 -mtune=znver5 -funroll-loops
          - name: LDFLAGS
            enabled: false

          # Parallelism
          - name: --with-mpi
            enabled: true
          - name: enable-openmp
            enabled: true

          # CPU kernel selection
          - name: disable-generic-kernels
            enabled: true
          - name: disable-sse-kernels
            enabled: true
          - name: disable-sse-assembly-kernels
            enabled: true
          - name: disable-avx-kernels
            enabled: true
          - name: disable-avx2-kernels
            enabled: false
          - name: disable-avx512-kernels
            enabled: false

          # GPU support (H200 NVL = SM 9.0)
          - name: enable-nvidia-gpu-kernels
            enabled: false
          - name: enable-nvidia-sm80-gpu-kernels
            enabled: true
          - name: --with-NVIDIA-GPU-compute-capability
            enabled: true
            enabled_value: sm_90
          - name: enable-gpu-ccl
            enabled: true
          - name: --with-nccl-path
            enabled: true
            enabled_value: ${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nccl
          - name: enable-amd-gpu
            enabled: false

          # Performance tuning
          - name: disable-autotuning
            enabled: false
          - name: disable-timings
            enabled: false

recipe:
  abstract_packages:
    mpi: openmpi
    scalapack: intel-oneapi-mkl

  dependencies:
    - openmpi
    - cuda
    - nvhpc
    - intel-oneapi-mkl
    - elpa

# ============================================================================
# Configuration notes for H200 NVL GPU cluster (EPYC 9654 + 4× H200 NVL)
# ============================================================================
#
# Platform Details:
#   CPU: AMD EPYC 9654 (Genoa, Zen 5c), 192 cores, 2 NUMA nodes, AVX-512 full support
#   GPU: 4× NVIDIA H200 NVL (Hopper, SM 9.0), 141 GB HBM3e each
#   Interconnect: InfiniBand HDR200 (200 Gbps)
#
# Key Configuration Choices:
#
#   Optimization Flags:
#   - march=znver5 -mtune=znver5: Target EPYC 9654 specifically (Genoa tuning)
#   - Fallback to march=native or march=znver4 if GCC 15.2 doesn't support znver5
#
#   CPU Kernels:
#   - AVX2 + AVX-512 enabled (Genoa supports all AVX-512 extensions)
#   - Disabled generic/SSE/AVX (less performant than modern SIMD)
#   - ELPA autotuning selects best kernel at first run
#
#   GPU Support:
#   - enable-nvidia-sm80-gpu-kernels: true (SM 9.0 compatible shorthand)
#   - with-NVIDIA-GPU-compute-capability: sm_90 (explicit Hopper targeting)
#   - enable-gpu-ccl: true with NCCL (optimized GPU collective ops)
#
#   Parallelism (CPU):
#   - MPI: Distributed memory across nodes
#   - OpenMP: Shared memory within each NUMA node (96 cores/socket)
#   - Typical mapping: ~12-16 MPI ranks, 12-16 OMP threads/rank
#
#   Build System:
#   - Autotuning enabled: First run profiles kernels, caches for speed
#   - Timing measurements enabled: Runtime performance analysis
#
# Performance Tuning Tips:
#
#   For strong scaling (fixed problem, more cores):
#   - Keep autotuning enabled (finds best kernel per platform)
#   - Tune MPI rank / OMP thread split via ELPA runtime settings
#   - Monitor GPU utilization (must stay >80% for good scaling)
#
#   For memory-bound workloads:
#   - H200 HBM3e provides 141 GB/device (4.6 TB total)
#   - Use CUDA_LAUNCH_BLOCKING=1 for deterministic timing

