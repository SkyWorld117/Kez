cheese:
  ascot5:
    description: Simulation tool used in fusion energy science and engineering
    version: isc26
    compiler: nvhpc-compilers@25.7
    build:
      stages:
        - target: ascot5_main
          configurations:
            options:
              - name: &1 MPI
                description: &2 Toggle MPI
                enabled: &3 true
                enabled_value: &4 1
                requires: &5 [mpi]
              - name: &6 OMP
                description: &7 Toggle OpenMP
                enabled: &8 false
                enabled_value: &9 1
              - name: &10 ACC
                description: &11 Toggle OpenACC
                enabled: &12 true
                enabled_value: &13 1
              - name: &14 GPU
                description: &15 Toggle NVHPC
                enabled: &16 true
                enabled_value: &17 1
                requires: &18 [nvhpc-compilers]
              - name: &19 NSIMD
                description: &20 SIMD vector length used for CPU vectorization
                enabled: &21 false
                enabled_value: &22 8
              - name: &23 FLAGS
                description: &24 C flags
                enabled: &25 true
                enabled_value: &26 -O3 -fast -gpu=cc90
        - target: libascot
          configurations:
            options:
              - name: *1
                description: *2
                enabled: *3
                enabled_value: *4
                requires: *5
              - name: *6
                description: *7
                enabled: *8
                enabled_value: *9
              - name: *10
                description: *11
                enabled: *12
                enabled_value: *13
              - name: *14
                description: *15
                enabled: *16
                enabled_value: *17
                requires: *18
              - name: *19
                description: *20
                enabled: *21
                enabled_value: *22
              - name: *23
                description: *24
                enabled: *25
                enabled_value: *26
  nvhpc-compilers:
    description: NVIDIA HPC compiler suite
  nvhpc:
    version: 25.7
  hdf5:
    description: High-performance data management and storage suite
    version: 1.10.11
    compiler: system
    build:
      configurations:
        options:
          - name: --enable-cxx
            description: Compile the C++ interface
            enabled: false
            enabled_value: ~
          - name: --enable-parallel
            description: Search for MPI-IO and MPI support
            enabled: true
            enabled_value: ~
            requires: [mpi]
          - name: CFLAGS
            description: C compiler flags
            enabled: true
            enabled_value: -O3
          - name: CXXFLAGS
            description: C++ compiler flags
            enabled: true
            enabled_value: -O3
  openmpi:
    description: Open Source Implementation of the Message Passing Interface
    version: 5.0.10
    compiler: system
recipe:
  abstract_packages:
    mpi: openmpi
  dependencies:
    - ascot5
    - nvhpc-compilers
    - nvhpc
    - hdf5
    - openmpi
  targets:
    - ascot5
