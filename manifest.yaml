---
project:
    name: Kez
    abbrev: kez
    version: dev

dependencies:
    patchelf: latest
    googletest: latest
    yaml-cpp: latest
    yq: latest

# System libraries and tools (installed in the system cellar)
system-stack:
  # Core libraries
    gmp: latest
    mpfr: latest
    mpc: latest
    isl: latest

  # Compression libraries
    zlib: latest
    xz: latest
    lz4: latest
    zstd: latest

  # Compiling tools
    binutils: latest
    gcc: 11.5.0
    elfutils: latest

  # Build tools
    m4: latest
    autoconf: latest
    automake: latest
    libtool: latest
    make: latest
    rust: latest
    cmake: latest
    perl: latest
    git: latest
    python: latest
    ninja: latest
    meson: latest

# Relative paths to the work directory
paths:
    environment: env
    system: env/system
    utilities: env/utilities
    compilers: env/compilers
    mpis: env/mpis
    vendors: env/vendors
    applications: env/applications
    cache: .cache
    factories: factories
    modulefiles: modulefiles
