cheese:
  name: elpa
  type: package
  description: ELPA - Eigenvalue soLvers for Petaflop Applications (HPC optimized)
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 2026.02.001
        url: https://elpa.mpcdf.mpg.de/software/tarball-archive/Releases/2026.02.001/elpa-2026.02.001.tar.gz

  dependencies:
    - mpi
    - blas
    - lapack
    - scalapack

  build:
    configurations:
      options:
        - name: --prefix
          enabled_value:
            default: ${elpa.prefix}

        - name: CC
          enabled_value:
            default: ${mpi.c}

        - name: CXX
          enabled_value:
            default: ${mpi.cxx}

        - name: FC
          enabled_value:
            default: ${mpi.fort}

        - name: CFLAGS
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXXFLAGS
          user_configurable: true
          enabled_value:
            default: -O3

        - name: FCFLAGS
          user_configurable: true
          enabled_value:
            default: -O3

        # ============ Core parallelization ============
        - name: mpi
          description: Enable MPI parallelization
          user_configurable: true
          enabled_format: --with-mpi=yes
          disabled_format: --with-mpi=no

        - name: openmp
          description: Enable OpenMP for shared-memory parallelism
          user_configurable: true
          enabled_format: --enable-openmp
          disabled_format: --disable-openmp

        # ============ CPU kernel selection ============
        - name: disable-generic-kernels
          description: Do NOT build generic kernels
          user_configurable: true
          enabled_format: --disable-generic-kernels
          disabled_format: --enable-generic-kernels

        - name: disable-sse-kernels
          description: Do NOT build SSE kernels
          user_configurable: true
          enabled_format: --disable-sse-kernels
          disabled_format: --enable-sse-kernels

        - name: disable-sse-assembly-kernels
          description: Do NOT build SSE assembly kernels
          user_configurable: true
          enabled_format: --disable-sse-assembly-kernels
          disabled_format: --enable-sse-assembly-kernels

        - name: disable-avx-kernels
          description: Do NOT build AVX kernels (Intel Sandy Bridge+)
          user_configurable: true
          enabled_format: --disable-avx-kernels
          disabled_format: --enable-avx-kernels

        - name: disable-avx2-kernels
          description: Do NOT build AVX2 kernels (Intel Haswell+, AMD EPYC snver2+)
          user_configurable: true
          enabled_format: --disable-avx2-kernels
          disabled_format: --enable-avx2-kernels

        - name: disable-avx512-kernels
          description: Do NOT build AVX-512 kernels (Intel Knights Landing+, AMD EPYC 7773X/72F3)
          user_configurable: true
          enabled_format: --disable-avx512-kernels
          disabled_format: --enable-avx512-kernels

          # more (neon, etc.) can be added in the future

        # ============ Nvidia GPU support ============
        - name: enable-nvidia-gpu-kernels
          description: Build Nvidia GPU kernels (requires CUDA). Set compute capability with --with-NVIDIA-GPU-compute-capability
          user_configurable: true
          enabled:
            default: false
          enabled_format: --enable-nvidia-gpu-kernels
          disabled_format: --disable-nvidia-gpu-kernels
          requires: [cuda]

        - name: --with-cuda-path
          description: Path to CUDA installation. Auto-detected by default
          enabled:
            conditions:
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                value: true
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                value: false
          enabled_value:
            default: ${cuda.prefix}
          requires: [cuda]

        - name: enable-cuda-aware-mpi
          description: Enable CUDA-aware MPI (experimental)
          user_configurable: true
          enabled:
            default: false
          enabled_format: --enable-cuda-aware-mpi
          disabled_format: --disable-cuda-aware-mpi
          requires: [cuda]

        - name: enable-gpu-streams
          description: Enable CUDA streams for GPU kernels
          enabled:
            conditions:
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                value: true
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                value: false
          enabled_format: --enable-gpu-streams=nvidia
          requires: [cuda]

        - name: enable-gpu-ccl
          description: Enable collective communication library (NCCL from NVHPC)
          user_configurable: true
          enabled:
            default: false
          enabled_format: --enable-gpu-ccl=nccl
          disabled_format: --enable-gpu-ccl=no
          requires: [cuda, nvhpc]

        - name: --with-nccl-path
          description: Path to NCCL installation directory
          user_configurable: true
          enabled:
            conditions:
              - condition: ${elpa.config.enable-gpu-ccl} true
                value: true
              - condition: ${elpa.config.enable-gpu-ccl} false
                value: false
          enabled_value:
            default: ${nvhpc.nccl_prefix}
          requires: [nvhpc]
      
        - name: --with-NVIDIA-GPU-compute-capability
          description: NVIDIA GPU compute capabilities to build for (comma-separated, e.g. sm_60,sm_80)
          user_configurable: true
          enabled:
            conditions:
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                value: true
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                value: false
          enabled_value:
            default: sm_80

        - name: enable-nvidia-sm80-gpu-kernels
          description: Build Nvidia GPU kernels for compute capability 8.0+ (A100, H100, etc.)
          user_configurable: true
          enabled:
            default: false
          enabled_format: --enable-nvidia-sm80-gpu-kernels
          disabled_format: --disable-nvidia-sm80-gpu-kernels
          requires: [cuda]

        - name: with-cusolver
          description: Use Nvidia cuSolver library (yes by default when CUDA enabled)
          enabled:
            conditions:
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                value: true
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                value: false
          enabled_format: --with-cusolver=yes
          requires: [cuda]

        - name: enable-nvidia-cub
          description: Use Nvidia CUB library for GPU kernels (yes by default when CUDA enabled)
          enabled:
            conditions:
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                value: true
              - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                value: false
          enabled_format: --enable-nvidia-cub
          requires: [cuda]

        # ============ AMD GPU support ============

        # - name: enable-amd-gpu
        #   description: Build AMD GPU kernels (requires ROCm/HIP)
        #   user_configurable: true
        #   enabled:
        #     default: false
        #   enabled_format: --enable-amd-gpu
        #   disabled_format: --disable-amd-gpu

        # ============ Performance tuning ============
        - name: disable-single-precision
          description: Build for double precision only
          user_configurable: true
          enabled_format: --disable-single-precision

        - name: disable-autotuning
          description: Disable runtime autotuning
          user_configurable: true
          enabled_format: --disable-autotuning

        # - name: with-papi
        #   description: Use PAPI library to measure flop counts
        #   user_configurable: true
        #   enabled:
        #     default: false
        #   enabled_format: --with-papi=yes
        #   disabled_format: --with-papi=no

        # - name: with-likwid
        #   description: Use LIKWID for performance measurement
        #   user_configurable: true
        #   enabled:
        #     default: false
        #   enabled_format: --with-likwid=yes
        #   disabled_format: --with-likwid=no

        - name: disable-timings
          description: Disable internal timing measurements
          user_configurable: true
          enabled_format: --disable-timings

        # ============ Fortran & compilation features ============
        - name: disable-Fortran2008-features
          description: Do NOT use Fortran 2008 features (for older compilers)
          enabled:
            default: false
          enabled_format: --disable-Fortran2008-features

        - name: enable-ifx-compiler
          description: Apply compatibility patches for older Intel oneAPI ifx compiler versions
          enabled:
            default: false
          enabled_format: --enable-ifx-compiler

        # =========== Linker ====================================
        - name: LDFLAGS
          enabled_value:
            default: ${compiler.ldflags}
            conditions:
              - condition: ${elpa.config.enable-gpu-ccl} true
                action: append
                value: ${nvhpc.nccl_ldflags} ${nvhpc.nccl_libs}

        - name: SCALAPACK_FCFLAGS
          enabled_value:
            default: ${scalapack.includes}

        - name: SCALAPACK_LDFLAGS
          enabled_value:
            default: ${scalapack.ldflags} ${scalapack.libs}

    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${elpa.prefix}/lib -Wl,-rpath,${elpa.prefix}/lib
    libs:
      default: -lelpa
      conditions:
        - condition: ${elpa.config.openmp} true
          value: -lelpa_openmp
    includes:
      default: -I${elpa.prefix}/include
    modules_dir:
      default: ${elpa.prefix}/include/elpa-${elpa.version}/modules
      conditions:
        - condition: ${elpa.config.openmp} true
          value: ${elpa.prefix}/include/elpa_openmp-${elpa.version}/modules
