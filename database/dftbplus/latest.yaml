recipe:
  name: dftbplus
  description: DFTB+ - Density Functional Tight Binding molecular dynamics
  type: package
  toolchain: cmake

  source:
    type: tarball
    releases:
      - version: 25.1
        url: https://github.com/dftbplus/dftbplus/releases/download/25.1/dftbplus-25.1.tar.xz

  dependencies:
    - mpi
    - blas
    - lapack
    - scalapack

  build:
    configurations:
      options:
        - name: -DCMAKE_INSTALL_PREFIX
          enabled_value:
            default: ${dftbplus.prefix}

        - name: -DCMAKE_BUILD_TYPE
          enabled_value:
            default: Release

        - name: -DCMAKE_C_COMPILER
          enabled_value:
            default: ${mpi.c}

        - name: -DCMAKE_CXX_COMPILER
          enabled_value:
            default: ${mpi.cxx}

        - name: -DCMAKE_Fortran_COMPILER
          enabled_value:
            default: ${mpi.fort}

        - name: -DWITH_MPI
          user_configurable: true
          enabled_format: -DWITH_MPI=ON
          disabled_format: -DWITH_MPI=OFF
          requires: [mpi]

        - name: -DWITH_OMP
          user_configurable: true
          enabled_format: -DWITH_OMP=ON
          disabled_format: -DWITH_OMP=OFF

        - name: -DWITH_ELSI
          user_configurable: true
          enabled:
            default: false
          enabled_format: -DWITH_ELSI=ON
          disabled_format: -DWITH_ELSI=OFF
          requires: [elsi]

        - name: -DWITH_GPU
          user_configurable: true
          enabled:
            default: false
          enabled_format: -DWITH_GPU=ON
          disabled_format: -DWITH_GPU=OFF
          requires: [cuda]

        - name: -DCUDAToolkit_ROOT
          enabled:
            default: false
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                value: true
          enabled_value:
            default: ${cuda.prefix}
          requires: [cuda]

        - name: -DMAGMA_INCLUDE_DIRECTORY
          enabled:
            default: false
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true && ${dftbplus.config.-DWITH_MPI} false
                value: true
          enabled_value:
            default: ${magma.prefix}/include
          requires: [magma]

        - name: -DBLAS_LIBRARY
          enabled_value:
            default: ${blas.ldflags};${blas.libs}

        - name: -DLAPACK_LIBRARY
          enabled_value:
            default: ${lapack.ldflags};${lapack.libs}

        - name: -DSCALAPACK_LIBRARY
          enabled:
            default: false
            conditions:
              - condition: ${dftbplus.config.-DWITH_MPI} true
                value: true
          enabled_value:
            default: ${scalapack.ldflags};${scalapack.libs}
          requires: [scalapack]

        - name: -DCMAKE_C_FLAGS
          user_configurable: true
          enabled_value:
            default: -O3
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                action: append
                value: -I${cuda.prefix}/include

        - name: -DCMAKE_CXX_FLAGS
          user_configurable: true
          enabled_value:
            default: -O3

        - name: -DCMAKE_Fortran_FLAGS
          user_configurable: true
          enabled_value:
            default: -O3

        - name: -DCMAKE_EXE_LINKER_FLAGS
          enabled_value:
            conditions:
              - condition: ${dftbplus.config.-DWITH_MPI} true && ${dftbplus.config.-DWITH_ELSI} false
                value: ${scalapack.ldflags} ${scalapack.libs}
              - condition: ${dftbplus.config.-DWITH_MPI} true && ${dftbplus.config.-DWITH_ELSI} true
                value: ${scalapack.ldflags} ${scalapack.libs} ${elsi.ldflags} ${elsi.libs} ${elpa.ldflags}
              - condition: ${dftbplus.config.-DWITH_MPI} false && ${dftbplus.config.-DWITH_GPU} true
                value: ${magma.ldflags} ${magma.libs}

        - name: -DCMAKE_SHARED_LINKER_FLAGS
          enabled_value:
            conditions:
              - condition: ${dftbplus.config.-DWITH_MPI} true && ${dftbplus.config.-DWITH_ELSI} false
                value: ${scalapack.ldflags} ${scalapack.libs}
              - condition: ${dftbplus.config.-DWITH_MPI} true && ${dftbplus.config.-DWITH_ELSI} true
                value: ${scalapack.ldflags} ${scalapack.libs} ${elsi.ldflags} ${elsi.libs} ${elpa.ldflags}
              - condition: ${dftbplus.config.-DWITH_MPI} false && ${dftbplus.config.-DWITH_GPU} true
                value: ${magma.ldflags} ${magma.libs}

        - name: -DCMAKE_BUILD_RPATH
          enabled:
            default: false
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                value: true
          enabled_value:
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                value: ${cuda.prefix}/lib64

        - name: -DCMAKE_INSTALL_RPATH
          enabled:
            default: false
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                value: true
          enabled_value:
            conditions:
              - condition: ${dftbplus.config.-DWITH_GPU} true
                value: ${cuda.prefix}/lib64

    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${dftbplus.prefix}/lib -Wl,-rpath,${dftbplus.prefix}/lib
    libs:
      default: -ldftbplus
    includes:
      default: -I${dftbplus.prefix}/include
