---
recipe:
    name: dftbplus
    description: DFTB+ - Density Functional Tight Binding molecular dynamics
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 25.1
              url: https://github.com/dftbplus/dftbplus/releases/download/25.1/dftbplus-25.1.tar.xz

    dependencies:
        - mpi
        - blas
        - lapack
        - scalapack

    build:
        configurations:
            options:
                - name: WITH_MPI
                  user_configurable: true
                  enabled_format: WITH_MPI=ON
                  disabled_format: WITH_MPI=OFF
                  requires: [mpi]

                - name: WITH_OMP
                  user_configurable: true
                  enabled_format: WITH_OMP=ON
                  disabled_format: WITH_OMP=OFF

                - name: WITH_ELSI
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: WITH_ELSI=ON
                  disabled_format: WITH_ELSI=OFF
                  requires: [elsi]

                - name: WITH_GPU
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: WITH_GPU=ON
                  disabled_format: WITH_GPU=OFF
                  requires: [cuda]

                - name: CUDAToolkit_ROOT
                  enabled:
                      default: false
                      conditions:
                          - condition: ${dftbplus.config.WITH_GPU} true
                            value: true
                  enabled_value:
                      default: ${cuda.prefix}
                  requires: [cuda]

                - name: MAGMA_INCLUDE_DIRECTORY
                  enabled:
                      default: false
                      conditions:
                          - condition: ${dftbplus.config.WITH_GPU} true && ${dftbplus.config.WITH_MPI} false
                            value: true
                  enabled_value:
                      default: ${magma.prefix}/include
                  requires: [magma]

                - name: BLAS_LIBRARY
                  enabled_value:
                      default: ${blas.ldflags};${blas.libs}

                - name: LAPACK_LIBRARY
                  enabled_value:
                      default: ${lapack.ldflags};${lapack.libs}

                - name: SCALAPACK_LIBRARY
                  enabled:
                      default: false
                      conditions:
                          - condition: ${dftbplus.config.WITH_MPI} true
                            value: true
                  enabled_value:
                      default: ${scalapack.ldflags};${scalapack.libs}
                  requires: [scalapack]

                - name: CMAKE_C_FLAGS
                  user_configurable: true
                  enabled_value:
                      default: -O3
                      conditions:
                          - condition: ${dftbplus.config.WITH_GPU} true
                            action: append
                            value: -I${cuda.prefix}/include

                - name: CMAKE_EXE_LINKER_FLAGS
                  enabled_value:
                      conditions:
                          - condition: ${dftbplus.config.WITH_MPI} true && ${dftbplus.config.WITH_ELSI} false
                            value: ${scalapack.ldflags} ${scalapack.libs}
                          - condition: ${dftbplus.config.WITH_MPI} true && ${dftbplus.config.WITH_ELSI} true
                            value: ${scalapack.ldflags} ${scalapack.libs} ${elsi.ldflags} ${elsi.libs} ${elpa.ldflags}
                          - condition: ${dftbplus.config.WITH_MPI} false && ${dftbplus.config.WITH_GPU} true
                            value: ${magma.ldflags} ${magma.libs}

                - name: CMAKE_SHARED_LINKER_FLAGS
                  enabled_value:
                      conditions:
                          - condition: ${dftbplus.config.WITH_MPI} true && ${dftbplus.config.WITH_ELSI} false
                            value: ${scalapack.ldflags} ${scalapack.libs}
                          - condition: ${dftbplus.config.WITH_MPI} true && ${dftbplus.config.WITH_ELSI} true
                            value: ${scalapack.ldflags} ${scalapack.libs} ${elsi.ldflags} ${elsi.libs} ${elpa.ldflags}
                          - condition: ${dftbplus.config.WITH_MPI} false && ${dftbplus.config.WITH_GPU} true
                            value: ${magma.ldflags} ${magma.libs}

        stages:
            - target:
            - target: install

    properties:
        lib: ${dftbplus.prefix}/lib
        libs:
            default: -ldftbplus
        include: ${dftbplus.prefix}/include
