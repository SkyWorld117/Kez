---
recipe:
    name: libxcb
    description: X C Bindings library
    type: package
    toolchain: autotools

    dependencies:
        - xorgproto
        - xcb-proto
        - libxau
        - libxdmcp
        - util-macros

    source:
        type: tarball
        releases:
            - version: 1.17
              url: https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.gz
        # url: https://xcb.freedesktop.org/dist/libxcb-1.17.tar.xz

    build:
        configurations:
            environment:
                - name: PKG_CONFIG_PATH
                  description: Path to look for pkg-config files
                  default: 
                      ${xcb-proto.prefix}/share/pkgconfig:${libxau.prefix}/share/pkgconfig:${libxdmcp.prefix}/share/pkgconfig:${xorgproto.prefix}/share/pkgconfig:${util-macros.prefix}/share/pkgconfig
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxcb.prefix}/lib
        libs:
            default: -lxcb
        include: ${libxcb.prefix}/include
