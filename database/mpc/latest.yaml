---
recipe:
    name: mpc
    description: GNU MPC Library for multiple precision complex arithmetic
    type: system
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.3.1
              url: https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz

    dependencies:
        - gmp
        - mpfr

    build:
        configurations:
            options:
                - name: enable-shared
                  description: Build shared libraries

                - name: enable-static
                  description: Build static libraries

                - name: with-gmp
                  description: Specify GMP installation prefix
                  enabled_value:
                      default: ${gmp.prefix}

                - name: with-mpfr
                  description: Specify MPFR installation prefix
                  enabled_value:
                      default: ${mpfr.prefix}

        stages:
            - target:
            - target: install

    properties:
        lib: ${mpc.prefix}/lib
        libs:
            default: -lmpc
        include: ${mpc.prefix}/include
