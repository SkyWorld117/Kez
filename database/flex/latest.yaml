---
recipe:
    name: flex
    description: Fast Lexical Analyzer Generator
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2.6.4
              url: https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz

    build:
        configurations:
            options:
                - name: CFLAGS
                  description: C compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3
        stages:
            - target:
            - target: install

    properties:
        lib: ${flex.prefix}/lib
        libs:
            default: -lfl
        include: ${flex.prefix}/include
