---
recipe:
    name: mgard
    description: MGARD is a multigrid-based lossy compression library for scientific data.
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/CODARcode/MGARD.git
        releases:
            - version: 1.6.0
              tag: 1.6.0

    dependencies:
        - zlib
        - zstd
        - protobuf

    build:
        # Only build the CPU version for now
        configurations:
            options:
                - name: MGARD_ENABLE_SERIAL
                  description: Enable CPU support
                  enabled_value:
                      default: ON

                - name: MGARD_ENABLE_OPENMP
                  description: Enable OpenMP support
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: MGARD_ENABLE_DOCS
                  description: Build documentation
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
        lib: ${mgard.prefix}/lib64
        libs:
            default: -lmgard
        include: ${mgard.prefix}/include
