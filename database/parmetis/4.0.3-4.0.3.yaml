---
recipe:
    name: parmetis
    description: ParMETIS is an MPI-based library for partitioning graphs, partitioning finite element meshes, and producing fill reducing orderings 
        for sparse matrices.
    type: package
    toolchain: make

    source:
        type: tarball
        releases:
            # ParMETIS 4.0.3 is the original release that pairs with METIS 5.1.0.
            # It bundles a byte-identical copy of the METIS 5.1.0 sources, which
            # are compiled into libparmetis, so an external METIS/GKlib are not
            # needed to build it; the metis dependency below only provides the
            # library for consumers to link against.
            - version: 4.0.3
              url: http://papers.karypis.org/glaros/files/sw/parmetis/parmetis-4.0.3.tar.gz

    dependencies:
        - mpi
        # Keep the pairing with the bundled METIS 5.1.0 line (before GKlib
        # became an external dependency of METIS).
        - metis@<5.2.0

    build:
        preprocessing: |-
            sed -i 's|cd $(BUILDDIR) && cmake $(CURDIR) $(CONFIG_FLAGS)|cd $(BUILDDIR) \&\& cmake $(CURDIR) $(CONFIG_FLAGS) -DCMAKE_POLICY_VERSION_MINIMUM=3.5|' Makefile
        stages:
            - target: config
              configurations:
                  options:
                      - name: prefix
                        description: Installation prefix
                        enabled_value:
                            default: ${parmetis.prefix}

                      - name: cc
                        description: C compiler
                        enabled_value:
                            default: ${mpi.c}

                      # parmetis-4.0.3 defaults cxx to the bare 'mpicxx' command,
                      # which is only valid with the MPI bin directory on PATH,
                      # so the full path is passed explicitly.
                      - name: cxx
                        description: C++ compiler
                        enabled_value:
                            default: ${mpi.cxx}

                      - name: shared
                        description: Build shared library
                        user_configurable: true
                        enabled_value:
                            default: '1'

            - target: install

    properties:
        lib: ${parmetis.prefix}/lib
        # The bundled METIS 5.1.0 sources are compiled into libparmetis.
        libs:
            default: -lparmetis -lmetis
        include: ${parmetis.prefix}/include
