---
recipe:
    name: python
    description: Python Programming Language
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 3.14.6
              url: https://www.python.org/ftp/python/3.14.6/Python-3.14.6.tar.xz
            - version: 3.13.14
              url: https://www.python.org/ftp/python/3.13.14/Python-3.13.14.tar.xz
            - version: 3.12.13
              url: https://www.python.org/ftp/python/3.12.13/Python-3.12.13.tar.xz
            - version: 3.11.15
              url: https://www.python.org/ftp/python/3.11.15/Python-3.11.15.tar.xz
            - version: 3.10.20
              url: https://www.python.org/ftp/python/3.10.20/Python-3.10.20.tar.xz

    build:
        configurations:
            options:
                - name: enable-shared
                  description: Build shared library

                - name: enable-optimizations
                  description: Enable optimizations

        stages:
            - target:
            - target: install

    properties:
        lib: ${python.prefix}/lib
        libs:
            default: -lpython3
        include: ${python.prefix}/include
