---
recipe:
    name: python
    description: Python Programming Language
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 3.13.9
              url: https://www.python.org/ftp/python/3.13.9/Python-3.13.9.tar.xz
            - version: 3.12.12
              url: https://www.python.org/ftp/python/3.12.12/Python-3.12.12.tar.xz
            - version: 3.11.14
              url: https://www.python.org/ftp/python/3.11.14/Python-3.11.14.tar.xz
            - version: 3.10.19
              url: https://www.python.org/ftp/python/3.10.19/Python-3.10.19.tar.xz

    build:
        configurations:
            options:
                - name: enable-shared
                  description: Build shared library

                - name: enable-optimizations
                  description: Enable optimizations

        stages:
            - target:
            - target: install

    properties:
        lib: ${python.prefix}/lib
        libs:
            default: -lpython3
        include: ${python.prefix}/include
