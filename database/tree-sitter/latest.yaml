---
recipe:
    name: tree-sitter
    description: tree-sitter - a parser generator tool and an incremental parsing library
    type: package

    source:
        type: zip
        releases:
            - version: 0.26.11
              url: https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.11/tree-sitter-cli-linux-${kez.arch.tree-sitter}.zip

    build:
        postprocessing: |-
            mkdir -p ${tree-sitter.prefix}/bin
            cp tree-sitter* ${tree-sitter.prefix}/bin/
