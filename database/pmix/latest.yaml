---
recipe:
    name: pmix
    description: Process Management Interface for Exascale
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 6.1.0
              url: https://github.com/openpmix/openpmix/releases/download/v6.1.0/pmix-6.1.0.tar.gz
            - version: 6.0.0
              url: https://github.com/openpmix/openpmix/releases/download/v6.0.0/pmix-6.0.0.tar.gz

    dependencies:
        - hwloc
        - libevent

    build:
        configurations:
            options:
                - name: with-hwloc
                  description: Specify hwloc installation path
                  enabled_value:
                      default: ${hwloc.prefix}

                - name: with-libevent
                  description: Specify libevent installation path
                  enabled_value:
                      default: ${libevent.prefix}

                - name: with-cuda
                  description: Virtual option to include CUDA if used in hwloc
                  enabled:
                      default: false
                      conditions:
                          - condition: ${hwloc.config.use_cuda} true
                            value: true
                  enabled_format: ''
                  disabled_format: ''
                  requires:
                      - cuda

                - name: with-libpciaccess
                  description: Virtual option to include libpciaccess if used in hwloc
                  enabled:
                      default: false
                      conditions:
                          - condition: ${hwloc.config.use_pciaccess} true
                            value: true
                  enabled_format: ''
                  disabled_format: ''
                  requires:
                      - libpciaccess

        stages:
            - target:
            - target: install

    properties:
        lib: ${pmix.prefix}/lib
        libs:
            default: -lpmix
        include: ${pmix.prefix}/include
