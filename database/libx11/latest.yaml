---
recipe:
    name: libx11
    description: X11 client-side library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.8.12
              url: https://www.x.org/archive/individual/lib/libX11-1.8.12.tar.gz

    dependencies:
        - xorgproto
        - libxcb
        - xtrans

    build:
        configurations:
            environment:
                - name: ACLOCAL_PATH
                  description: aclocal search path
                  default: ${xorgproto.prefix}/share/aclocal
                - name: PKG_CONFIG_PATH
                  description: pkg-config search path
                  default: ${xtrans.prefix}/share/pkgconfig

        stages:
            - target:
            - target: install

    properties:
        lib: ${libx11.prefix}/lib
        libs:
            default: -lX11
        include: ${libx11.prefix}/include
