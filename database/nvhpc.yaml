cheese:
  name: nvhpc
  type: vendor

  source:
    type: tarball
    releases:
      - version: 26.3
        url: https://developer.download.nvidia.com/hpc-sdk/26.3/nvhpc_2026_263_Linux_${fromager.arch}_cuda_13.1.tar.gz
      - version: 25.7
        url: https://developer.download.nvidia.com/hpc-sdk/25.7/nvhpc_2025_257_Linux_${fromager.arch}_cuda_12.9.tar.gz

  build:
    postprocessing: |-
      mkdir -p ${nvhpc.prefix}
      NVHPC_SILENT=true NVHPC_INSTALL_DIR=${nvhpc.prefix} ${source}/install

  properties:
    nccl_ldflags:
      default: -L${nvhpc.prefix}/Linux_${fromager.arch}/${nvhpc.version}/comm_libs/nccl/lib -Wl,-rpath,${nvhpc.prefix}/Linux_${fromager.arch}/${nvhpc.version}/comm_libs/nccl/lib
    nccl_libs:
      default: -lnccl
    nccl_prefix:
      default: ${nvhpc.prefix}/Linux_${fromager.arch}/${nvhpc.version}/comm_libs/nccl
    nvshmem_ldflags:
      default: -L${nvhpc.prefix}/Linux_${fromager.arch}/${nvhpc.version}/comm_libs/nvshmem/lib -Wl,-rpath,${nvhpc.prefix}/Linux_${fromager.arch}/${nvhpc.version}/comm_libs/nvshmem/lib
    nvshmem_libs:
      default: -lnvshmem
