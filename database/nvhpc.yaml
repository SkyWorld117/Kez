cheese:
  name: nvhpc
  type: vendor

  source:
    type: tarball
    releases:
      - version: 25.7 #TODO sophia will fix this shit:)
        url: https://developer.download.nvidia.com/hpc-sdk/25.7/nvhpc_2025_257_Linux_x86_64_cuda_12.9.tar.gz

  build:
    postprocessing: >
      mkdir -p ${nvhpc.prefix} &&
      NVHPC_SILENT=true NVHPC_INSTALL_DIR=${nvhpc.prefix} ${source}/install

  properties:
    nccl_ldflags:
      default: -L${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nccl/lib -Wl,-rpath,${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nccl/lib
    nccl_libs:
      default: -lnccl
    nccl_prefix:
      default: ${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nccl
    nvshmem_ldflags:
      default: -L${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nvshmem/lib -Wl,-rpath,${nvhpc.prefix}/Linux_x86_64/25.7/comm_libs/nvshmem/lib
    nvshmem_libs:
      default: -lnvshmem
