---
recipe:
    name: nodejs
    description: Node.js - a JavaScript runtime built on Chrome's V8 JavaScript engine
    type: package

    source:
        type: tarball
        releases:
            - version: 26.5.0
              url: https://nodejs.org/dist/v26.5.0/node-v26.5.0-linux-${kez.arch.nodejs}.tar.xz
            - version: 24.15.0
              url: https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-${kez.arch.nodejs}.tar.xz

    build:
        postprocessing: |-
            mkdir -p ${nodejs.prefix}
            cp -r ${source}/* ${nodejs.prefix}/
