---
recipe:
    name: libxext
    description: X11 miscellaneous extensions library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.3.7
              url: https://www.x.org/releases/individual/lib/libXext-1.3.7.tar.xz

    dependencies:
        - libx11
        - libxcb
        - libxau

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxext.prefix}/lib
        libs:
            default: -lXext
        include: ${libxext.prefix}/include
