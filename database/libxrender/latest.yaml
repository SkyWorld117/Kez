---
recipe:
    name: libxrender
    description: X Rendering Extension library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 0.9.12
              url: https://www.x.org/releases/individual/lib/libXrender-0.9.12.tar.xz

    dependencies:
        - xorgproto
        - util-macros

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxrender.prefix}/lib
        libs:
            default: -lXrender
        include: ${libxrender.prefix}/include
