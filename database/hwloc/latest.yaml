---
recipe:
    name: hwloc
    description: Hardware Locality
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2.12.1
              url: https://download.open-mpi.org/release/hwloc/v2.12/hwloc-2.12.1.tar.gz

    dependencies:
        - zlib
        - lz4
        - libpciaccess
        - libxml2

    build:
        configurations:
            options:
                - name: use_cuda
                  description: Use CUDA support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: enable-cuda
                  disabled_format: disable-cuda
                  requires: [cuda]

                - name: with-cuda
                  description: Specify CUDA installation path
                  enabled:
                      conditions:
                          - condition: ${hwloc.config.use_cuda} true
                            value: true
                          - condition: ${hwloc.config.use_cuda} false
                            value: false
                  enabled_value:
                      conditions:
                          - condition: ${hwloc.config.use_cuda} true
                            value: ${cuda.prefix}

                - name: with-cuda-version
                  description: Specify CUDA version
                  enabled:
                      conditions:
                          - condition: ${hwloc.config.use_cuda} true
                            value: true
                          - condition: ${hwloc.config.use_cuda} false
                            value: false
                  enabled_value:
                      conditions:
                          - condition: ${hwloc.config.use_cuda} true
                            value: ${cuda.version}

                - name: use_rocm
                  description: Use ROCm support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: enable-rsmi
                  disabled_format: disable-rsmi
                  requires: [rocm]
                - name: with-rocm
                  description: Specify ROCm installation path
                  enabled:
                      conditions:
                          - condition: ${hwloc.config.use_rocm} true
                            value: true
                          - condition: ${hwloc.config.use_rocm} false
                            value: false
                  enabled_value:
                      conditions:
                          - condition: ${hwloc.config.use_rocm} true
                            value: ${rocm.prefix}

                - name: with-rocm-version
                  description: Specify ROCm version
                  enabled:
                      conditions:
                          - condition: ${hwloc.config.use_rocm} true
                            value: true
                          - condition: ${hwloc.config.use_rocm} false
                            value: false
                  enabled_value:
                      conditions:
                          - condition: ${hwloc.config.use_rocm} true
                            value: ${rocm.version}

        stages:
            - target:
            - target: install

    properties:
        lib: ${hwloc.prefix}/lib
        libs:
            default: -lhwloc
        include: ${hwloc.prefix}/include
