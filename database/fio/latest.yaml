---
recipe:
    name: fio
    description: Flexible I/O tester
    type: package

    source:
        type: tarball
        releases:
            - version: 3.42
              url: https://github.com/axboe/fio/archive/refs/tags/fio-3.42.tar.gz

    dependencies:
        - libaio

    build:
        configurations:
            command: ./configure
            options:
                - name: --extra-cflags
                  description: C Flags
                  user_configurable: true
                  enabled_value:
                      default: -O3 ${libaio.includes}

                - name: --extra-ldflags
                  description: LD flags
                  enabled_value:
                      default: ${libaio.ldflags}

                - name: --cc
                  description: C compiler
                  enabled_value:
                      default: ${compiler.c}

                - name: --prefix
                  description: Installation prefix
                  enabled_value:
                      default: ${fio.prefix}
        stages:
            - target:
              configurations:
                  command: make -j${KEZ_NPROC}
            - target: install
              configurations:
                  command: make -j${KEZ_NPROC} install
