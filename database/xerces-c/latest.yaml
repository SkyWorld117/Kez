---
recipe:
    name: xerces-c
    description: Xerces-C is a validating XML parser written in a portable subset of C++.
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 3.3.0
              url: https://dlcdn.apache.org//xerces/c/3/sources/xerces-c-3.3.0.tar.gz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${xerces-c.prefix}/lib
        include: ${xerces-c.prefix}/include
