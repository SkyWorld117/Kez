---
recipe:
    name: exascale-climate-emulator
    description: Exascale Climate Emulator (ECE) is a software framework for emulating climate model output at exascale resolutions.
    type: package
    toolchain: cmake

    # Private for RACKlette team use only
    source:
        type: git
        url: git@github.com:Team-RACKlette/SCC25-ClimateEmulator.git
        releases:
            - version: scc25
              tag: climate_emulator

    dependencies:
        - mpi
        - blas
        - lapack

    build:
        preprocessing: git submodule update --init --recursive
        postprocessing: |-
            mkdir -p ${exascale-climate-emulator.prefix}
            cp -r tests/* ${exascale-climate-emulator.prefix}/bin/
            old_rpath=$(patchelf --print-rpath ${exascale-climate-emulator.prefix}/bin/testing_climate_emulator)
            new_rpath=$(echo "$old_rpath" | tr ':' '\n' | grep -v '/\.tmp/source' | tr '\n' ':')
            new_rpath="$new_rpath:${exascale-climate-emulator.prefix}/lib:${exascale-climate-emulator.prefix}/lib64"
            patchelf --set-rpath "$new_rpath" ${exascale-climate-emulator.prefix}/bin/testing_climate_emulator

        configurations:
            options:
                - name: CMAKE_INTERPROCEDURAL_OPTIMIZATION
                  description: Enable interprocedural optimization (IPO)
                  enabled_value:
                      default: ON

                - name: BLA_VENDOR
                  description: BLAS vendor [Goto, ATLAS PhiPACK, CXML, DXML, SunPerf, SCSL, SGIMATH, IBMESSL, IBMESSLMT, Intel10_32 (intel mkl v10 32 
                      bit), Intel10_64lp (intel mkl v10 64 bit, lp thread model, lp64 model), Intel10_64lp_seq (intel mkl v10 64 bit, sequential code,
                      lp64 model), Intel( older versions of mkl 32 and 64 bit), ACML, ACML_MP, ACML_GPU, Apple, NAS, Generic]
                  user_configurable: true
                  enabled_value:
                      default: Generic

                - name: HICMA_PARSEC_HAVE_CUDA
                  description: Enable CUDA support in HiCMA
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda]

                - name: PARSEC_GPU_WITH_CUDA
                  description: Enable CUDA support in PaRSEC
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda]

                - name: CMAKE_CUDA_ARCHITECTURES
                  description: CUDA architectures
                  user_configurable: true
                  enabled:
                      conditions:
                          - condition: ${exascale-climate-emulator.config.PARSEC_GPU_WITH_CUDA} true
                            value: true
                          - condition: ${exascale-climate-emulator.config.PARSEC_GPU_WITH_CUDA} false
                            value: false
                  enabled_value:
                      default: none

                - name: CMAKE_INCLUDE_PATH
                  description: Include paths
                  enabled_value:
                      default: ${blas.prefix}/include;${lapack.prefix}/include
                      conditions:
                          - condition: ${exascale-climate-emulator.config.PARSEC_GPU_WITH_CUDA} true
                            action: append
                            value: ;${cuda.prefix}/include
        stages:
            - target:
            - target: install

    properties:
