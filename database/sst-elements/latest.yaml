---
recipe:
    name: sst-elements
    description: Structural Simulation Toolkit Elements
    type: package
    toolchain: autotools

    source:
        type: git
        url: https://github.com/sstsimulator/sst-elements.git
        releases:
            - version: scc25
              tag: 22504be
            - version: latest
              tag: master

    dependencies:
        - sst-core
        - mpi
        - python

    build:
        preprocessing: ${python.prefix}/bin/pip3 install numpy; ./autogen.sh
        postprocessing: |-
            mkdir -p ${sst-elements.prefix}/src
            cp -r ${source}/src/* ${sst-elements.prefix}/src/
            sed -i 's|${source}|${sst-elements.prefix}|g' ${sst-core.prefix}/etc/sst/sstsimulator.conf

        configurations:
            options:
                - name: with-sst-core
                  description: Path to SST Core installation
                  enabled_value:
                      default: ${sst-core.prefix}

                - name: with-dramsim3
                  description: Enable DRAMSim3 support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${dramsim3.prefix}
                  disabled_format: without-dramsim3
                  requires: [dramsim3]

                - name: with-pin
                  description: Enable Intel PIN support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${intelpin.prefix}
                  disabled_format: without-pin
                  requires: [intelpin]

                - name: with-goblin-hmcsim
                  description: Enable Goblin HMC Sim support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${goblinhmcsim.prefix}
                  disabled_format: without-goblinhmcsim
                  requires: [goblinhmcsim]

                - name: with-ramulator2
                  description: Enable Ramulator2 support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${ramulator2.prefix}
                  disabled_format: without-ramulator2
                  requires: [ramulator2]

                - name: MPICC
                  description: MPI C compiler
                  enabled_value:
                      default: ${mpi.c}

                - name: MPICXX
                  description: MPI C++ compiler
                  enabled_value:
                      default: ${mpi.cxx}

        stages:
            - target:
            - target: install

    properties:
        lib: ${sst-elements.prefix}/lib
        include: ${sst-elements.prefix}/include
