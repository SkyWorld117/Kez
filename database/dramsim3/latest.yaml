---
recipe:
    name: dramsim3
    description: DRAM Simulator 3
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 1.0.0
              url: https://github.com/umd-memsys/DRAMsim3/archive/refs/tags/1.0.0.tar.gz

    build:
        postprocessing: |-
            mkdir -p ${dramsim3.prefix}/build
            cp ${source}/build/dramsim3main ${dramsim3.prefix}/build
            cp ${source}/libdramsim3.so ${dramsim3.prefix}

        configurations:
            options:
                - name: CMAKE_POLICY_VERSION_MINIMUM
                  description: CMake policy version minimum
                  enabled_value:
                      default: 3.15
        stages:
            - target:

    properties:
        lib: ${dramsim3.prefix}
        libs:
            default: -ldramsim3
