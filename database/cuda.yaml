# Dummy config file, CUDA version should be determined by the system CUDA driver.
# This should be installed by the `cheese_init` script.

cheese:
  name: cuda
  description: NVIDIA CUDA Toolkit
  type: system

  source:
    type: tarball
    releases:
      - version: 12.9-x86_64
        url: https://developer.download.nvidia.com/compute/cuda/12.9.1/local_installers/cuda_12.9.1_575.57.08_linux.run
      - version: 12.9-aarch64
        url: https://developer.download.nvidia.com/compute/cuda/12.9.1/local_installers/cuda_12.9.1_575.57.08_linux_sbsa.run
      - version: 12.8-x86_64
        url: https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/cuda_12.8.1_570.124.06_linux.run
      - version: 12.8-aarch64
        url: https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/cuda_12.8.1_570.124.06_linux_sbsa.run
      - version: 12.6-x86_64
        url: https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_560.35.05_linux.run
      - version: 12.6-aarch64
        url: https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_560.35.05_linux_sbsa.run
      - version: 12.5-x86_64
        url: https://developer.download.nvidia.com/compute/cuda/12.5.1/local_installers/cuda_12.5.1_555.42.06_linux.run
      - version: 12.5-aarch64
        url: https://developer.download.nvidia.com/compute/cuda/12.5.1/local_installers/cuda_12.5.1_555.42.06_linux_sbsa.run
      - version: 12.4-x86_64
        url: https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_550.54.15_linux.run
      - version: 12.4-aarch64
        url: https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_550.54.15_linux_sbsa.run

  properties:
    ldflags:
      default: -L${cuda.prefix}/lib64 -Wl,-rpath,${cuda.prefix}/lib64
    libs:
      default: -lcudart -lcublas -lcufft -lcusolver -lcudnn -lcusparse -lcurand
    includes:
      default: -I${cuda.prefix}/include