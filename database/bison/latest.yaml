---
recipe:
    name: bison
    description: Bison is a general-purpose parser generator that converts a grammar description for an LALR(1) context-free grammar into a C program 
        to parse that grammar.
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 3.8.2
              url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${bison.prefix}/lib
        libs:
            default: -lbison
        include: ${bison.prefix}/include
