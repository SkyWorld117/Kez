recipe:
  name: bison
  description: Bison is a general-purpose parser generator that converts a grammar description for an LALR(1) context-free grammar into a C program to parse that grammar.
  type: package
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 3.8.2
        url: https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz

  build:
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${bison.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${bison.prefix}/lib -Wl,-rpath,${bison.prefix}/lib
    libs:
      default: -lbison
    includes:
      default: -I${bison.prefix}/include