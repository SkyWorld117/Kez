---
recipe:
    name: mpip
    description: mpiP is a light-weight profiling library for MPI applications. Because it only collects statistical information about MPI functions, 
        mpiP generates considerably less overhead and much less data than tracing tools. All the information captured by mpiP is task-local. It only 
        uses communication during report generation, typically at the end of the experiment, to merge results from all of the tasks into one output 
        file.
    type: package
    toolchain: autotools
    author: llnl

    source:
        type: tarball
        releases:
            - version: 3.5
              url: https://github.com/llnl/mpiP/archive/refs/tags/3.5.tar.gz

    dependencies:
        - mpi
        - libunwind

    build:
        configurations:
            options:
                - name: disable-option-checking
                  description: ignore unrecognized --enable/--with options
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-api-only
                  description: Only build the API library.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-io
                  description: Disable MPI-I/O reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-rma
                  description: Disable MPI RMA reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-nbc
                  description: Disable MPI NONBLOCKINGCOLLECTIVES reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-pcoll
                  description: Disable MPI PERSISTENTCOLLECTIVES reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-isendrecv
                  description: MPI ISENDRECV reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-mpi-partitioned
                  description: Disable MPI PARTITIONED reporting.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-bfd
                  description: Do not use GNU binutils libbfd for source lookup.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-libunwind
                  description: Do not use libunwind to generate stack traces.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-so-lookup
                  description: Disable functionality to attempt to find source info in shared objects.
                  user_configurable: true
                  enabled:
                      default: false
                - name: enable-setjmp
                  description: Use setjmp instead of glic backtrace() to generate stack traces.
                  user_configurable: true
                  enabled:
                      default: false

                - name: disable-fortranxlate
                  description: Disable translation of Fortran opaque objects.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-fortranweak
                  description: Generate weak symbols for additional Fortran symbol name styles.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-stackdepth
                  description: Specify maximum report stacktrace depth (default is 8).
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: 8

                - name: enable-internal-stackdepth
                  description: Specify number of internal stack frames (default is 3).
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: 3

                - name: enable-maxargs
                  description: Maximum number of command line arguments copied (default is 32).
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: 32

                - name: enable-dwarf
                  description: Use DWARF library for source lookup.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-getarg
                  description: Use getarg to get fortran command line args.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-demangling
                  description: Specify GNU, IBM, or Compaq demangling support.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-check-time
                  description: Enable AIX check for negative time values.
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-collective-report-default
                  description: Have mpiP default to low-memory-use collective report generation as opposed to collecting all data at a single task 
                      (see runtime flags -l and -s).
                  user_configurable: true
                  enabled:
                      default: false

                - name: enable-concise-report-default
                  description: Have mpiP default to a concise summary report format. (see runtime flags -c and -v).
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-libunwind
                  description: Specify location of libunwind to merge.
                  enabled:
                      default: false
                      conditions:
                          - condition: ${mpip.config.disable-libunwind} false
                            action: set
                            value: true
                  enabled_value:
                      default: ${libunwind.prefix}

                - name: with-bin-type-flag
                  description: Binary format for AIX ar operations.
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-gettimeofday
                  description: Use gettimeofday for timing.
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-wtime
                  description: Use MPI_Wtime for timing.
                  user_configurable: true
                  enabled:
                      default: true

                - name: with-clock_gettime
                  description: Use clock_gettime for timing.
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-rts_get_timebase
                  description: Use rts_get_timebase for timing on BG/L systems (default for BG/L).
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-read_real_time
                  description: Use read_real_time for timing on AIX systems (default for AIX).
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-rtc
                  description: Use _rtc for timing on CRAY X1 systems (default for X1).
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-dclock
                  description: Use Catamount dclock for timing.
                  user_configurable: true
                  enabled:
                      default: false

                - name: CFLAGS
                  description: C compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3 ${compiler.includes} ${mpi.includes}
                      conditions:
                          - condition: ${mpip.config.disable-libunwind} false
                            action: append
                            value: ${libunwind.includes}

                - name: LDFLAGS
                  description: linker flags, e.g. -L<lib dir> if you have libraries in a nonstandard directory <lib dir>
                  enabled_value:
                      default: ${compiler.ldflags} ${mpi.ldflags}
                      conditions:
                          - condition: ${mpip.config.disable-libunwind} false
                            action: append
                            value: ${libunwind.ldflags}

                - name: LIBS
                  description: libraries to pass to the linker, e.g. -l<library>
                  enabled:
                      default: false
                      conditions:
                          - condition: ${mpip.config.disable-libunwind} false
                            action: set
                            value: true
                  enabled_value:
                      default: ${libunwind.libs}

                - name: CPPFLAGS
                  description: (Objective) C/C++ preprocessor flags, e.g. -I<include dir> if you have headers in a nonstandard directory <include dir>
                  enabled_value:
                      default: ${compiler.includes} ${mpi.includes}
                      conditions:
                          - condition: ${mpip.config.disable-libunwind} false
                            action: append
                            value: ${libunwind.includes}

                - name: F77
                  description: Fortran 77 compiler command
                  enabled_value:
                      default: ${mpi.fort}

                - name: FFLAGS
                  description: Fortran 77 compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3

        stages:
            - target:
            - target: install

    properties:
