---
recipe:
    name: metis
    description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing orderings 
        for sparse matrices.
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            # Newer versions of METIS are neither stable nor much more performant
            # We stick to version 5.1.0 which is the last stable release and works well for our use cases
            - version: 5.1.0
              url: http://papers.karypis.org/glaros/files/sw/metis/metis-5.1.0.tar.gz

    # GKlib is made as an external dependency of METIS starting from version 5.2.1
    # Notice it is contained in the prior versions of METIS, so we don't need to install it separately

    # dependencies:
    #   - gklib

    build:
        configurations:
            options:
                - name: OPENMP
                  description: Enable OpenMP support
                  user_configurable: true
                  enabled_value:
                      default: '1'

                - name: SHARED
                  description: Build shared library
                  user_configurable: true
                  enabled_value:
                      default: '1'

                - name: GKLIB_PATH
                  description: Path to GKlib
                  enabled_value:
                      default: ${source}/GKlib

                - name: CMAKE_POLICY_VERSION_MINIMUM
                  description: Minimum CMake policy version
                  enabled_value:
                      default: 3.5
        stages:
            - target:
            - target: install

    properties:
        lib: ${metis.prefix}/lib
        libs:
            default: -lmetis -lGKlib
        include: ${metis.prefix}/include
