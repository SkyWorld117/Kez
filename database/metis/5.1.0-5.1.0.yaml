---
recipe:
    name: metis
    description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing orderings 
        for sparse matrices.
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            # Before version 5.2.1 GKlib is bundled with METIS and compiled into
            # libmetis, so this recipe needs no external GKlib. It covers METIS
            # 5.1.0, the last release of that line.
            - version: 5.1.0
              url: http://papers.karypis.org/glaros/files/sw/metis/metis-5.1.0.tar.gz

    build:
        configurations:
            options:
                - name: OPENMP
                  description: Enable OpenMP support
                  user_configurable: true
                  enabled_value:
                      default: '1'

                - name: SHARED
                  description: Build shared library
                  user_configurable: true
                  enabled_value:
                      default: '1'

                - name: GKLIB_PATH
                  description: Path to GKlib
                  enabled_value:
                      default: ${source}/GKlib

                - name: CMAKE_POLICY_VERSION_MINIMUM
                  description: Minimum CMake policy version
                  enabled_value:
                      default: 3.5
        stages:
            - target:
            - target: install

    properties:
        lib: ${metis.prefix}/lib
        # GKlib is compiled into libmetis for 5.1.0, so -lGKlib is not needed.
        libs:
            default: -lmetis
        include: ${metis.prefix}/include
