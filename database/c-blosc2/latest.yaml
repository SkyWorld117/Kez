---
recipe:
    name: c-blosc2
    description: A high-performance compressor optimized for binary data
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/Blosc/c-blosc2.git
        releases:
            - version: 3.2.3
              tag: v3.2.3
            - version: 3.1.5
              tag: v3.1.5
            - version: 3.0.3
              tag: v3.0.3
            - version: 2.10.1
              tag: v2.10.1

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${c-blosc2.prefix}/lib64
        libs:
            default: -lblosc2
        include: ${c-blosc2.prefix}/include
