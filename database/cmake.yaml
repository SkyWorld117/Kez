cheese:
  name: cmake
  description: CMake is a cross-platform, open-source build system generator
  type: package

  source:
    type: script
    releases:
      - version: v3.29.0
        url: https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-linux-aarch64.sh

  build:
    postprocessing: bash ${source} --skip-license --prefix=${cmake.prefix}

