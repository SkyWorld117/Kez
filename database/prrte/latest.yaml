---
recipe:
    name: prrte
    description: PMIx Reference RunTime Environment
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 4.0.0
              url: https://github.com/openpmix/prrte/releases/download/v4.0.0/prrte-4.0.0.tar.gz

    dependencies:
        - hwloc
        - libevent
        - pmix

    build:
        configurations:
            options:
                - name: with-libevent
                  description: Specify libevent installation path
                  enabled_value:
                      default: ${libevent.prefix}

                - name: with-pmix
                  description: Specify PMIx installation path
                  enabled_value:
                      default: ${pmix.prefix}

                - name: with-hwloc
                  description: Specify hwloc installation path
                  enabled_value:
                      default: ${hwloc.prefix}

                - name: with-slurm
                  description: Enable Slurm support

        stages:
            - target:
            - target: install

    properties:
        lib: ${prrte.prefix}/lib
        libs:
            default: -lprrte
        include: ${prrte.prefix}/include
