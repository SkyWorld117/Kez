---
recipe:
    name: libaio
    description: The Linux-native asynchronous I/O facility
    type: package
    toolchain: make

    source:
        type: git
        url: https://github.com/JingchengLi/libaio.git
        releases:
            - version: master
              tag: master

    build:
        stages:
            - target: install
              configurations:
                  options:
                      - name: prefix
                        description: Installation prefix
                        enabled_value:
                            default: ${libaio.prefix}

    properties:
        lib: ${libaio.prefix}/lib
        include: ${libaio.prefix}/include
