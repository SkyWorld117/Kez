---
recipe:
    name: intel-oneapi
    type: vendor

    source:
        type: script
        releases:
            - version: 2026.1.0.192
              url: 
                  https://registrationcenter-download.intel.com/akdlm/IRC_NAS/33cb2a22-ddf1-4aa9-8d68-1f5a118acaf2/intel-oneapi-toolkit-2026.1.0.192_offline.sh
            - version: 2025.3.1.36
              url: 
                  https://registrationcenter-download.intel.com/akdlm/IRC_NAS/6caa93ca-e10a-4cc5-b210-68f385feea9e/intel-oneapi-base-toolkit-2025.3.1.36_offline.sh
            - version: 2024.2.1.100
              url: 
                  https://registrationcenter-download.intel.com/akdlm/IRC_NAS/e6ff8e9c-ee28-47fb-abd7-5c524c983e1c/l_BaseKit_p_2024.2.1.100_offline.sh

    build:
    # Clean up any previous installations
        preprocessing: rm -rf ~/intel
    # Install Intel oneAPI HPC Toolkit silently and remove intel files after installation
        postprocessing: bash ${source} -a --silent --eula accept --cli --install-dir=${intel-oneapi.prefix} && rm -rf ~/intel
