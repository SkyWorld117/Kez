---
recipe:
    name: json
    description: JSON for Modern C++
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 3.12.0
              url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz

    build:
        configurations:
            options:
                - name: JSON_BuildTests
                  description: Enable building of test programs
                  enabled_value:
                      default: OFF
        stages:
            - target:
            - target: install

    properties:
        include: ${json.prefix}/include
