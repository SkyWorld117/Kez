---
recipe:
    name: ripgrep
    description: ripgrep - a line-oriented search tool that recursively searches the current directory for a regex pattern
    type: package

    source:
        type: tarball
        releases:
            - version: 15.2.0
              url: https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-${kez.arch.ripgrep}.tar.gz

    build:
        postprocessing: |-
            mkdir -p ${ripgrep.prefix}/bin
            cp rg ${ripgrep.prefix}/bin/
