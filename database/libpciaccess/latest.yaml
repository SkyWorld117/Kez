---
recipe:
    name: libpciaccess
    description: Generic PCI access library.
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 0.17
              url: https://www.x.org/archive/individual/lib/libpciaccess-0.17.tar.xz

    dependencies:
        - zlib

    build:
        configurations:
            options:
                - name: with-zlib
                  description: Use zlib for compression
                  enabled_value:
                      default: ${zlib.prefix}

        stages:
            - target:
            - target: install

    properties:
        lib: ${libpciaccess.prefix}/lib
        libs:
            default: -lpciaccess
        include: ${libpciaccess.prefix}/include
