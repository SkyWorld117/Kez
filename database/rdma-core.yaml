cheese:
  name: rdma-core
  description: RDMA core userspace libraries and daemons
  type: package

  # This package should not be built from source
  # Use the system package instead

  properties:
    ldflags:
      default: -L${rdma-core.prefix}/lib64 -Wl,-rpath,${rdma-core.prefix}/lib64
    libs:
      default: -lrdmacm
    includes:
      default: -I${rdma-core.prefix}/include