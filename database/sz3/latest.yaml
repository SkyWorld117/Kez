---
recipe:
    name: sz3
    description: SZ3 is a compressed floating-point array library.
    type: package
    toolchain: cmake

    source:
        type: zip
        releases:
            - version: 3.3.2
              url: https://github.com/szcompressor/SZ3/releases/download/v3.3.2/SZ3-v3.3.2.zip

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${sz3.prefix}/lib64
        libs:
            default: -lSZ3c
        include: ${sz3.prefix}/include
