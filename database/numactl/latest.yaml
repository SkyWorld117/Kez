---
recipe:
    name: numactl
    description: NUMA support for Linux
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2.0.19
              url: https://github.com/numactl/numactl/releases/download/v2.0.19/numactl-2.0.19.tar.gz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${numactl.prefix}/lib
        libs:
            default: -lnuma
        include: ${numactl.prefix}/include
