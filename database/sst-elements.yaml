cheese:
  name: sst-elements
  description: Structural Simulation Toolkit Elements
  type: package
  toolchain: autotools

  source:
    type: git
    url: https://github.com/sstsimulator/sst-elements.git
    releases:
      - version: scc25
        tag: 22504be

  dependencies:
    - sst-core
    - mpi
    - python

  build:
    preprocessing: ${python.prefix}/bin/pip3 install numpy; ./autogen.sh
    
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${sst-elements.prefix}

        - name: --with-sst-core
          description: Path to SST Core installation
          enabled_value:
            default: ${sst-core.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXX
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: CXXFLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: MPICC
          description: MPI C compiler
          enabled_value:
            default: ${mpi.c}
            
        - name: MPICXX
          description: MPI C++ compiler
          enabled_value:
            default: ${mpi.cxx}
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${sst-elements.prefix}/lib -Wl,-rpath,${sst-elements.prefix}/lib
    includes:
      default: -I${sst-elements.prefix}/include