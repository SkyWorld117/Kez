cheese:
  name: xerces-c
  description: Xerces-C is a validating XML parser written in a portable subset of C++.
  type: package
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 3.3.0
        url: https://dlcdn.apache.org//xerces/c/3/sources/xerces-c-3.3.0.tar.gz

  build:
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${xerces-c.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CXX
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXXFLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${xerces-c.prefix}/lib -Wl,-rpath,${xerces-c.prefix}/lib
    includes:
      default: -I${xerces-c.prefix}/include