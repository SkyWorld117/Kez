---
recipe:
    name: cosma
    description: COSMA - Communication-Optimal Matrix Multiplication, drop-in ScaLAPACK PDGEMM replacement
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/eth-cscs/COSMA
        releases:
            - version: 2.8.4
              tag: v2.8.4
            - version: 2.7.1
              tag: v2.7.1
            - version: 2.6.6
              tag: v2.6.6

    dependencies:
        - mpi
        - blas
        - lapack
        - scalapack

    build:
        preprocessing: git submodule init && git submodule update
        configurations:
            options:
                - name: CMAKE_CXX_FLAGS
                  enabled_value:
                      default: -O3 -include cstdint

                - name: BUILD_SHARED_LIBS
                  enabled_value:
                      default: ON

                - name: COSMA_BLAS
                  description: BLAS backend [ MKL | OPENBLAS | CRAY_LIBSCI | CUSTOM | CUDA | ROCM ]
                  user_configurable: true
                  enabled_value:
                      default: MKL

                - name: COSMA_SCALAPACK
                  description: ScaLAPACK backend for PXGEMM wrappers [ MKL | CRAY_LIBSCI | CUSTOM ]
                  user_configurable: true
                  enabled_value:
                      default: MKL

                - name: MKL_ROOT
                  enabled:
                      default: false
                      conditions:
                          - condition: ${cosma.config.COSMA_BLAS} true MKL
                            value: true
                          - condition: ${cosma.config.COSMA_SCALAPACK} true MKL
                            value: true
                  enabled_value:
                      default: ${intel-oneapi-mkl.prefix}
                  requires: [intel-oneapi-mkl]

                - name: COSMA_WITH_NCCL
                  description: Enable NCCL for GPU-aware collective communication
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda, nvhpc-nccl]

                - name: COSMA_NCCL_INCLUDE_DIRS
                  description: Path to NCCL include directory
                  enabled:
                      default: false
                      conditions:
                          - condition: ${cosma.config.COSMA_WITH_NCCL} true
                            value: true
                  enabled_value:
                      default: ${nvhpc-nccl.include}
                  requires: [nvhpc-nccl]

                - name: COSMA_NCCL_LIBRARIES
                  description: Path to NCCL library
                  enabled:
                      default: false
                      conditions:
                          - condition: ${cosma.config.COSMA_WITH_NCCL} true
                            value: true
                  enabled_value:
                      default: ${nvhpc-nccl.lib}
                  requires: [nvhpc-nccl]

                - name: COSMA_WITH_GPU_AWARE_MPI
                  description: Enable GPU-aware MPI
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda]

                - name: COSMA_WITH_TESTS
                  enabled_value:
                      default: OFF

                - name: COSMA_WITH_APPS
                  enabled_value:
                      default: OFF

                - name: COSMA_WITH_BENCHMARKS
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
        prefix: ${cosma.prefix}
        lib: ${cosma.prefix}/lib
        libs:
            default: -lcosma -lcosta
        include: ${cosma.prefix}/include
