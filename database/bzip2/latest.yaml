---
recipe:
    name: bzip2
    description: A high-quality data compressor
    type: package
    toolchain: make

    source:
        type: tarball
        releases:
            - version: 1.0.8
              url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz

    build:
        stages:
            - target: -f Makefile-libbz2_so
              configurations:
                  options:
                      - name: CC
                        description: C compiler
                        enabled_value:
                            default: ${compiler.c}

                      - name: CFLAGS
                        description: C compiler flags
                        user_configurable: true
                        enabled_value:
                            default: -O3 -fPIC -D_FILE_OFFSET_BITS=64
            - target:
              configurations:
                  options:
                      - name: PREFIX
                        description: Installation prefix
                        enabled_value:
                            default: ${bzip2.prefix}

                      - name: CC
                        description: C compiler
                        enabled_value:
                            default: ${compiler.c}

                      - name: CFLAGS
                        description: C compiler flags
                        user_configurable: true
                        enabled_value:
                            default: -O3 -fPIC -D_FILE_OFFSET_BITS=64

    properties:
        lib: ${bzip2.prefix}/lib
        libs:
            default: -lbz2
        include: ${bzip2.prefix}/include
