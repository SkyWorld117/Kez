---
recipe:
    name: fd
    description: fd - a simple, fast and user-friendly alternative to 'find'
    type: package

    source:
        type: tarball
        releases:
            - version: 10.4.2
              url: https://github.com/sharkdp/fd/releases/download/v10.4.2/fd-v10.4.2-${kez.arch}-unknown-linux-gnu.tar.gz

    build:
        postprocessing: mkdir -p ${fd.prefix}/bin/ && cp fd ${fd.prefix}/bin/
