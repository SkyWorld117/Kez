cheese:
  name: elsi
  description: ELSI - EigenvaLue SIver (unified interface for eigensolvers)
  type: package
  toolchain: cmake

  source:
    type: tarball
    releases:
      - version: 2.12.0
        url: https://gitlab.com/elsi_project/elsi_interface/-/archive/v2.12.0/elsi_interface-v2.12.0.tar.gz

  dependencies:
    - mpi
    - lapack
    - scalapack
    - elpa

  build:
    configurations:
      options:
        - name: -DCMAKE_INSTALL_PREFIX
          description: Installation prefix
          enabled_value:
            default: ${elsi.prefix}

        - name: -DCMAKE_C_COMPILER
          description: C compiler (use MPI wrapper)
          enabled_value:
            default: ${mpi.c}

        - name: -DCMAKE_Fortran_COMPILER
          description: Fortran compiler (use MPI wrapper)
          enabled_value:
            default: ${mpi.fort}

        - name: -DCMAKE_CXX_COMPILER
          description: C++ compiler (use MPI wrapper)
          enabled_value:
            default: ${mpi.cxx}

        - name: -DCMAKE_C_FLAGS
          description: C compiler optimization flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: -DCMAKE_Fortran_FLAGS
          description: Fortran compiler optimization flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: -DCMAKE_CXX_FLAGS
          description: C++ compiler optimization flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: elpa
          description: Use external ELPA library
          user_configurable: true
          enabled:
            default: false
          enabled_format: -DUSE_EXTERNAL_ELPA=ON
          disabled_format: -DUSE_EXTERNAL_ELPA=OFF

        - name: -DINC_PATHS
          enabled:
            conditions:
              - condition: ${elsi.config.elpa} true
                value: true
              - condition: ${elsi.config.elpa} false
                value: false
          enabled_value:
            default: ${elpa.prefix}/include/elpa-${elpa.version}/modules

        - name: -DLIB_PATHS
          enabled:
            conditions:
              - condition: ${elsi.config.elpa} true
                value: true
              - condition: ${elsi.config.elpa} false
                value: false
          enabled_value:
            default: ${elpa.prefix}/lib

        - name: -DLIBS
          enabled:
            conditions:
              - condition: ${elsi.config.elpa} true
                value: true
              - condition: ${elsi.config.elpa} false
                value: false
          enabled_value:
            default: ${elpa.libs}

        - name: -DCMAKE_EXE_LINKER_FLAGS
          enabled_value:
            default: ${scalapack.ldflags} ${scalapack.libs}

        - name: -DCMAKE_SHARED_LINKER_FLAGS
          enabled_value:
            default: ${scalapack.ldflags} ${scalapack.libs}

    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${elsi.prefix}/lib -Wl,-rpath,${elsi.prefix}/lib
    libs:
      default: -lelsi
    includes:
      default: -I${elsi.prefix}/include
