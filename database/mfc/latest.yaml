---
recipe:
    name: mfc
    description: An exascale many-physics flow solver
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 5.6.1
              url: https://github.com/MFlowCode/MFC/archive/refs/tags/v5.6.1.tar.gz
            - version: 5.5.0
              url: https://github.com/MFlowCode/MFC/archive/refs/tags/v5.5.0.tar.gz
            - version: 5.4.0
              url: https://github.com/MFlowCode/MFC/archive/refs/tags/v5.4.0.tar.gz
            - version: 5.3.3
              url: https://github.com/MFlowCode/MFC/archive/refs/tags/v5.3.3.tar.gz

    # Core dependencies for the default build (pre_process + simulation +
    # post_process).  Individual components can be toggled off below, which
    # relaxes the corresponding library requirements.
    #
    # MFC's build system (mfc.sh) uses the Python toolchain to generate
    # per-target Fypp case files and the thermochemistry module.  Cantera
    # and Pyrometheus are required at build time even for non-chemistry
    # builds because the source code unconditionally imports m_thermochem.
    dependencies:
        - mpi
        - fftw3
        - hdf5
        - silo
        - blas
        - lapack
        - python
        - cantera
        - pyrometheus
        - fypp

    build:
        # Generate per-target case.fpp and the thermochemistry Fortran
        # module before CMake configure.  MFC's mfc.sh normally does this
        # via case.generate_fpp(), but we build through CMake directly.
        preprocessing: |-
            cd ${source}

            # Generate case.fpp for each target with chemistry disabled
            # (the default).  We mirror the stub at
            # src/common/include/case.fpp which defines the
            # analytical/mib_analytical macros used by various .fpp
            # sources; without them Fypp raises a NameError.
            for target in simulation pre_process post_process; do
                mkdir -p "build/include/${target}"
                printf '%s\n' '#:set chemistry             = False' \
                              '#:def analytical()' \
                              '#:enddef' \
                              '#:def mib_analytical()' \
                              '#:enddef' \
                    > "build/include/${target}/case.fpp"
            done

            # Generate m_thermochem.f90 via Cantera + Pyrometheus, using
            # the default h2o2 mechanism shipped with Cantera.  Without
            # this module the build fails on `use m_thermochem` even when
            # chemistry is disabled at run time.
            python3 -c "
            import cantera as ct, pyrometheus as pyro, os
            sol = ct.Solution('h2o2.yaml')
            code = pyro.FortranCodeGenerator().generate(
                'm_thermochem', sol,
                pyro.CodeGenerationOptions(scalar_type='${mfc.config.MFC_SCALAR_TYPE}', directive_offload='${mfc.config.MFC_OFFLOAD_TARGET}'),
            )
            for target in ('simulation', 'pre_process', 'post_process'):
                mod_dir = f'build/modules/{target}'
                os.makedirs(mod_dir, exist_ok=True)
                with open(os.path.join(mod_dir, 'm_thermochem.f90'), 'w') as f:
                    f.write(code)
            "

        configurations:
            options:
                # ── Target selection ───────────────────────────────────────
                #
                # NOTE:  MFC_ALL forces MFC_DOCUMENTATION ON, which requires
                # Doxygen.  Rather than pulling that in, we enable the three
                # compute targets individually so the default build is useful
                # without documentation tooling.
                - name: MFC_PRE_PROCESS
                  description: Build pre-processor (grid generation, initial conditions)
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: MFC_SIMULATION
                  description: Build simulation (time-integration solver)
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: MFC_POST_PROCESS
                  description: Build post-processor (analysis, visualization I/O)
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: MFC_SYSCHECK
                  description: Build system-check tool (verification of GPU/CPU setup)
                  user_configurable: true
                  enabled_value:
                      default: OFF

                # ── Convenience meta-option ────────────────────────────────
                - name: MFC_ALL
                  description: >
                      Build everything including documentation.  Forces all
                      targets ON, including MFC_DOCUMENTATION (which requires
                      Doxygen and Graphviz).
                  enabled_value:
                      default: OFF

                # ── Parallelism back-ends ──────────────────────────────────
                - name: MFC_MPI
                  description: Build with MPI distributed-memory parallelism
                  enabled_value:
                      default: ON

                - name: MFC_OpenACC
                  description: Build with OpenACC GPU offloading (NVHPC or Cray compilers)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda]

                - name: MFC_OpenMP
                  description: Build with OpenMP GPU offloading (NVHPC or Cray compilers)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires: [cuda]

                # Match MFC's own toolchain (toolchain/mfc/run/input.py):
                # the generated m_thermochem must carry GPU-offload routine
                # directives matching the build mode -- 'acc' for OpenACC,
                # 'mp' for OpenMP offload, none for CPU-only builds.
                # Otherwise nvfortran fails with S-1061 ("Procedures called
                # in a compute region must have acc routine information")
                # when compiling m_chemistry.fpp, which calls thermochem
                # functions inside !$acc compute regions.
                - name: MFC_OFFLOAD_TARGET
                  description: Virtual target for OpenACC/OpenMP offload
                  enabled_value:
                      default: None
                      conditions:
                          - condition: ${mfc.config.MFC_OpenACC} true
                            value: acc
                          - condition: ${mfc.config.MFC_OpenMP} true
                            value: mp
                  enabled_format: ''

                # MFCTargets.cmake calls find_package(CUDAToolkit REQUIRED) for
                # the offload builds, and without this hint CMake resolves it
                # from the ambient /usr/local/cuda instead of the toolkit the
                # rest of the environment was built against.
                - name: CUDAToolkit_ROOT
                  description: CUDA toolkit root used for the GPU offload builds
                  enabled:
                      default: false
                      conditions:
                          - condition: ${mfc.config.MFC_OpenACC} true || ${mfc.config.MFC_OpenMP} true
                            value: true
                  enabled_value:
                      default: ${cuda.prefix}

                # ── Precision ──────────────────────────────────────────────
                - name: MFC_SINGLE_PRECISION
                  description: Use single precision (32-bit floats)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON

                - name: MFC_MIXED_PRECISION
                  description: Use mixed precision (64/32-bit hybrid)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON

                # Mirror MFC's precision selection for the thermochem scalar
                # type (real(sp) for single or mixed precision, real(dp)
                # otherwise).
                - name: MFC_SCALAR_TYPE
                  description: Virtual scalar type for thermochemistry module (real(sp) or real(dp))
                  enabled_value:
                      default: real(dp)
                      conditions:
                          - condition: ${mfc.config.MFC_SINGLE_PRECISION} true || ${mfc.config.MFC_MIXED_PRECISION} true
                            value: real(sp)
                  enabled_format: ''

                # ── GPU / hardware-specific ────────────────────────────────
                - name: MFC_Unified
                  description: Use unified CPU & GPU memory (GH-200 Grace Hopper only)
                  user_configurable: true
                  enabled_value:
                      default: OFF

                - name: MFC_Fastmath
                  description: Use -gpu=fastmath on NVIDIA GPUs
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON

                # ── Development / debugging ────────────────────────────────
                - name: MFC_GCov
                  description: Build with GCov code-coverage instrumentation
                  enabled_value:
                      default: OFF

                - name: MFC_DOCUMENTATION
                  description: Build Doxygen documentation
                  enabled_value:
                      default: OFF

                # ── CMake find_package hints ──────────────────────────────────
                #
                # MFC ships a custom FindLAPACK.cmake that calls
                #   find_library(LAPACK_LIBRARY NAMES lapack ...)
                # Intel MKL provides LAPACK through libmkl_rt.so (not liblapack.so),
                # so we must pass an explicit path hint.  This option is only
                # enabled when MKL is the selected BLAS/LAPACK provider.
                - name: LAPACK_LIBRARY
                  description: Path to the LAPACK library (hint for CMake find_package)
                  enabled:
                      default: false
                      conditions:
                          - condition: ${blas.use-intel-oneapi-mkl} true && ${lapack.use-intel-oneapi-mkl} true
                            value: true
                  enabled_value:
                      default: ${blas.lib}/libmkl_rt.so

        stages:
            # Build targets sequentially — MFC's CMake does NOT set
            # per-target Fortran_MODULE_DIRECTORY, so all .mod files
            # land in the same build/ directory.  Building multiple
            # targets in parallel causes them to overwrite each
            # other's .mod files, leading to spurious compilation
            # errors (unclassifiable statements, ambiguous references).
            #
            # nvfortran chooses its CUDA toolkit when it links, defaulting to
            # the one bundled with the HPC SDK, so NVHPC_CUDA_HOME has to be
            # in scope for the build stages and not just for the configure
            # step (kez exports a declaration only around the command of the
            # block it is declared in, and restores the previous value after).
            - target: simulation
              configurations:
                  environment: &nvhpc_cuda_home
                      - name: NVHPC_CUDA_HOME
                        description: NVHPC CUDA toolkit root for the offload build
                        conditions:
                            - condition: ${mfc.config.MFC_OpenACC} true || ${mfc.config.MFC_OpenMP} true
                              value: ${cuda.prefix}
            - target: pre_process
              configurations:
                  environment: *nvhpc_cuda_home
            - target: post_process
              configurations:
                  environment: *nvhpc_cuda_home
            - target: install
              # cmake --install does not compile.

        # MFC's own command-line interface (mfc.sh: run, test, count, validate,
        # params, ...) only runs from inside an MFC source tree, and executes its
        # targets from a per-case build directory Kez does not reproduce.  Install
        # the tree behind a launcher that cd's into it, plus a shim that points
        # MFC's binary lookup at ${mfc.prefix}/bin and disables compilation:
        # `mfc.sh build` becomes a no-op and `mfc.sh test` runs against the
        # binaries installed here.  The shim reaches into MFC internals, so an
        # MFC that renames them surfaces as an error in sitecustomize rather
        # than being patched silently.
        postprocessing: |-
            (
            set -euo pipefail
            root=${mfc.prefix}/share/mfc
            bin=${mfc.prefix}/bin

            # Copy the tree wholesale rather than a list of directories: MFC
            # moves directories between releases, and mfc.sh's lint, format and
            # spelling subcommands read the repository's dotfiles.  build/ is
            # this package's CMake directory, not part of the source.
            mkdir -p "$root"
            cp -a ${source}/. "$root/"
            rm -rf "$root/build"

            # mfc.sh builds this virtualenv, and fills it from PyPI, on its first
            # run.  SETUPTOOLS_SCM_PRETEND_VERSION is required because a release
            # tarball carries no .git for hatch-vcs to read; VIRTUAL_ENV points at
            # the environment's shared venv, which has to stay out of this one.
            export SETUPTOOLS_SCM_PRETEND_VERSION=${mfc.version}
            env -u VIRTUAL_ENV uv venv --python ${python.prefix}/bin/python3 ${mfc.prefix}/share/mfc-venv
            env -u VIRTUAL_ENV uv pip install --python ${mfc.prefix}/share/mfc-venv/bin/python "$root/toolchain"

            mkdir -p ${mfc.prefix}/share/mfc-kez
            cat > ${mfc.prefix}/share/mfc-kez/sitecustomize.py <<'KEZ_EOF'
            import os
            import sys

            # Kez shim.  MFC executes its targets at <root>/build/install/<slug>/
            # bin/<name>, where <slug> hashes the build configuration and the
            # case's generated case.fpp, so point that lookup at the installed
            # bin/ and disable compilation.
            bin_dir = os.environ.get("KEZ_MFC_BIN")
            toolchain = os.environ.get("KEZ_MFC_TOOLCHAIN")
            if bin_dir and toolchain:
                # This runs while site.py is imported, i.e. before CPython adds
                # the run script's directory to sys.path.  Without it `import
                # mfc` finds the copy uv installed into the venv, and mfc.common
                # then locates MFC_ROOT_DIR inside that venv.
                sys.path.insert(0, toolchain)
                try:
                    import mfc.build
                except ImportError:
                    pass  # mfc.sh's own bootstrap probes, before the venv appears
                else:
                    for name in ("get_install_binpath", "is_buildable"):
                        if not hasattr(mfc.build.MFCTarget, name):
                            raise RuntimeError(f"MFCTarget.{name} is gone")

                    def binpath(self, case):
                        return os.path.join(bin_dir, self.name)

                    mfc.build.MFCTarget.get_install_binpath = binpath
                    mfc.build.MFCTarget.is_buildable = lambda self: False
                    # syscheck is a required pre-flight target of every run and
                    # test, but is only built when MFC_SYSCHECK is on.
                    if not os.path.exists(os.path.join(bin_dir, "syscheck")):
                        mfc.build.REQUIRED_TARGETS.discard(mfc.build.SYSCHECK)
            KEZ_EOF

            # ${mfc.prefix}/bin is what the environment's modulefile puts on PATH.
            mkdir -p "$bin"
            cat > "$bin/mfc.sh" <<'KEZ_EOF'
            #!/usr/bin/env bash

            # Kez-installed MFC entry point.  mfc.sh only runs from inside an MFC
            # source tree, so cd into the copy Kez installed.  The job scripts it
            # generates need an MPI launcher, which the application environment
            # does not provide, hence the PATH line below.
            set -euo pipefail
            prefix=$(cd "$(dirname "$(readlink -f -- "${BASH_SOURCE[0]}")")/.." && pwd)
            PATH=${mpi.prefix}/bin:$PATH
            export PATH
            cd "$prefix/share/mfc"

            # `mfc.sh clean` deletes build/, which also holds its virtualenv and
            # the fingerprint it uses to decide whether to reinstall.
            mkdir -p build
            [ -e build/venv ] || ln -sfn "$prefix/share/mfc-venv" build/venv
            [ -f build/pyproject.toml ] || cp toolchain/pyproject.toml build/pyproject.toml

            export KEZ_MFC_BIN="$prefix/bin"
            export KEZ_MFC_TOOLCHAIN="$prefix/share/mfc/toolchain"
            export PYTHONPATH="$prefix/share/mfc-kez${PYTHONPATH:+:$PYTHONPATH}"

            if [ "${1:-}" = build ]; then
                echo "mfc: built by Kez; 'mfc.sh build' is a no-op (binaries in $KEZ_MFC_BIN)."
            fi

            exec ./mfc.sh "$@"
            KEZ_EOF
            chmod +x "$bin/mfc.sh"
            )

    properties:
        bin: ${mfc.prefix}/bin
