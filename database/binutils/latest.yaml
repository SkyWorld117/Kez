---
recipe:
    name: binutils
    description: GNU Binary Utilities collection
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2.44
              url: https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.gz

    dependencies:
        - isl
        - gmp
        - mpfr
        - mpc
        - zstd

    build:
        configurations:
            options:
                - name: --prefix
                  description: Installation prefix
                  enabled_value:
                      default: ${binutils.prefix}

                - name: --disable-multilib
                  description: Disable multilib support

                - name: --disable-nls
                  description: Disable native language support

                - name: --enable-compressed-debug-sections
                  description: Enable compressed debug sections
                  enabled_value:
                      default: all

                - name: --enable-default-compressed-debug-sections-algorithm
                  description: Default algorithm for compressed debug sections
                  enabled_value:
                      default: zstd

                - name: --enable-gold
                  description: Enable the gold linker
                  user_configurable: true
                  disabled_format: --disable-gold

                - name: --enable-ld
                  description: Enable the ld linker
                  user_configurable: true
                  disabled_format: --disable-ld

                - name: --with-gmp
                  description: Specify GMP installation prefix
                  enabled_value:
                      default: ${gmp.prefix}

                - name: --with-mpfr
                  description: Specify MPFR installation prefix
                  enabled_value:
                      default: ${mpfr.prefix}

                - name: --with-mpc
                  description: Specify MPC installation prefix
                  enabled_value:
                      default: ${mpc.prefix}

                - name: --with-isl
                  description: Specify ISL installation prefix
                  enabled_value:
                      default: ${isl.prefix}

                - name: --with-zstd
                  description: Specify Zstandard installation prefix
                  enabled_value:
                      default: ${zstd.prefix}

                - name: CC
                  description: C compiler
                  enabled_value:
                      default: ${compiler.c}

                - name: CXX
                  description: C++ compiler
                  enabled_value:
                      default: ${compiler.cxx}

                - name: LDFLAGS
                  description: Linker flags
                  user_configurable: true
                  enabled_value:
                      default: ${gmp.ldflags} ${mpfr.ldflags} ${mpc.ldflags} ${isl.ldflags} ${zstd.ldflags}
        stages:
            - target:
            - target: install

    properties:
        ldflags:
            default: -L${binutils.prefix}/lib -Wl,-rpath,${binutils.prefix}/lib
        libs:
            default: -lbfd -lctf -lopcodes -lsframe
        includes:
            default: -I${binutils.prefix}/include
