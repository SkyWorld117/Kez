cheese:
  name: xz
  description: XZ Utils data compression software with high compression ratio
  type: system
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 5.8.1
        url: https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.gz

  build:
    preprocessing: ${source}/autogen.sh --no-po4a

    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${xz.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CXX
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXXFLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${xz.prefix}/lib -Wl,-rpath,${xz.prefix}/lib
    libs:
      default: -llzma
    includes:
      default: -I${xz.prefix}/include