cheese:
  name: eigen
  description: Eigen C++ Template Library for Linear Algebra
  type: package
  toolchain: cmake

  source:
    type: tarball
    releases:
      - version: 5.0.1
        url: https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz
      - version: 3.4.1
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.1/eigen-3.4.1.tar.gz

  build:
    configurations:
      options:
        - name: -DCMAKE_INSTALL_PREFIX
          description: Installation prefix
          enabled_value:
            default: ${eigen.prefix}

        - name: -DCMAKE_BUILD_TYPE
          description: Build type
          enabled_value:
            default: Release
    stages:
      - target: ~
      - target: install

  properties:
    includes:
      default: -I${eigen.prefix}/include