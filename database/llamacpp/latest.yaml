---
recipe:
    name: llamacpp
    description: llama.cpp - LLM inference on consumer and HPC hardware
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/ggml-org/llama.cpp
        releases:
            - version: master
              tag: master

    dependencies:
        - cuda
        - nvhpc-nccl

    build:
        configurations:
            options:
                - name: CMAKE_CUDA_COMPILER
                  enabled_value:
                      default: ${cuda.prefix}/bin/nvcc

                - name: CUDA_TOOLKIT_ROOT_DIR
                  enabled_value:
                      default: ${cuda.prefix}

                # ── CUDA backend ──────────────────────────────────────────────────
                - name: GGML_CUDA
                  enabled_value:
                      default: ON

                - name: CMAKE_CUDA_ARCHITECTURES
                  user_configurable: true
                  enabled_value:
                      default: 90a

                - name: GGML_NATIVE
                  enabled_value:
                      default: OFF

                - name: GGML_CUDA_F16
                  enabled_value:
                      default: ON

                - name: GGML_CUDA_FA_ALL_QUANTS
                  enabled_value:
                      default: OFF

                - name: GGML_CUDA_PEER_MAX_BATCH_SIZE
                  enabled_value:
                      default: '1073741824'

                - name: GGML_NCCL
                  enabled_value:
                      default: ON

                - name: NCCL_ROOT
                  enabled_value:
                      default: ${nvhpc-nccl.prefix}

                - name: BUILD_SHARED_LIBS
                  enabled_value:
                      default: OFF

                - name: BUILD_TESTING
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
