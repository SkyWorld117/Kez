---
recipe:
    name: hemelb-gpu
    description: HemePure-GPU LBM blood flow solver (UCL-CCS) with CUDA backend
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/UCL-CCS/HemePure-GPU
        releases:
            - version: default
              tag: HIP-CUDA-ROCM_SL

    dependencies:
        - mpi
        - cuda

    build:
        # Pre-build step to build bundled dependencies
        preprocessing: |-
            export CMAKE_POLICY_VERSION_MINIMUM=3.5
            cd ${source}/dep
            cmake -B build -S . \
              -DCMAKE_C_COMPILER=${mpi.c} \
              -DCMAKE_CXX_COMPILER=${mpi.cxx} \
              -DHEMELB_SUBPROJECT_MAKE_JOBS=${KEZ_NPROC} \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel ${KEZ_NPROC}
            cp -r ${source}/dep/install/include ${hemelb-gpu.prefix}/
            cp -r ${source}/dep/install/lib ${hemelb-gpu.prefix}/
            cd ${source}/src

        configurations:
            options:
                - name: CMAKE_CUDA_COMPILER
                  description: Path to nvcc
                  enabled_value:
                      default: ${cuda.prefix}/bin/nvcc

                - name: CUDA_TOOLKIT_ROOT_DIR
                  description: CUDA toolkit root — required for FindCUDA to locate nvcc and runtime libs
                  enabled_value:
                      default: ${cuda.prefix}

                - name: HEMELB_GPU_BACKEND
                  description: GPU backend (CUDA / HIP_CUDA / HIP_ROCM)
                  user_configurable: true
                  enabled_value:
                      default: CUDA

                - name: CMAKE_CUDA_ARCHITECTURES
                  description: CUDA compute capability (90 = H100, 80 = A100, 70 = V100)
                  user_configurable: true
                  enabled_value:
                      default: 90

                - name: HEMELB_CUDA_AWARE_MPI
                  description: Enable CUDA-aware MPI (requires CUDA-aware OpenMPI)
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: HEMELB_USE_MPI_PARALLEL_IO
                  description: Use MPI parallel I/O for reading geometry files
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: HEMELB_USE_SSE3
                  description: SSE3 intrinsics (not useful for GPU builds)
                  enabled_value:
                      default: OFF

                - name: HEMELB_USE_VELOCITY_WEIGHTS_FILE
                  description: 'Inlet BC mode: OFF = pressure-pressure, ON = velocity-pressure'
                  user_configurable: true
                  enabled_value:
                      default: OFF

                - name: HEMELB_LATTICE
                  description: Lattice type [D3Q15, D3Q19, D3Q27]
                  user_configurable: true
                  enabled_value:
                      default: D3Q19

                - name: HEMELB_INLET_BOUNDARY
                  description: Inlet boundary condition type
                  user_configurable: true
                  enabled_value:
                      default: NASHZEROTHORDERPRESSUREIOLET

                - name: HEMELB_WALL_INLET_BOUNDARY
                  description: Wall-inlet corner boundary condition
                  user_configurable: true
                  enabled_value:
                      default: NASHZEROTHORDERPRESSURESBB

                - name: HEMELB_OUTLET_BOUNDARY
                  description: Outlet boundary condition type
                  user_configurable: true
                  enabled_value:
                      default: NASHZEROTHORDERPRESSUREIOLET

                - name: HEMELB_WALL_OUTLET_BOUNDARY
                  description: Wall-outlet corner boundary condition
                  user_configurable: true
                  enabled_value:
                      default: NASHZEROTHORDERPRESSURESBB

                - name: HEMELB_USE_GMYPLUS
                  description: GMY+ geometry format (not needed for benchmark)
                  enabled_value:
                      default: OFF

                - name: HEMELB_USE_MPI_WIN
                  description: MPI window-based communication
                  user_configurable: true
                  enabled_value:
                      default: OFF

                - name: CTEMPLATE_LIBRARY
                  description: Static ctemplate library from bundled dep build
                  enabled_value:
                      default: ${hemelb-gpu.prefix}/lib/libctemplate.a

                - name: CMAKE_EXE_LINKER_FLAGS
                  description: Link libtirpc (GPU CMakeLists.txt omits it unlike the CPU version; XDR functions were in glibc on old RHEL, now in 
                      libtirpc)
                  enabled_value:
                      default: -L${hemelb-gpu.prefix}/lib -ltirpc

                - name: CMAKE_SHARED_LINKER_FLAGS
                  description: Link libtirpc for shared libs too
                  enabled_value:
                      default: -L${hemelb-gpu.prefix}/lib -ltirpc

                - name: CMAKE_CXX_FLAGS
                  description: Extra C++ flags for nvcc to find MPI headers
                  user_configurable: true
                  enabled_value:
                      default: -O3 -std=c++11

                - name: CMAKE_CUDA_FLAGS
                  description: Extra CUDA flags for nvcc to find MPI headers
                  user_configurable: true
                  enabled_value:
                      default: -O3 -I${mpi.prefix}/include -I${hemelb-gpu.prefix}/include/tirpc

        stages:
            - target:
            - target: install

    properties:
