---
recipe:
    name: libevent
    description: Event notification library
    type: package
    toolchain: autotools

    dependencies:
        - openssl

    source:
        type: tarball
        releases:
            - version: 2.1.13
              url: https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libevent.prefix}/lib
        libs:
            default: -levent
        include: ${libevent.prefix}/include
