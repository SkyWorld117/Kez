cheese:
  name: metis
  description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing orderings for sparse matrices.
  type: package
  toolchain: make

  source:
    type: git
    url: https://github.com/KarypisLab/METIS
    releases:
      - version: master
        tag: master

  dependencies:
    - GKlib

  build:
    stages:
      - target: config
        configurations:
          options:
            - name: prefix
              description: Installation prefix
              enabled_value:
                default: ${parmetis.prefix} 
            - name: gklib_path
              description: GKlib installation path
              enabled_value:
                default: ${GKlib.prefix}
      - target: install

  properties:
    ldflags:
      default: -L${metis.prefix}/lib64 -Wl,-rpath
