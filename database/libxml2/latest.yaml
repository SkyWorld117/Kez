---
recipe:
    name: libxml2
    description: A library for parsing XML documents.
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2.15.3
              url: https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.3.tar.xz
            - version: 2.14.5
              url: https://download.gnome.org/sources/libxml2/2.14/libxml2-2.14.5.tar.xz

    dependencies:
        - zlib
        - xz

    build:
        configurations:
            options:
                - name: with-python
                  description: Enable Python bindings
                  enabled:
                      default: false
                  enabled_value:
                      default: ${python.prefix}
                  disabled_format: without-python
                  requires: [python]

                - name: with-zlib
                  description: Enable zlib compression
                  enabled_value:
                      default: ${zlib.prefix}

                - name: with-lzma
                  description: Enable LZMA compression
                  enabled_value:
                      default: ${xz.prefix}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxml2.prefix}/lib
        libs:
            default: -lxml2
        include: ${libxml2.prefix}/include
