cheese:
  name: libevent
  description: Event notification library
  type: package
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 2.1.12
        url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz

  build:
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${libevent.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${libevent.prefix}/lib -Wl,-rpath,${libevent.prefix}/lib
    libs:
      default: -levent
    includes:
      default: -I${libevent.prefix}/include