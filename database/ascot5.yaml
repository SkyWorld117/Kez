cheese:
    name: ascot5
    description: Simulation tool used in fusion energy science and engineering
    type: package
    toolchain: makefile

    source:
        type: git
        url: https://github.com/ascot4fusion/ascot5.git
        releases:
            - version: main
              tag: main

    dependencies:
        - hdf5

    common_configurations: &ascot_configurations
        options:
            - name: MPI
              description: Toggle MPI
              user_configurable: true
              enabled:
                  default: true
              enabled_value:
                  default: 1
              requires: [mpi]

            - name: OMP
              description: Toggle OpenMP
              user_configurable: true
              enabled:
                  default: false
              enabled_value:
                  default: 1

            - name: ACC
              description: Toggle OpenACC
              user_configurable: true
              enabled:
                  default: false
              enabled_value:
                  default: 1

            - name: GPU
              description: Toggle NVHPC
              user_configurable: true
              enabled:
                  default: false
              enabled_value:
                  default: 1
              requires: [nvhpc-compilers]

            - name: CC
              description: C compiler
              enabled: 
                default: false
                conditions:
                  - condition: ${ascot5.config.MPI} true
                    action: set
                    value: true
                  - condition: ${ascot5.config.GPU} true
                    action: set
                    value: true
              enabled_value:
                default: ~
                conditions:
                  - condition: ${ascot5.config.GPU} true
                    action: set
                    value: ${nvhpc-compilers.c} ${hdf5.includes} ${hdf5.ldflags} ${mpi.includes} ${mpi.ldflags} ${mpi.libs}
                  - condition: ${ascot5.config.MPI} true
                    action: set
                    value: ${mpi.c} ${hdf5.includes} ${hdf5.ldflags}
            - name: C_FLAGS
              description: C flags
              user_configurable: true
              enabled_value:
                default: -O3

    build:
        stages:
            - target: ascot5_main
              configurations: *ascot_configurations

            - target: libascot
              configurations: *ascot_configurations

        postprocessing: >
            cp -r ${source}/build/* ${ascot5.prefix}/bin/ &&
            mkdir -p ${ascot5.prefix}/ascot5/             &&
            cp -r ${source}/* ${ascot5.prefix}/ascot5/

