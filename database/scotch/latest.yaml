---
recipe:
    name: scotch
    description: Scotch is a software package for graph and mesh partitioning, graph clustering, and sparse matrix ordering.
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://gitlab.inria.fr/scotch/scotch.git
        releases:
            - version: 7.0.11
              tag: v7.0.11

    dependencies:
        - bison
        - flex
        - mpi

    build:
        configurations:
            options:
                - name: BISON_EXECUTABLE
                  description: Path to Bison executable
                  enabled_value:
                      default: ${bison.prefix}/bin/bison

                - name: FLEX_EXECUTABLE
                  description: Path to Flex executable
                  enabled_value:
                      default: ${flex.prefix}/bin/flex

                - name: MPI_HOME
                  description: MPI installation path
                  enabled_value:
                      default: ${mpi.prefix}

        stages:
            - target:
            - target: install

    properties:
        lib: ${scotch.prefix}/lib
        libs:
            default: -lscotch -lscotcherr
        include: ${scotch.prefix}/include
