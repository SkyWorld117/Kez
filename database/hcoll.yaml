cheese:
  name: hcoll
  description: Modern Interface for Mellanox Fabric Collective Accelerator
  type: vendor

  # This package should not be built from source
  # Use the system package instead

  properties:
    ldflags:
      default: -L${hcoll.prefix}/lib -Wl,-rpath,${hcoll.prefix}/lib
    libs:
      default: -lhcoll
    includes:
      default: -I${hcoll.prefix}/include