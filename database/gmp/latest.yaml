---
recipe:
    name: gmp
    description: GNU Multiple Precision Arithmetic Library
    type: system
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 6.3.0
              url: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.gz

    build:
        configurations:
            options:
                - name: enable-cxx
                  description: Enable C++ support

                - name: enable-shared
                  description: Build shared libraries

                - name: enable-static
                  description: Build static libraries

                - name: enable-assembly
                  description: Enable assembly optimizations
                  user_configurable: true
                  disabled_format: disable-assembly

        stages:
            - target:
            - target: install

    properties:
        lib: ${gmp.prefix}/lib
        libs:
            default: -lgmp
        include: ${gmp.prefix}/include
