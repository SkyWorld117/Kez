---
recipe:
    name: sio
    description: SIO - Simple IO
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 00-02
              url: https://github.com/iLCSoft/SIO/archive/refs/tags/v00-02.tar.gz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${sio.prefix}/lib64
        libs:
            default: -lsio
        include: ${sio.prefix}/include
