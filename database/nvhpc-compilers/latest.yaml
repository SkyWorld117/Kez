---
recipe:
    name: nvhpc-compilers
    description: NVIDIA HPC compiler suite
    type: vendor

    dependencies:
        - nvhpc

    properties:
        parent: nvhpc
        prefix: ${nvhpc.prefix}/Linux_x86_64/${nvhpc.version}/compilers #TODO: Sophia parse the architecture dynamically
        c: ${compiler.prefix}/bin/nvc
        cxx: ${compiler.prefix}/bin/nvc++
        fort: ${compiler.prefix}/bin/nvfortran
        omp_flags: -mp
        ldflags:
            default: -L${compiler.prefix}/lib -Wl,-rpath,${compiler.prefix}/lib
