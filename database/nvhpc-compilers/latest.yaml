---
recipe:
    name: nvhpc-compilers
    description: NVIDIA HPC compiler suite
    type: vendor

    dependencies:
        - nvhpc

    properties:
        parent: nvhpc
        prefix: ${nvhpc.prefix}/Linux_${kez.arch}/${nvhpc.version}/compilers
        c: ${compiler.prefix}/bin/nvc
        cxx: ${compiler.prefix}/bin/nvc++
        fort: ${compiler.prefix}/bin/nvfortran
        omp_flags: -mp
        lib: ${compiler.prefix}/lib
