---
recipe:
    name: h5hut
    description: Parallel file format for storing particles, which is recognized by paraview.
    type: package
    toolchain: autotools

    source:
        type: git
        url: https://github.com/eth-cscs/h5hut.git
        releases:
            - version: master
              tag: master

    dependencies:
        - hdf5

    build:
        preprocessing: ./autogen.sh
        configurations:
            options:
                - name: with-hdf5
                  description: Installation prefix
                  enabled_value:
                      default: ${hdf5.prefix}

                - name: enable-parallel
                  description: enable parallel io, needs to be true if we are using a parallel hdf5
                  user_configurable: true
                  enabled:
                      default: true
                  requires: [mpi]

        stages:
            - target:
            - target: install

    properties:
        lib: ${h5hut.prefix}/lib
        libs:
            default: -lh5hut
        include: ${h5hut.prefix}/include
