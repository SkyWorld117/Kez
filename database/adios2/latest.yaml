---
recipe:
    name: adios2
    description: The Adaptable Input Output System version 2
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/ornladios/ADIOS2.git
        releases:
            - version: v2.12.1
              tag: v2.12.1

    dependencies:
        - mpi
        - hdf5
        - ucx
        - bzip2
        - zfp
        - sz3
        - mgard
        - libpng
        - c-blosc2

    build:
        configurations:
            options:
                - name: ADIOS2_USE_MPI
                  description: Enable MPI support
                  enabled_value:
                      default: ON

                - name: MPI_ROOT
                  description: Path to MPI installation
                  enabled_value:
                      default: ${mpi.prefix}

                - name: ADIOS2_USE_ZeroMQ
                  description: Enable ZeroMQ support
                  enabled_value:
                      default: OFF

                - name: ADIOS2_USE_HDF5
                  description: Enable HDF5 support
                  enabled_value:
                      default: ON

                - name: HDF5_ROOT
                  description: Path to HDF5 installation
                  enabled_value:
                      default: ${hdf5.prefix}

                - name: ADIOS2_USE_Python
                  description: Enable Python bindings
                  enabled_value:
                      default: OFF

                - name: ADIOS2_USE_Fortran
                  description: Enable Fortran bindings
                  enabled_value:
                      default: ON

                - name: ADIOS2_USE_SST
                  description: Enable SST support
                  enabled_value:
                      default: ON

                - name: UCX_ROOT
                  description: Path to UCX installation
                  enabled_value:
                      default: ${ucx.prefix}

                - name: ADIOS2_USE_BZip2
                  description: Enable BZip2 support
                  enabled_value:
                      default: ON

                - name: BZip2_ROOT
                  description: Path to BZip2 installation
                  enabled_value:
                      default: ${bzip2.prefix}

                - name: ADIOS2_USE_ZFP
                  description: Enable ZFP support
                  enabled_value:
                      default: ON

                - name: ZFP_ROOT
                  description: Path to ZFP installation
                  enabled_value:
                      default: ${zfp.prefix}

                - name: ADIOS2_USE_SZ
                  description: Enable SZ2 support
                  enabled_value:
                      default: OFF

                - name: ADIOS2_USE_SZ3
                  description: Enable SZ3 support
                  enabled_value:
                      default: ON

                - name: SZ3_ROOT
                  description: Path to SZ3 installation
                  enabled_value:
                      default: ${sz3.prefix}

                - name: ADIOS2_USE_MGARD
                  description: Enable MGARD support
                  enabled_value:
                      default: ON

                - name: MGARD_ROOT
                  description: Path to MGARD installation
                  enabled_value:
                      default: ${mgard.prefix}

                - name: ADIOS2_USE_PNG
                  description: Enable PNG support
                  enabled_value:
                      default: ON

                - name: PNG_ROOT
                  description: Path to PNG installation
                  enabled_value:
                      default: ${libpng.prefix}

                - name: ADIOS2_USE_Blosc2
                  description: Enable Blosc2 support
                  enabled_value:
                      default: ON

                - name: Blosc2_ROOT
                  description: Path to Blosc2 installation
                  enabled_value:
                      default: ${c-blosc2.prefix}
        stages:
            - target:
            - target: install

    properties:
        lib: ${adios2.prefix}/lib
        libs:
            default: -ladios2
        include: ${adios2.prefix}/include
