---
recipe:
    name: llvm
    description: LLVM Compiler Infrastructure
    type: compiler

    source:
        type: tarball
        releases:
            - version: 22.1.8
              url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-${kez.arch.llvm}.tar.xz
            - version: 21.1.0
              url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-Linux-${kez.arch.llvm}.tar.xz

    build:
        postprocessing: cp -r ${source}/* ${llvm.prefix}

    properties:
        c: ${compiler.prefix}/bin/clang
        cxx: ${compiler.prefix}/bin/clang++
        fort: ${compiler.prefix}/bin/flang
        omp_flags: -fopenmp
        lib: ${compiler.prefix}/lib
        include: ${compiler.prefix}/include
