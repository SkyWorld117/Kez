---
recipe:
    name: ramulator2
    description: RAM module simulator
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/CMU-SAFARI/ramulator2.git
        releases:
            - version: 2.1.0
              tag: v2.1.0

    dependencies:
        - python

    build:
        configurations:
            options:
                # Allow for older Cmake version
                - name: CMAKE_POLICY_VERSION_MINIMUM
                  description: Minimum CMake policy version
                  enabled_value:
                      default: 3.15

                - name: Python_EXECUTABLE
                  description: Path to the Python executable
                  enabled_value:
                      default: ${python.executable}

                - name: Python_INCLUDE_DIRS
                  description: Path to the Python include directories
                  enabled_value:
                      default: ${python.prefix}/include
        stages:
            - target:
            - target: install

    properties:
