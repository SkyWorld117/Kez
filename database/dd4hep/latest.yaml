---
recipe:
    name: dd4hep
    description: Detector description toolkit for high energy physics
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 01-33
              url: https://github.com/AIDASoft/DD4hep/archive/refs/tags/v01-33.tar.gz

    dependencies:
        - geant4
        - lcio
        - sio
        - root
        - xerces-c
        - intel-oneapi-tbb

    build:
        configurations:
            options:
                - name: CMAKE_CXX_STANDARD
                  description: C++ standard version
                  enabled_value:
                      default: 20

                - name: DD4HEP_USE_GEANT4
                  description: Enable Geant4 support
                  enabled_value:
                      default: ON

                - name: DD4HEP_USE_LCIO
                  description: Enable LCIO support
                  enabled_value:
                      default: ON

                - name: DD4HEP_USE_SIO
                  description: Enable SIO support
                  enabled_value:
                      default: ON

                - name: DD4HEP_USE_ROOT
                  description: Enable ROOT support
                  enabled_value:
                      default: ON

                - name: DD4HEP_USE_XERCESC
                  description: Enable Xerces-C support
                  enabled_value:
                      default: ON

                - name: Geant4_DIR
                  description: Path to Geant4 installation
                  enabled_value:
                      default: ${geant4.prefix}/lib64/cmake/Geant4

                - name: LCIO_DIR
                  description: Path to LCIO installation
                  enabled_value:
                      default: ${lcio.prefix}/lib64/cmake/LCIO

                - name: SIO_DIR
                  description: Path to SIO installation
                  enabled_value:
                      default: ${sio.prefix}/lib64/cmake/SIO

                - name: ROOT_DIR
                  description: Path to ROOT installation
                  enabled_value:
                      default: ${root.prefix}/cmake

                - name: XercesC_ROOT
                  description: Path to Xerces-C installation
                  enabled_value:
                      default: ${xerces-c.prefix}

                - name: TBB_DIR
                  description: Path to Intel oneAPI TBB installation
                  enabled_value:
                      default: ${intel-oneapi-tbb.prefix}/lib/cmake/tbb

                - name: DD4HEP_BUILD_TESTING
                  description: Enable building of test programs
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
        lib: ${dd4hep.prefix}/lib
        libs:
            default: -ldd4hep
        include: ${dd4hep.prefix}/include
