---
recipe:
    name: libxcursor
    description: X Cursor management library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.2.3
              url: https://www.x.org/releases/individual/lib/libXcursor-1.2.3.tar.xz

    dependencies:
        - libx11
        - libxrender
        - libxfixes

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxcursor.prefix}/lib
        libs:
            default: -lXcursor
        include: ${libxcursor.prefix}/include
