cheese:
  name: mgard
  description: MGARD is a multigrid-based lossy compression library for scientific data.
  type: package
  toolchain: cmake

  source:
    type: git
    url: https://github.com/CODARcode/MGARD.git
    releases:
      - version: 1.6.0
        tag: 1.6.0

  dependencies:
    - zlib
    - zstd
    - protobuf

  build:
    # Only build the CPU version for now
    configurations:
      options:
        - name: -DCMAKE_INSTALL_PREFIX
          description: Installation prefix
          enabled_value:
            default: ${mgard.prefix}

        - name: -DCMAKE_BUILD_TYPE
          description: CMake build type
          enabled_value:
            default: Release

        - name: -DMGARD_ENABLE_SERIAL
          description: Enable CPU support
          enabled_value:
            default: ON

        - name: -DMGARD_ENABLE_OPENMP
          description: Enable OpenMP support
          user_configurable: true
          enabled_value:
            default: ON

        - name: -DMGARD_ENABLE_DOCS
          description: Build documentation
          enabled_value:
            default: OFF

        - name: -DCMAKE_PREFIX_PATH
          description: CMake prefix path for finding dependencies
          enabled_value:
            default: ${zlib.prefix};${zstd.prefix};${protobuf.prefix}

        - name: -DCMAKE_CXX_COMPILER
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: -DCMAKE_BUILD_RPATH
          description: RPATH for built libraries
          enabled_value:
            default: ${mgard.prefix}/lib

        - name: -DCMAKE_INSTALL_RPATH
          description: RPATH for installed libraries
          enabled_value:
            default: ${mgard.prefix}/lib

        - name: -DCMAKE_CXX_FLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${mgard.prefix}/lib -Wl,-rpath,${mgard.prefix}/lib
    libs:
      default: -lmgard
    includes:
      default: -I${mgard.prefix}/include