---
recipe:
    name: magma
    description: MAGMA - Matrix Algebra on GPU and Multicore Architectures
    type: package
    toolchain: cmake

    #  source:
    #    type: git
    #    url: https://github.com/icl-utk-edu/magma.git
    #    releases:
    #      - version: 2.10.0
    #        tag: v2.10.0
    source:
        type: tarball
        releases:
            - version: 2.10.0
              url: https://icl.utk.edu/projectsfiles/magma/downloads/magma-2.10.0.tar.gz

    dependencies:
        - cuda
        - blas
        - lapack

    build:
        configurations:
            options:
                - name: MAGMA_ENABLE_CUDA
                  enabled_value:
                      default: ON
                  requires: [cuda]

                - name: GPU_TARGET
                  user_configurable: true
                  enabled_value:
                      default: sm_90

                - name: MKLROOT
                  enabled_value:
                      default: ${intel-oneapi-mkl.prefix}

                - name: LAPACK_LIBRARIES
                  enabled_value:
                      default: ${blas.ldflags} ${blas.libs} ${lapack.ldflags} ${lapack.libs}

                - name: BUILD_SHARED_LIBS
                  enabled_value:
                      default: ON

                - name: USE_FORTRAN
                  enabled_value:
                      default: ON

        stages:
            - target:
            - target: install

    properties:
        lib: ${magma.prefix}/lib
        libs:
            default: -lmagma
        include: ${magma.prefix}/include
