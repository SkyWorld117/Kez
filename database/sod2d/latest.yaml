---
recipe:
    name: sod2d
    description: Spectral high-Order coDe 2 solve partial Differential equations
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://gitlab.com/bsc_sod2d/sod2d_gitlab.git
        releases:
            - version: master
              tag: master

    dependencies:
        - mpi
        - hdf5

    build:
        preprocessing: git submodule init && git submodule update

        configurations:
            options:
                - name: CMAKE_POLICY_VERSION_MINIMUM=3.5

                - name: HDF5_ROOT
                  enabled_value:
                      default: ${hdf5.prefix}

                - name: USE_GPU
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: GPU_CUDA
                  user_configurable: true
                  enabled_value:
                      default: 13.2

                - name: TOOL_MESHPART
                  user_configurable: true
                  enabled_value:
                      default: ON

                - name: USE_PORDER
                  user_configurable: true
                  enabled_value:
                      default: 8

        stages:
            - target:
            - target: install

    properties:
