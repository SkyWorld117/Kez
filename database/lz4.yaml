cheese:
  name: lz4
  description: Extremely fast compression algorithm
  type: system
  toolchain: makefile

  source:
    type: tarball
    releases:
      - version: 1.10.0
        url: https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz

  build:
    stages:
      - target: ~
        configurations:
          options:
            - name: CC
              description: C compiler
              enabled_value:
                default: ${compiler.c}

            - name: CXX
              description: C++ compiler
              enabled_value:
                default: ${compiler.cxx}

            - name: CFLAGS
              description: C compiler flags
              user_configurable: true
              enabled_value:
                default: -O3

            - name: CXXFLAGS
              description: C++ compiler flags
              user_configurable: true
              enabled_value:
                default: -O3
      - target: install
        configurations:
          options:
            - name: PREFIX
              description: Installation prefix
              user_configurable: false
              enabled_value:
                default: ${lz4.prefix}

  properties:
    ldflags:
      default: -L${lz4.prefix}/lib -Wl,-rpath,${lz4.prefix}/lib
    libs:
      default: -llz4
    includes:
      default: -I${lz4.prefix}/include