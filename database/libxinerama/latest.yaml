---
recipe:
    name: libxinerama
    description: Xinerama extension library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.1.5
              url: https://www.x.org/releases/individual/lib/libXinerama-1.1.5.tar.xz

    dependencies:
        - libx11
        - libxext

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxinerama.prefix}/lib
        libs:
            default: -lXinerama
        include: ${libxinerama.prefix}/include
