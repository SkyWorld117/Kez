---
recipe:
    name: htop
    description: An interactive process viewer
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 3.5.2
              url: https://github.com/htop-dev/htop/releases/download/3.5.2/htop-3.5.2.tar.xz

    dependencies:
        - hwloc
        - ncurses

    build:
        configurations:
            options:
                - name: enable-hwloc
                  description: Enable hwloc support

                - name: enable-sensors
                  description: Enable sensors support

                - name: with-curses
                  description: Use ncurses library
                  enabled_value:
                      default: ncursesw6

                - name: HWLOC_CFLAGS
                  description: HWLOC CFLAGS
                  enabled_value:
                      default: ${hwloc.incflags}

                - name: HWLOC_LIBS
                  description: HWLOC LIBS
                  enabled_value:
                      default: ${hwloc.ldflags} ${hwloc.libs}

                - name: CURSES_CFLAGS
                  description: NCURSES CFLAGS
                  enabled_value:
                      default: ${ncurses.incflags}

                - name: CURSES_LIBS
                  description: NCURSES LIBS
                  enabled_value:
                      default: ${ncurses.ldflags} ${ncurses.libs}
        stages:
            - target:
            - target: install

    properties:
