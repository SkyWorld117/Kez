---
recipe:
    name: kahip
    description: KaHIP is a Karlsruhe High Quality Partitioning software package.
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/KaHIP/KaHIP.git
        releases:
            - version: 3.25
              tag: v3.25

    dependencies:
        - mpi
        - metis

    build:
        configurations:
            options:
                - name: LIB_METIS
                  description: Path to METIS library
                  enabled_value:
                      # METIS builds a shared library by default. If it is
                      # configured without shared support, fall back to the
                      # static archive.
                      default: ${metis.prefix}/lib/libmetis.so
                      conditions:
                          - condition: ${metis.config.SHARED} false
                            action: set
                            value: ${metis.prefix}/lib/libmetis.a

                - name: MPI_C_COMPILER
                  description: MPI C compiler
                  enabled_value:
                      default: ${mpi.c}

                - name: MPI_CXX_COMPILER
                  description: MPI C++ compiler
                  enabled_value:
                      default: ${mpi.cxx}

        stages:
            - target:
            - target: install

    properties:
        lib: ${kahip.prefix}/lib
        libs:
            default: -lkahip
        include: ${kahip.prefix}/include
