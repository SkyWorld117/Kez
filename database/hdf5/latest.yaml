---
recipe:
    name: hdf5
    description: High-performance data management and storage suite
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 2.1.1
              url: https://github.com/HDFGroup/hdf5/releases/download/2.1.1/hdf5-2.1.1.tar.gz

    build:
        configurations:
            options:
                - name: BUILD_SHARED_LIBS
                  description: Build shared libraries
                  user_configurable: true
                  enabled:
                      default: true
                  enabled_value:
                      default: ON

                - name: ONLY_SHARED_LIBS
                  description: Build only shared libraries
                  enabled:
                      default: false
                  enabled_value:
                      default: OFF

                - name: HDF5_BUILD_CPP_LIB
                  description: Build C++ library
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON

                - name: HDF5_BUILD_FORTRAN
                  description: Build Fortran library
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON

                - name: HDF5_BUILD_HL_LIB
                  description: Build High Level library
                  user_configurable: true
                  enabled:
                      default: true
                  enabled_value:
                      default: ON

                - name: HDF5_BUILD_TOOLS
                  description: Build tools
                  user_configurable: true
                  enabled:
                      default: true
                  enabled_value:
                      default: ON

                - name: HDF5_ENABLE_PARALLEL
                  description: Enable parallel support
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ON
                  requires:
                      - mpi

                - name: MPI_C_COMPILER
                  description: MPI C compiler
                  enabled:
                      conditions:
                          - condition: ${hdf5.config.HDF5_ENABLE_PARALLEL} true
                            value: true
                  enabled_value:
                      default: ${mpi.c}

                - name: MPI_CXX_COMPILER
                  description: MPI C++ compiler
                  enabled:
                      conditions:
                          - condition: ${hdf5.config.HDF5_ENABLE_PARALLEL} true
                            value: true
                  enabled_value:
                      default: ${mpi.cxx}

                - name: MPI_Fortran_COMPILER
                  description: MPI Fortran compiler
                  enabled:
                      conditions:
                          - condition: ${hdf5.config.HDF5_ENABLE_PARALLEL} true
                            value: true
                  enabled_value:
                      default: ${mpi.fort}

                # ============ Compression filters ============
                - name: HDF5_ENABLE_ZLIB_SUPPORT
                  description: Enable Zlib (deflate) compression filters
                  user_configurable: true
                  enabled:
                      default: true
                  enabled_value:
                      default: ON
                  requires:
                      - zlib

                - name: ZLIB_ROOT
                  description: Path to zlib installation
                  enabled:
                      conditions:
                          - condition: ${hdf5.config.HDF5_ENABLE_ZLIB_SUPPORT} true
                            value: true
                  enabled_value:
                      default: ${zlib.prefix}
        stages:
            - target:
            - target: install

    properties:
        lib: ${hdf5.prefix}/lib
        libs:
            default: -lhdf5
        include: ${hdf5.prefix}/include
