---
recipe:
    name: libxau
    description: X11 Authorization library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.0.12
              url: https://www.x.org/releases/individual/lib/libXau-1.0.12.tar.xz

    dependencies:
        - xorgproto
        - util-macros

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxau.prefix}/lib
        libs:
            default: -lXau
        include: ${libxau.prefix}/include
