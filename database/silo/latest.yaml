---
recipe:
    name: silo
    description: >
        Mesh and Field I/O Library and Scientific Database from LLNL. SILO provides
        a file-based, high-performance data exchange format for scientific mesh and
        field data, supporting structured, unstructured, AMR, and CSG mesh types.
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 4.12.0
              url: https://github.com/llnl/Silo/releases/download/4.12.0/Silo-4.12.0.tar.xz

    dependencies:
        - mpi
        - hdf5
        - zlib
        - python

    build:
        configurations:
            options:
                - name: enable-shared
                  description: Build shared libraries

                - name: enable-fortran
                  description: Build Fortran bindings

                - name: with-zlib
                  description: Use zlib for compression (INC,DIR)
                  enabled_value:
                      default: ${zlib.include},${zlib.lib}

                - name: with-hdf5
                  description: Use HDF5 for I/O (INC,DIR)
                  enabled_value:
                      default: ${hdf5.include},${hdf5.prefix}/lib

                - name: enable-pythonmodule
                  description: Build the Python module
                  user_configurable: true
                  enabled:
                      default: false

                - name: with-python_exec_prefix
                  description: Path to the Python executable
                  enabled_value:
                      default: ${python.executable}

                # Silo ships C++ codecs (src/hzip, src/fpzip) as libtool
                # convenience libraries, but links libsiloh5 itself from a C
                # source with the C driver, so nothing on the link line names
                # the C++ runtime and the shared library is left with undefined
                # operator new / __cxa_* / __gxx_personality_v0 symbols.  This
                # used to be masked: the libtool archive of any C++ library in
                # the dependency closure spliced -lstdc++ in by accident.
                # Upstream passes -lstdc++ the same way for non-GNU compilers
                # (svn_bin/build-3rdparty-open, silo-release-open).
                - name: LIBS
                  description: Libraries to link against
                  enabled_value:
                      default: -lstdc++
        stages:
            - target:
            - target: install

    properties:
        lib: ${silo.prefix}/lib
        libs:
            default: -lsiloh5
        include: ${silo.prefix}/include
