cheese:
  name: fftw3
  description: FFTW is a C library for computing the discrete Fourier transform in one or more dimensions, of arbitrary input size, and of both real and complex data.
  type: package
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 3.3.11
        url: https://www.fftw.org/fftw-3.3.11.tar.gz

  build:
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${fftw3.prefix}

        - name: --enable-shared
          description: Build shared library

        - name: --enable-float
          description: Build single-precision version of the library
          user_configurable: true
          enabled:
            default: false

        - name: --enable-long-double
          description: Build long double-precision version of the library
          user_configurable: true
          enabled:
            default: false

        - name: --enable-long-double
          description: Build long double-precision version of the library
          user_configurable: true
          enabled:
            default: false

        - name: --enable-quad-precision
          description: Build quad-precision version of the library
          user_configurable: true
          enabled:
            default: false

        - name: --enable-sse
          description: Build SSE-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: false

        - name: --enable-sse2
          description: Build SSE/SSE2-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-avx
          description: Build AVX-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: false

        - name: --enable-avx2
          description: Build AVX/AVX2-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-avx512
          description: Build AVX-512-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-avx-128-fma
          description: Build AVX-128-FMA-optimized version of the library [x86_64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-neon
          description: Build NEON-optimized version of the library [arm64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-sve
          description: Build SVE-optimized version of the library [arm64]
          user_configurable: true
          enabled:
            default: true

        - name: --enable-fma
          description: Enable FMA if the machine architecture "naturally" prefers it
          user_configurable: true
          enabled:
            default: true

        - name: --enable-mpi
          description: Enable MPI support
          user_configurable: true
          enabled:
            default: false
          requires: [mpi]

        - name: --enable-openmp
          description: Enable OpenMP support
          user_configurable: true
          enabled:
            default: true

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: MPICC
          description: MPI C compiler wrapper
          enabled_value:
            default: ${compiler.c}
            conditions:
              - condition: ${fftw3.config.--enable-mpi} true
                action: set
                value: ${mpi.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3 -fPIC
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${fftw3.prefix}/lib -Wl,-rpath,${fftw3.prefix}/lib
    libs:
      default: -lfftw3
    includes:
      default: -I${fftw3.prefix}/include