---
recipe:
    name: elpa
    type: package
    description: ELPA - Eigenvalue soLvers for Petaflop Applications (HPC optimized)
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2026.02.002
              url: https://elpa.mpcdf.mpg.de/software/tarball-archive/Releases/2026.02.002/elpa-2026.02.002.tar.gz

    dependencies:
        - mpi
        - blas
        - lapack
        - scalapack

    build:
        configurations:
            # This needs to be set because NVCC is not properly parsed by elpa.
            environment:
                - name: PATH
                  description: Add NVCC to PATH for GPU kernel compilation
                  default: ${mpi.prefix}/bin:${cuda.prefix}/bin:${PATH}

            options:
                # ============ Core parallelization ============
                - name: with-mpi
                  description: Enable MPI parallelization
                  user_configurable: true
                  disabled_format: without-mpi=no

                - name: enable-openmp
                  description: Enable OpenMP for shared-memory parallelism
                  user_configurable: true
                  disabled_format: disable-openmp

                # ============ CPU kernel selection ============
                - name: enable-generic-kernels
                  description: Build generic kernels
                  user_configurable: true
                  enabled:
                      default: false
                  disabled_format: disable-generic-kernels

                # ============ Virtual Options for CPU kernel selection ============
                - name: x86-256bit
                  description: Virtual option to enable all 256-bit kernels (SSE, AVX, AVX2)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: ''
                  disabled_format: ''

                - name: x86-512bit
                  description: Virtual option to enable all 512-bit kernels (SSE, AVX, AVX2, AVX512)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: ''
                  disabled_format: ''

                - name: arm-256bit
                  description: Virtual option to enable all 256-bit kernels (NEON)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: ''
                  disabled_format: ''

                - name: arm-512bit
                  description: Virtual option to enable all 512-bit kernels (SVE)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: ''
                  disabled_format: ''

                # ============ CPU kernel selection ============

                - name: enable-avx-kernels
                  description: Build AVX kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.x86-256bit} true || ${elpa.config.x86-512bit} true
                            value: true
                  disabled_format: disable-avx-kernels

                - name: enable-avx2-kernels
                  description: Build AVX2 kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.x86-256bit} true || ${elpa.config.x86-512bit} true
                            value: true
                  disabled_format: disable-avx2-kernels

                - name: enable-avx512-kernels
                  description: Build AVX-512 kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.x86-512bit} true
                            value: true
                  disabled_format: disable-avx512-kernels

                - name: enable-sse-kernels
                  description: Build SSE kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.x86-256bit} true || ${elpa.config.x86-512bit} true
                            value: true
                  disabled_format: disable-sse-kernels

                - name: enable-sse-assembly-kernels
                  description: Build SSE assembly kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.x86-256bit} true || ${elpa.config.x86-512bit} true
                            value: true
                  disabled_format: disable-sse-assembly-kernels

                - name: enable-neon-arch64-kernels
                  description: Build ARM NEON kernels (ARMv8.2-A)
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.arm-256bit} true || ${elpa.config.arm-512bit} true
                            value: true
                  disabled_format: disable-neon-arch64-kernels

                - name: enable-sve128-kernels
                  description: Build ARM SVE128 kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.arm-256bit} true || ${elpa.config.arm-512bit} true
                            value: true
                  disabled_format: disable-sve128-kernels

                - name: enable-sve256-kernels
                  description: Build ARM SVE256 kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.arm-256bit} true || ${elpa.config.arm-512bit} true
                            value: true
                  disabled_format: disable-sve256-kernels

                - name: enable-sve512-kernels
                  description: Build ARM SVE512 kernels
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.arm-512bit} true
                            value: true
                  disabled_format: disable-sve512-kernels

                # ============ Nvidia GPU support ============
                - name: enable-nvidia-gpu-kernels
                  description: Build Nvidia GPU kernels (requires CUDA). Set compute capability with --with-NVIDIA-GPU-compute-capability
                  user_configurable: true
                  enabled:
                      default: false
                  disabled_format: disable-nvidia-gpu-kernels
                  requires: [cuda]

                - name: with-cuda-path
                  description: Path to CUDA installation. Auto-detected by default
                  enabled:
                      default: false
                      conditions:
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            value: true
                  enabled_value:
                      default: ${cuda.prefix}
                  requires: [cuda]

                - name: enable-gpu-streams
                  description: Enable CUDA streams for GPU kernels
                  enabled:
                      conditions:
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            value: true
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                            value: false
                  enabled_format: enable-gpu-streams=nvidia
                  requires: [cuda]

                - name: with-NVIDIA-GPU-compute-capability
                  description: NVIDIA GPU compute capabilities to build for (comma-separated, e.g. sm_60,sm_80)
                  user_configurable: true
                  enabled:
                      conditions:
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            value: true
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                            value: false
                  enabled_value:
                      default: sm_80

                - name: enable-nvidia-sm80-gpu-kernels
                  description: Build Nvidia GPU kernels for compute capability 8.0+ (A100, H100, etc.)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: enable-nvidia-sm80-gpu-kernels
                  disabled_format: disable-nvidia-sm80-gpu-kernels
                  requires: [cuda]

                - name: with-cusolver
                  description: Use Nvidia cuSolver library (yes by default when CUDA enabled)
                  enabled:
                      conditions:
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            value: true
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                            value: false
                  enabled_format: with-cusolver=yes
                  requires: [cuda]

                - name: enable-nvidia-cub
                  description: Use Nvidia CUB library for GPU kernels (yes by default when CUDA enabled)
                  enabled:
                      conditions:
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            value: true
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} false
                            value: false
                  enabled_format: enable-nvidia-cub
                  requires: [cuda]

                - name: enable-cuda-aware-mpi
                  description: Enable CUDA-aware MPI (experimental)
                  user_configurable: true
                  enabled:
                      default: false
                  disabled_format: disable-cuda-aware-mpi
                  requires: [cuda]

                - name: enable-gpu-ccl
                  description: Enable collective communication library (NCCL from NVHPC)
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: nccl
                  disabled_format: disable-gpu-ccl
                  requires: [cuda, nvhpc-nccl]

                - name: with-nccl-path
                  description: Path to NCCL installation directory
                  enabled:
                      conditions:
                          - condition: ${elpa.config.enable-gpu-ccl} true
                            value: true
                          - condition: ${elpa.config.enable-gpu-ccl} false
                            value: false
                  enabled_value:
                      default: ${nvhpc-nccl.prefix}
                  requires: [nvhpc-nccl]

                # ============ AMD GPU support ============

                # - name: enable-amd-gpu
                #   description: Build AMD GPU kernels (requires ROCm/HIP)
                #   user_configurable: true
                #   enabled:
                #     default: false
                #   enabled_format: enable-amd-gpu
                #   disabled_format: disable-amd-gpu

                # ============ Performance tuning ============
                - name: enable-single-precision
                  description: Build also for single precision
                  user_configurable: true
                  enabled:
                      default: false
                  disabled_format: disable-single-precision

                - name: enable-autotuning
                  description: Enable runtime autotuning
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: disable-autotuning

                # - name: with-papi
                #   description: Use PAPI library to measure flop counts
                #   user_configurable: true
                #   enabled:
                #     default: false
                #   enabled_format: with-papi=yes
                #   disabled_format: with-papi=no

                # - name: with-likwid
                #   description: Use LIKWID for performance measurement
                #   user_configurable: true
                #   enabled:
                #     default: false
                #   enabled_format: with-likwid=yes
                #   disabled_format: with-likwid=no

                - name: enable-timings
                  description: Enable internal timing measurements
                  user_configurable: true
                  enabled:
                      default: false
                  disabled_format: disable-timings

                # ============ Fortran & compilation features ============
                - name: disable-Fortran2008-features
                  description: Do NOT use Fortran 2008 features (for older compilers)
                  enabled:
                      default: false

                - name: enable-ifx-compiler
                  description: Apply compatibility patches for older Intel oneAPI ifx compiler versions
                  enabled:
                      default: false

                # =========== Linker ====================================
                - name: LDFLAGS
                  enabled_value:
                      default: ${compiler.ldflags}
                      conditions:
                          - condition: ${elpa.config.enable-gpu-ccl} true
                            action: append
                            value: ${nvhpc-nccl.ldflags} ${nvhpc-nccl.libs}
                          - condition: ${elpa.config.enable-nvidia-gpu-kernels} true
                            action: append
                            value: ${cuda.ldflags}

                - name: SCALAPACK_FCFLAGS
                  enabled_value:
                      default: ${scalapack.incflags}

                - name: SCALAPACK_LDFLAGS
                  enabled_value:
                      default: ${scalapack.ldflags} ${scalapack.libs}

        stages:
            - target:
              configurations:
                  environment:
                      - name: PATH
                        description: Add NVCC to PATH for GPU kernel compilation
                        default: ${cuda.prefix}/bin:${PATH}
            - target: install

    properties:
        lib: ${elpa.prefix}/lib
        libs:
            default: -lelpa
            conditions:
                - condition: ${elpa.config.enable-openmp} true
                  value: -lelpa_openmp
        include: ${elpa.prefix}/include
        modules_dir:
            default: ${elpa.prefix}/include/elpa-${elpa.version}/modules
            conditions:
                - condition: ${elpa.config.enable-openmp} true
                  value: ${elpa.prefix}/include/elpa_openmp-${elpa.version}/modules
