cheese:
  name: libx11
  description: X11 client-side library
  type: package
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 1.8.12
        url: https://gitlab.freedesktop.org/xorg/lib/libx11/-/archive/libX11-1.8.12/libx11-libX11-1.8.12.tar.gz

  dependencies:
    - xorgproto
    - libxcb
    - xtrans

  build:
    configurations:
      environment:
        - name: PKG_CONFIG_PATH
          description: pkg-config search path
          enabled_value:
            default: ${xtrans.prefix}/share/pkgconfig
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${libx11.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: LDFLAGS
          description: Linker flags
          enabled_value:
            default: ${libxcb.ldflags}
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${libx11.prefix}/lib -Wl,-rpath,${libx11.prefix}/lib
    libs:
      default: -lX11
    includes:
      default: -I${libx11.prefix}/include