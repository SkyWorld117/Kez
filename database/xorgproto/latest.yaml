---
recipe:
    name: xorgproto
    description: X.Org Protocol headers
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 2025.1
              url: https://www.x.org/releases/individual/proto/xorgproto-2025.1.tar.xz
            - version: 2024.1
              url: https://www.x.org/releases/individual/proto/xorgproto-2024.1.tar.xz

    dependencies:
        - util-macros

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        include: ${xorgproto.prefix}/include
