---
recipe:
    name: protobuf
    description: Protocol Buffers - Google's data interchange format
    type: package
    toolchain: cmake

    source:
        type: git
        url: https://github.com/protocolbuffers/protobuf.git
        releases:
            - version: 35.1
              tag: v35.1
            - version: 25.9
              tag: v25.9

    build:
        preprocessing: git submodule update --init --recursive

        configurations:
            options:
                - name: protobuf_BUILD_TESTS
                  description: Build protobuf tests
                  enabled_value:
                      default: OFF

                - name: CMAKE_C_FLAGS
                  description: C compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3 -fPIC

                - name: CMAKE_CXX_FLAGS
                  description: C++ compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3 -fPIC
        stages:
            - target:
            - target: install

    properties:
        lib: ${protobuf.prefix}/lib64
        include: ${protobuf.prefix}/include
