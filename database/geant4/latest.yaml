---
recipe:
    name: geant4
    description: Geant4 - A toolkit for the simulation of the passage of particles through matter
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 11.3.2
              url: https://gitlab.cern.ch/geant4/geant4/-/archive/v11.3.2/geant4-v11.3.2.tar.gz

    dependencies:
        - xerces-c

    build:
        configurations:
            options:
                - name: CMAKE_CXX_STANDARD
                  description: C++ standard version
                  enabled_value:
                      default: 20

                - name: GEANT4_BUILD_MULTITHREADED
                  description: Enable multithreading support
                  enabled_value:
                      default: OFF

                - name: GEANT4_USE_GDML
                  description: Enable GDML support
                  enabled_value:
                      default: ON

                - name: GEANT4_BUILD_TLS_MODEL
                  description: Enable Thread Local Storage model
                  enabled_value:
                      default: global-dynamic

                - name: XERCESC_ROOT_DIR
                  description: Path to Xerces-C installation
                  enabled_value:
                      default: ${xerces-c.prefix}

        stages:
            - target:
            - target: install

    properties:
        lib: ${geant4.prefix}/lib
        libs:
            default: -lGeant4
        include: ${geant4.prefix}/include
