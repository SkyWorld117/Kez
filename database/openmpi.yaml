cheese:
  name: openmpi
  description: Open Source Implementation of the Message Passing Interface
  type: mpi
  toolchain: autotools

  source:
    type: tarball
    releases:
      - version: 5.0.10
        url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.gz
      - version: 5.0.9
        url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.9.tar.gz
      - version: 4.1.8
        url: https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.8.tar.gz
  
  dependencies:
    - hwloc
    - libevent
    - pmix
    - prrte
    - ucx
    - numactl

  build:
    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${openmpi.prefix}

        - name: --enable-builtin-atomics
          description: Enable built-in atomics

        - name: --disable-silent-rules
          description: Disable silent rules

        - name: --disable-wrapper-runpath
          description: Disable wrapper RPATH

        - name: --disable-sphinx
          description: Disable building Sphinx documentation

        - name: --enable-branch-probabilities
          description: Enable profile arcs and branch probability optimization
        
        - name: --enable-mpi-fortran
          description: Enable Fortran bindings
        
        - name: --enable-oshmem
          description: Enable OpenSHMEM support

        - name: --enable-oshmem-compat
          description: Enable OpenSHMEM compatibility

        - name: --enable-wrapper-rpath
          description: Enable wrapper RPATH
        
        - name: --enable-memchecker
          description: Enable memory and buffer checks
          user_configurable: true
          enabled:
            default: false
          disabled_format: --disable-memchecker

        - name: --with-mpi-param-check
          description: Enable MPI parameter checking [always | runtime | never]
          user_configurable: true
          enabled_value:
            default: never

        - name: --with-oshmem-param-check
          description: Enable OpenSHMEM parameter checking [always | never]
          user_configurable: true
          enabled_value:
            default: never

        - name: --with-libevent
          description: Build with libevent support
          enabled_value:
            default: ${libevent.prefix}

        - name: --with-hwloc
          description: Build with hwloc support
          enabled_value:
            default: ${hwloc.prefix}

        - name: --with-pmix
          description: Build with PMIx support
          enabled_value:
            default: ${pmix.prefix}

        - name: --with-prrte
          description: Build with PRRTE support
          enabled_value:
            default: ${prrte.prefix}

        - name: --with-slurm
          description: Build with SLURM support

        - name: --with-ucx
          description: Build with UCX support
          enabled_value:
            default: ${ucx.prefix}

        - name: --without-ucc
          description: Build without UCC support

        - name: --without-psm
          description: Build without PSM/PSM2 support

        - name: --without-mxm
          description: Build without MXM support

        - name: --without-ofi
          description: Build without OFI support

        - name: --without-verbs
          description: Build without libibverbs support

        - name: --without-knem
          description: Build without KNEM support

        - name: --without-fca
          description: Build without FCA support

        - name: --without-xpmem
          description: Build without XPMEM support
            
        - name: --with-cuda
          description: Build with CUDA support
          user_configurable: true
          enabled:
            default: false
          enabled_value:
            default: ${cuda.prefix}
          requires: [cuda]

        - name: --with-rocm
          description: Build with ROCm support
          user_configurable: true
          enabled:
            default: false
          enabled_value:
            default: ${rocm.prefix}
          requires: [rocm]

        - name: --with-cma
          description: Enable Cross Memory Attach (CMA)

        - name: --with-hcoll
          description: Build with HCOLL support
          user_configurable: true
          enabled:
            default: false
          enabled_value:
            default: ${hcoll.prefix}
          requires: [hcoll]

        - name: --with-libnuma
          description: Build with libnuma support
          enabled_value:
            default: ${numactl.prefix}

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXX
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: CXXFLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: FC
          description: Fortran compiler
          enabled_value:
            default: ${compiler.fort}

        - name: FCFLAGS
          description: Fortran compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: LDFLAGS
          description: Linker flags
          enabled_value:
            default: ${compiler.ldflags} ${libevent.ldflags} ${hwloc.ldflags} ${pmix.ldflags} ${prrte.ldflags} ${ucx.ldflags} ${numactl.ldflags}
            conditions:
              - condition: ${openmpi.config.--with-hcoll} true
                action: append
                value: ${hcoll.ldflags}
              - condition: ${openmpi.config.--with-cuda} true
                action: append
                value: ${cuda.ldflags}
              - condition: ${openmpi.config.--with-rocm} true
                action: append
                value: ${rocm.ldflags}
    stages:
      - target: ~
      - target: install

  properties:
    c: ${openmpi.prefix}/bin/mpicc
    cxx: ${openmpi.prefix}/bin/mpicxx
    fort: ${openmpi.prefix}/bin/mpifort
    fortflags:
      default: -I${openmpi.prefix}/lib -lmpi_usempif08 -lmpi_usempi_ignore_tkr -lmpi_mpifh
    ldflags:
      default: -L${openmpi.prefix}/lib -Wl,-rpath,${openmpi.prefix}/lib
    libs:
      default: -lmpi
    includes:
      default: -I${openmpi.prefix}/include
