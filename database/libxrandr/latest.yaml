---
recipe:
    name: libxrandr
    description: X Resize, Rotate and Reflect Extension library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.5.4
              url: https://www.x.org/releases/individual/lib/libXrandr-1.5.4.tar.xz

    dependencies:
        - xorgproto
        - libx11
        - libxext
        - libxrender
        - util-macros

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxrandr.prefix}/lib
        libs:
            default: -lXrandr
        include: ${libxrandr.prefix}/include
