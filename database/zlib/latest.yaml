---
recipe:
    name: zlib
    description: Compression library implementing the deflate compression method
    type: system
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.3.1
              url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz

    build:
        configurations:
            options:
                - name: 64
                  description: Enable 64-bit support

        stages:
            - target:
            - target: install

    properties:
        lib: ${zlib.prefix}/lib
        libs:
            default: -lz
        include: ${zlib.prefix}/include
