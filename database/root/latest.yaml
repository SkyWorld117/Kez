---
recipe:
    name: root
    description: ROOT Data Analysis Framework
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 6.40.02
              url: https://root.cern/download/root_v6.40.02.source.tar.gz
            - version: 6.36.04
              url: https://root.cern/download/root_v6.36.04.source.tar.gz

    build:
        configurations:
            options:
                - name: CMAKE_CXX_STANDARD
                  description: C++ standard version
                  enabled_value:
                      default: 20

                - name: gdml
                  description: Enable GDML support
                  enabled_value:
                      default: ON

                - name: geom
                  description: Enable Geometry support
                  enabled_value:
                      default: ON

                - name: asimage
                  description: Enable ASImage support
                  enabled_value:
                      default: OFF

                - name: tmva
                  description: Enable TMVA support
                  enabled_value:
                      default: OFF

                - name: xrootd
                  description: Enable XRootD support
                  enabled_value:
                      default: OFF

                - name: DAVIX
                  description: Enable DAVIX support
                  enabled_value:
                      default: OFF

                - name: x11
                  description: Enable X11 support
                  enabled_value:
                      default: OFF

                - name: opengl
                  description: Enable OpenGL support
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
        lib: ${root.prefix}/lib
        libs:
            default: -lCore -lRIO -lNet -lHist -lGraf -lGraf3d -lGpad -lTree -lRint -lPostscript -lMatrix -lPhysics -lMathCore -lThread -lMultiProc 
                -lMinuit -lMinuit2
        include: ${root.prefix}/include
