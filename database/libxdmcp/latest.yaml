---
recipe:
    name: libxdmcp
    description: X Display Manager Control Protocol library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.1.5
              url: https://www.x.org/releases/individual/lib/libXdmcp-1.1.5.tar.xz

    dependencies:
        - xorgproto
        - util-macros

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxdmcp.prefix}/lib
        libs:
            default: -lXdmcp
        include: ${libxdmcp.prefix}/include
