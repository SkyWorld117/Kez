cheese:
  name: gdrcopy
  description: GDRCopy userspace library
  type: package

  # This package should not be built from source
  # Use the system package instead

  properties:
    ldflags:
      default: -L${gdrcopy.prefix}/lib64 -Wl,-rpath,${gdrcopy.prefix}/lib64
    libs:
      default: -lgdrapi
    includes:
      default: -I${gdrcopy.prefix}/include