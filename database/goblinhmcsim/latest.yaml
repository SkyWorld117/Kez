---
recipe:
    name: goblinhmcsim
    description: Goblin HMC Sim
    type: package
    toolchain: make

    source:
        type: tarball
        releases:
            - version: sst-8.0.0
              url: https://github.com/tactcomplabs/gc64-hmcsim/archive/refs/tags/sst-8.0.0-release.tar.gz

    build:
        stages:
            - target:
              configurations:
                  options:
                      - name: CC
                        description: C compiler
                        enabled_value:
                            default: ${compiler.c}

                      - name: CXX
                        description: C++ compiler
                        enabled_value:
                            default: ${compiler.cxx}
            - target: install
              configurations:
                  options:
                      - name: PREFIX
                        description: Installation prefix
                        enabled_value:
                            default: ${goblinhmcsim.prefix}

    properties:
        lib: ${goblinhmcsim.prefix}/lib
        include: ${goblinhmcsim.prefix}/include
