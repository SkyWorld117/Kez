---
recipe:
    name: nvhpc
    type: vendor

    source:
        type: tarball
        releases:
            - version: 26.5
              url: https://developer.download.nvidia.com/hpc-sdk/26.5/nvhpc_2026_265_Linux_x86_64_cuda_13.2.tar.gz
            - version: 26.3
              url: https://developer.download.nvidia.com/hpc-sdk/26.3/nvhpc_2026_263_Linux_${kez.arch}_cuda_13.1.tar.gz
            - version: 25.7
              url: https://developer.download.nvidia.com/hpc-sdk/25.7/nvhpc_2025_257_Linux_${kez.arch}_cuda_12.9.tar.gz

    build:
        postprocessing: |-
            mkdir -p ${nvhpc.prefix}
            NVHPC_SILENT=true NVHPC_INSTALL_DIR=${nvhpc.prefix} ${source}/install

    properties:
