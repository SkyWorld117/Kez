---
recipe:
    name: cmake
    description: CMake Build System
    type: package

    source:
        type: script
        releases:
            - version: 4.4.0
              url: https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-linux-${kez.arch}.sh
            - version: 3.31.12
              url: https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-linux-${kez.arch}.sh

    build:
        postprocessing: |-
            mkdir -p ${cmake.prefix}
            bash ${source} --skip-license --prefix=${cmake.prefix}
