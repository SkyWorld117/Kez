---
recipe:
    name: libpng
    description: A library for reading and writing PNG images
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.6.58
              url: https://download.sourceforge.net/libpng/libpng-1.6.58.tar.xz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libpng.prefix}/lib
        libs:
            default: -lpng
        include: ${libpng.prefix}/include
