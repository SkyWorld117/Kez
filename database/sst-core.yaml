cheese:
  name: sst-core
  description: Structural Simulation Toolkit Core
  type: package
  toolchain: autotools

  source:
    type: git
    url: https://github.com/sstsimulator/sst-core.git
    releases:
      - version: scc25
        tag: 546dda2
    
  dependencies:
    - mpi
    - python

  build:
    preprocessing: ./autogen.sh

    configurations:
      options:
        - name: --prefix
          description: Installation prefix
          enabled_value:
            default: ${sst-core.prefix}

        - name: --with-python
          description: Path to Python interpreter
          enabled_value:
            default: ${python.prefix}

        - name: --with-hdf5
          description: Use HDF5 statistics format
          user_configurable: true
          enabled:
            default: false
          enabled_value:
            default: ${hdf5.prefix}
          disabled_format: --without-hdf5
          requires: [hdf5]

        - name: CC
          description: C compiler
          enabled_value:
            default: ${compiler.c}

        - name: CFLAGS
          description: C compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: CXX
          description: C++ compiler
          enabled_value:
            default: ${compiler.cxx}

        - name: CXXFLAGS
          description: C++ compiler flags
          user_configurable: true
          enabled_value:
            default: -O3

        - name: MPICC
          description: MPI C compiler
          enabled_value:
            default: ${mpi.c}
            
        - name: MPICXX
          description: MPI C++ compiler
          enabled_value:
            default: ${mpi.cxx}

        - name: LDFLAGS
          description: Linker flags
          enabled_value:
            default: ${python.ldflags} ${python.libs}
    stages:
      - target: ~
      - target: install

  properties:
    ldflags:
      default: -L${sst-core.prefix}/lib -Wl,-rpath,${sst-core.prefix}/lib
    includes:
      default: -I${sst-core.prefix}/include
