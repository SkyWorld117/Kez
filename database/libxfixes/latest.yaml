---
recipe:
    name: libxfixes
    description: X Fixes extension library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 6.0.2
              url: https://www.x.org/releases/individual/lib/libXfixes-6.0.2.tar.xz

    dependencies:
        - xorgproto
        - libx11

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libxfixes.prefix}/lib
        libs:
            default: -lXfixes
        include: ${libxfixes.prefix}/include
