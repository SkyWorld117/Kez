---
recipe:
    name: netcdf-fortran
    description: Unidata netCDF Fortran library, providing the Fortran 77/90 APIs on top of the netCDF-C library
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 4.6.4
              url: https://github.com/Unidata/netcdf-fortran/archive/refs/tags/v4.6.4.tar.gz

    dependencies:
        - netcdf-c

    build:
        configurations:
            options:
                - name: enable-shared
                  description: Build shared libraries
                  user_configurable: true
                  disabled_format: disable-shared

                - name: CC
                  description: C compiler, must match the compiler used to build netcdf-c
                  enabled_value:
                      default: ${compiler.c}
                      conditions:
                          - condition: ${netcdf-c.config.enable-parallel4} true
                            value: ${mpi.c}

                - name: FC
                  description: Fortran 90 compiler, must match the compiler used to build netcdf-c/hdf5
                  enabled_value:
                      default: ${mpi.fort}
                      conditions:
                          - condition: ${netcdf-c.config.enable-parallel4} true
                            value: ${mpi.fort}

        stages:
            - target:
            - target: install

    properties:
        lib: ${netcdf-fortran.prefix}/lib
        libs:
            default: -lnetcdff
        include: ${netcdf-fortran.prefix}/include
