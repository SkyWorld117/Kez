---
recipe:
    name: zfp
    description: ZFP is a compressed floating-point array library.
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 1.0.1
              url: https://github.com/llnl/zfp/releases/download/1.0.1/zfp-1.0.1.tar.gz

    build:
        configurations:
            options:
                - name: ZFP_WITH_OPENMP
                  description: Enable OpenMP support
                  enabled_value:
                      default: ON

        stages:
            - target:
            - target: install

    properties:
        lib: ${zfp.prefix}/lib
        libs:
            default: -lzfp
        include: ${zfp.prefix}/include
