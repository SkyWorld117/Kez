---
recipe:
    name: sst-core
    description: Structural Simulation Toolkit Core
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 16.0.0
              url: https://github.com/sstsimulator/sst-core/releases/download/v16.0.0_Final/sstcore-16.0.0.tar.gz

    dependencies:
        - mpi

    build:
        postprocessing: |-
            mkdir -p ${sst-core.prefix}/src
            cp -r ${source}/src/* ${sst-core.prefix}/src/
            cp -r ${source}/tests ${sst-core.prefix}/tests
            sed -i 's|testsdir=.*|testsdir=${sst-core.prefix}/tests|' ${sst-core.prefix}/etc/sst/sstsimulator.conf

        configurations:
            options:
                - name: with-python
                  description: Path to Python interpreter
                  enabled_value:
                      default: ${python.prefix}
                  requires:
                      - python

                - name: with-hdf5
                  description: Use HDF5 statistics format
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${hdf5.prefix}
                  disabled_format: without-hdf5
                  requires:
                      - hdf5

                - name: MPICC
                  description: MPI C compiler
                  enabled_value:
                      default: ${mpi.c}

                - name: MPICXX
                  description: MPI C++ compiler
                  enabled_value:
                      default: ${mpi.cxx}

        stages:
            - target:
            - target: install

    properties:
        lib: ${sst-core.prefix}/lib
        include: ${sst-core.prefix}/include
