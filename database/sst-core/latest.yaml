---
recipe:
    name: sst-core
    description: Structural Simulation Toolkit Core
    type: package
    toolchain: autotools

    source:
        type: git
        url: https://github.com/sstsimulator/sst-core.git
        releases:
            - version: scc25
              tag: 546dda2
            - version: latest
              tag: master

    dependencies:
        - mpi
        - python

    build:
        preprocessing: ./autogen.sh
        postprocessing: |-
            mkdir -p ${sst-core.prefix}/src
            cp -r ${source}/src/* ${sst-core.prefix}/src/
            cp -r ${source}/tests ${sst-core.prefix}/tests
            sed -i 's|testsdir=.*|testsdir=${sst-core.prefix}/tests|' ${sst-core.prefix}/etc/sst/sstsimulator.conf

        configurations:
            options:
                - name: with-python
                  description: Path to Python interpreter
                  enabled_value:
                      default: ${python.prefix}

                - name: with-hdf5
                  description: Use HDF5 statistics format
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_value:
                      default: ${hdf5.prefix}
                  disabled_format: without-hdf5
                  requires: [hdf5]

                - name: CXXFLAGS
                  description: C++ compiler flags
                  user_configurable: true
                  enabled_value:
                      default: -O3

                - name: MPICC
                  description: MPI C compiler
                  enabled_value:
                      default: ${mpi.c}

                - name: MPICXX
                  description: MPI C++ compiler
                  enabled_value:
                      default: ${mpi.cxx}

        stages:
            - target:
            - target: install

    properties:
        lib: ${sst-core.prefix}/lib
        include: ${sst-core.prefix}/include
