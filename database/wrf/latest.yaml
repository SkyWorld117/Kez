---
recipe:
    name: wrf
    description: Weather Research and Forecasting Model, a next-generation mesoscale numerical weather prediction system
    type: package

    source:
        type: tarball
        releases:
            - version: 4.8.0
              url: https://github.com/wrf-model/WRF/releases/download/v4.8.0/v4.8.0.tar.gz

    dependencies:
        - netcdf
        - mpi
        - hdf5
        - zlib

    build:
        configurations:
            environment:
                - name: NETCDF
                  description: Path to the NetCDF installation (C + Fortran combined)
                  default: ${netcdf.prefix}

                - name: HDF5
                  description: Path to HDF5 installation
                  default: ${hdf5.prefix}

                - name: PHDF5
                  description: Path to parallel HDF5 installation
                  default: ${hdf5.prefix}

                - name: WRFIO_NCD_NO_LARGE_FILE_SUPPORT
                  description: Disable large file support for NetCDF I/O
                  default: '1'

                - name: NETCDF4
                  description: Enable NetCDF-4/HDF5 features
                  default: '1'

                - name: PATH
                  description: Prepend MPI binary directory to PATH for MPI compiler wrappers
                  default: ${mpi.prefix}/bin:$PATH

                - name: J
                  description: Number of parallel make jobs, max 20
                  default: -j 8

            options:
                - name: WRF_CONFIG_SELECTION
                  description: >
                      Select the appropriate configuration for the build system.
                       1. (serial)   2. (smpar)   3. (dmpar)   4. (dm+sm)   PGI (pgf90/gcc)
                       5. (serial)   6. (smpar)   7. (dmpar)   8. (dm+sm)   PGI (pgf90/pgcc): SGI MPT
                       9. (serial)  10. (smpar)  11. (dmpar)  12. (dm+sm)   PGI (pgf90/gcc): PGI accelerator
                      13. (serial)  14. (smpar)  15. (dmpar)  16. (dm+sm)   INTEL (ifort/icc)
                                                              17. (dm+sm)   INTEL (ifort/icc): Xeon Phi (MIC architecture)
                      18. (serial)  19. (smpar)  20. (dmpar)  21. (dm+sm)   INTEL (ifort/icc): Xeon (SNB with AVX mods)
                      22. (serial)  23. (smpar)  24. (dmpar)  25. (dm+sm)   INTEL (ifort/icc): SGI MPT
                      26. (serial)  27. (smpar)  28. (dmpar)  29. (dm+sm)   INTEL (ifort/icc): IBM POE
                      30. (serial)               31. (dmpar)                PATHSCALE (pathf90/pathcc)
                      32. (serial)  33. (smpar)  34. (dmpar)  35. (dm+sm)   GNU (gfortran/gcc)
                      36. (serial)  37. (smpar)  38. (dmpar)  39. (dm+sm)   IBM (xlf90_r/cc_r)
                      40. (serial)  41. (smpar)  42. (dmpar)  43. (dm+sm)   PGI (ftn/gcc): Cray XC CLE
                      44. (serial)  45. (smpar)  46. (dmpar)  47. (dm+sm)   CRAY CCE (ftn $(NOOMP)/cc): Cray XE and XC
                      48. (serial)  49. (smpar)  50. (dmpar)  51. (dm+sm)   INTEL (ftn/icc): Cray XC
                      52. (serial)  53. (smpar)  54. (dmpar)  55. (dm+sm)   PGI (pgf90/pgcc)
                      56. (serial)  57. (smpar)  58. (dmpar)  59. (dm+sm)   PGI (pgf90/gcc): -f90=pgf90
                      60. (serial)  61. (smpar)  62. (dmpar)  63. (dm+sm)   PGI (pgf90/pgcc): -f90=pgf90
                      64. (serial)  65. (smpar)  66. (dmpar)  67. (dm+sm)   INTEL (ifort/icc): HSW/BDW
                      68. (serial)  69. (smpar)  70. (dmpar)  71. (dm+sm)   INTEL (ifort/icc): KNL MIC
                      72. (serial)  73. (smpar)  74. (dmpar)  75. (dm+sm)   AMD (flang/clang) :  AMD ZEN1/ ZEN2/ ZEN3 Architectures
                      76. (serial)  77. (smpar)  78. (dmpar)  79. (dm+sm)   INTEL (ifx/icx) : oneAPI LLVM
                      80. (serial)  81. (smpar)  82. (dmpar)  83. (dm+sm)   FUJITSU (frtpx/fccpx): FX10/FX100 SPARC64 IXfx/Xlfx
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: 35

                - name: WRF_NESTING
                  description: Nesting level (0=none, 1=basic, 2=preset moves, 3=vortex following)
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: 1

                - name: WRF_BUILD_TARGET
                  description: |-
                      em_real (3d real case)
                      em_quarter_ss (3d ideal case)
                      em_b_wave (3d ideal case)
                      em_les (3d ideal case)
                      em_heldsuarez (3d ideal case)
                      em_tropical_cyclone (3d ideal case)
                      em_hill2d_x (2d ideal case)
                      em_squall2d_x (2d ideal case)
                      em_squall2d_y (2d ideal case)
                      em_grav2d_x (2d ideal case)
                      em_seabreeze2d_x (2d ideal case)
                      em_scm_xy (1d ideal case)
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: em_real

                - name: WRF_FCOPTIM
                  description: >
                      Fortran optimization flags.  Overrides FCOPTIM in
                      configure.wrf.  Empty leaves stanza defaults.
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: -O3 -march=native -mtune=native

                - name: WRF_FCNOOPT
                  description: >
                      Fortran no-optimization flags (used for files that
                      don't optimize well).  Overrides FCNOOPT in
                      configure.wrf.  Empty leaves stanza defaults.
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: -O3 -march=native -mtune=native

                - name: WRF_FCREDUCEDOPT
                  description: >
                      Fortran reduced optimization flags.  Overrides
                      FCREDUCEDOPT in configure.wrf.  Empty leaves
                      stanza defaults.
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: -O3 -march=native -mtune=native

                - name: WRF_CFLAGS_LOCAL
                  description: >
                      Extra C compiler flags.  Appended to CFLAGS_LOCAL in
                      configure.wrf, preserving stanza flags like -c and -w
                      that are required for correct compilation.  Empty
                      leaves stanza defaults.
                  user_configurable: true
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: -O3 -march=native -mtune=native

                - name: WRF_LDFLAGS_LOCAL
                  description: >
                      Extra linker flags.  Appended to LDFLAGS_LOCAL in
                      configure.wrf.  Empty leaves stanza defaults.
                  enabled_format: ''
                  disabled_format: ''
                  enabled_value:
                      default: ${hdf5.ldflags} ${zlib.ldflags}

            command: >-
                printf "${wrf.config.WRF_CONFIG_SELECTION}\n${wrf.config.WRF_NESTING}\n" | ./configure &&
                sed -i "s|^\(FCOPTIM[[:space:]]*=[[:space:]]*\).*|\1${wrf.config.WRF_FCOPTIM}|" configure.wrf &&
                sed -i "s|^\(FCNOOPT[[:space:]]*=[[:space:]]*\).*|\1${wrf.config.WRF_FCNOOPT}|" configure.wrf &&
                sed -i "s|^\(FCREDUCEDOPT[[:space:]]*=[[:space:]]*\).*|\1${wrf.config.WRF_FCREDUCEDOPT}|" configure.wrf &&
                sed -i "s|^\(CFLAGS_LOCAL[[:space:]]*=[[:space:]]*\)\(.*\)|\1\2 ${wrf.config.WRF_CFLAGS_LOCAL}|" configure.wrf &&
                sed -i "s|^\(LDFLAGS_LOCAL[[:space:]]*=[[:space:]]*\)\(.*\)|\1\2 ${wrf.config.WRF_LDFLAGS_LOCAL}|" configure.wrf &&
                ./compile ${wrf.config.WRF_BUILD_TARGET}

        postprocessing: |-
            mkdir -p ${wrf.prefix}/bin ${wrf.prefix}/run
            for f in wrf real ndown tc ideal wrfplus; do
                [ -f "main/${f}.exe" ] && cp -v "main/${f}.exe" "${wrf.prefix}/bin/"
            done
            cp -rv run/* ${wrf.prefix}/run/ 2>/dev/null || true
            for d in test/em_real test/em_ideal; do
                [ -d "$d" ] && mkdir -p "${wrf.prefix}/${d}" && cp -v "$d/"*.exe "${wrf.prefix}/${d}/" 2>/dev/null || true
            done

    properties:
