---
recipe:
    name: libxc
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 7.0.0
              url: https://gitlab.com/libxc/libxc/-/archive/7.0.0/libxc-7.0.0.tar.gz
            - version: 6.2.2
              url: https://gitlab.com/libxc/libxc/-/archive/6.2.2/libxc-6.2.2.tar.gz

    build:
        preprocessing: autoreconf -i
        configurations:
            options:
                - name: use_cuda
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: enable-cuda
                  disabled_format: disable-cuda
                  requires: [cuda]

        stages:
            - target:
            - target: install

    properties:
        lib: ${libxc.prefix}/lib
        libs:
            default: -lxcf90 -lxc
        include: ${libxc.prefix}/include
