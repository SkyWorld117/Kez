---
recipe:
    name: hepmc3
    description: HepMC3 - A C++ event record for Monte Carlo generators
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 3.3.1
              url: https://gitlab.cern.ch/hepmc/HepMC3/-/archive/3.3.1/HepMC3-3.3.1.tar.gz

    build:
        postprocessing: |-
            mkdir -p ${hepmc3.prefix}/lib
            cp -rsf ${hepmc3.prefix}/lib64/* ${hepmc3.prefix}/lib/
        configurations:
            options:
                - name: HEPMC3_ENABLE_ROOTIO
                  description: Enable ROOT I/O support
                  enabled_value:
                      default: OFF

                - name: HEPMC3_ENABLE_PROTOBUF
                  description: Enable Protobuf support
                  enabled_value:
                      default: OFF

                - name: HEPMC3_ENABLE_PYTHON
                  description: Enable Python bindings
                  enabled_value:
                      default: OFF

        stages:
            - target:
            - target: install

    properties:
        lib: ${hepmc3.prefix}/lib
        libs:
            default: -lhepmc3
        include: ${hepmc3.prefix}/include
