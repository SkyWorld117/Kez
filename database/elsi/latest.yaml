---
recipe:
    name: elsi
    description: ELSI - EigenvaLue SIver (unified interface for eigensolvers)
    type: package
    toolchain: cmake

    source:
        type: tarball
        releases:
            - version: 2.12.0
              url: https://gitlab.com/elsi_project/elsi_interface/-/archive/v2.12.0/elsi_interface-v2.12.0.tar.gz

    dependencies:
        - mpi
        - lapack
        - scalapack
        - elpa

    build:
        configurations:
            options:
                - name: elpa
                  description: Use external ELPA library
                  user_configurable: true
                  enabled:
                      default: false
                  enabled_format: USE_EXTERNAL_ELPA=ON
                  disabled_format: USE_EXTERNAL_ELPA=OFF

                - name: INC_PATHS
                  enabled:
                      conditions:
                          - condition: ${elsi.config.elpa} true
                            value: true
                          - condition: ${elsi.config.elpa} false
                            value: false
                  enabled_value:
                      default: ${elpa.modules_dir}

                - name: LIB_PATHS
                  enabled:
                      conditions:
                          - condition: ${elsi.config.elpa} true
                            value: true
                          - condition: ${elsi.config.elpa} false
                            value: false
                  enabled_value:
                      default: ${elpa.prefix}/lib

                - name: LIBS
                  enabled:
                      conditions:
                          - condition: ${elsi.config.elpa} true
                            value: true
                          - condition: ${elsi.config.elpa} false
                            value: false
                  enabled_value:
                      default: ${elpa.libs}

        stages:
            - target:
            - target: install

    properties:
        lib: ${elsi.prefix}/lib
        libs:
            default: -lelsi
        include: ${elsi.prefix}/include
