---
recipe:
    name: gklib
    description: A library of various helper routines and frameworks used by many of the lab's software
    type: package
    toolchain: make

    source:
        type: git
        url: https://github.com/KarypisLab/GKlib
        releases:
            - version: master
              tag: master

    build:
        # Both the static and shared libraries are built and installed. METIS
        # 5.2.1 only looks for GKlib under the gklib prefix's lib/ directory, so
        # both are mirrored there from lib64/.
        stages:
            - target: config
              configurations:
                  options:
                      - name: prefix
                        description: Installation prefix
                        enabled_value:
                            default: ${gklib.prefix}

            - target: install

            - target: config
              configurations:
                  options:
                      - name: prefix
                        description: Installation prefix
                        enabled_value:
                            default: ${gklib.prefix}

                      - name: shared
                        description: Build shared library
                        enabled_value:
                            default: '1'

            - target: install

        postprocessing: |-
            mkdir -p ${gklib.prefix}/lib
            cp ${gklib.prefix}/lib64/libGKlib.a ${gklib.prefix}/lib/
            cp ${gklib.prefix}/lib64/libGKlib.so* ${gklib.prefix}/lib/

    properties:
        lib: ${gklib.prefix}/lib
        libs:
            default: -lGKlib
        include: ${gklib.prefix}/include
