---
recipe:
    name: zstd
    description: Zstandard compression library
    type: system
    toolchain: make

    source:
        type: tarball
        releases:
            - version: 1.5.7
              url: https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz

    dependencies:
        - zlib
        - xz
        - lz4

    build:
        stages:
            - target:
              configurations:
                  environment:
                      - name: CC
                        description: C compiler
                        default: ${compiler.c}

                      - name: CXX
                        description: C++ compiler
                        default: ${compiler.cxx}

                      - name: CFLAGS
                        description: C compiler flags
                        user_configurable: true
                        default: -O3 ${zlib.includes} ${lz4.includes} ${xz.includes}

                      - name: CXXFLAGS
                        description: C++ compiler flags
                        user_configurable: true
                        default: -O3 ${zlib.includes} ${lz4.includes} ${xz.includes}

                      - name: LDFLAGS
                        description: Linker flags
                        user_configurable: true
                        default: ${zlib.ldflags} ${lz4.ldflags} ${xz.ldflags}
                  options:
                      - name: HAVE_ZLIB
                        description: Enable zlib support
                        enabled_value:
                            default: 1

                      - name: HAVE_LZ4
                        description: Enable LZ4 support
                        enabled_value:
                            default: 1

                      - name: HAVE_LZMA
                        description: Enable LZMA support
                        enabled_value:
                            default: 1
            - target: install
              configurations:
                  options:
                      - name: PREFIX
                        description: Installation prefix
                        enabled_value:
                            default: ${zstd.prefix}

    properties:
        lib: ${zstd.prefix}/lib
        include: ${zstd.prefix}/include
        libs:
            default: -lzstd
