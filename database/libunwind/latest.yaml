---
recipe:
    name: libunwind
    description: libunwind is a C API for determining the current call chain of ELF program threads of execution
    type: package
    toolchain: autotools

    source:
        type: tarball
        releases:
            - version: 1.8.3
              url: https://github.com/libunwind/libunwind/releases/download/v1.8.3/libunwind-1.8.3.tar.gz

    build:
        configurations: {}
        stages:
            - target:
            - target: install

    properties:
        lib: ${libunwind.prefix}/lib
        libs:
            default: -lunwind
        include: ${libunwind.prefix}/include
