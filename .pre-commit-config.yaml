---
repos:
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v22.1.5
      hooks:
          - id: clang-format
            args: [-i]   # -i means "in-place edit" (auto-fix)
            types_or: [c++, c, cuda]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.1 # or other specific tag
      hooks:
          - id: yamlfmt
