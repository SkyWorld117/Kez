---
kez:
    spuma:
        description: A minimally invasive approach to the GPU porting of OPENFOAM
        version: master
        compiler: system
        build:
            configurations:
                environment:
                    - name: NVARCH
                      description: CUDA compute capability for OpenFOAM GPU kernels
                      value: 90
                    - name: WM_PRECISION_OPTION
                      description: Precision option for OpenFOAM [DP | SP | SPDP]
                      value: DP
                    - name: WM_LABEL_SIZE
                      description: Label size for OpenFOAM [32 | 64]
                      value: 32
                    - name: WM_COMPILE_OPTION
                      description: Compile option for OpenFOAM [Opt | Dbg | Debug | Prof]
                      value: Opt
                    - name: FOAM_EXTRA_CFLAGS
                      description: Extra compiler flags for OpenFOAM to bake RPATH
                      value: ${spuma.nvldflags} ${gmp.includes} ${gmp.nvldflags} ${gmp.libs} ${mpfr.nvldflags} ${mpfr.libs} ${cuda.nvldflags}
                    - name: FOAM_EXTRA_CXXFLAGS
                      description: Extra C++ compiler flags for OpenFOAM to bake RPATH
                      value: ${spuma.nvldflags} ${gmp.includes} ${gmp.nvldflags} ${gmp.libs} ${mpfr.nvldflags} ${mpfr.libs} ${cuda.nvldflags}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
    boost:
        description: Boost C++ Libraries
        version: 1.89.0
        compiler: system
        build:
            configurations:
                options:
                    - name: cxxflags
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
recipe:
    abstract_packages: {}
    dependencies:
        - spuma
        - openmpi
        - mpfr
        - gmp
        - cuda
        - boost
    targets:
        - spuma
