---
kez:
    fio:
        description: Flexible I/O tester
        version: isc26
        compiler: system
        build:
            configurations:
                options:
                    - name: extra-cflags
                      description: C Flags
                      enabled: true
                      enabled_value: ${libaio.includes}
                    - name: prefix
                      enabled: true
                      enabled_value: ${fio.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${libaio.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${libaio.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${libaio.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${libaio.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${libaio.ldflags}
    libaio:
        description: The Linux-native asynchronous I/O facility
        version: master
        compiler: system
recipe:
    abstract_packages: {}
    dependencies:
        - fio
        - libaio
    targets:
        - fio
