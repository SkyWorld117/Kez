---
kez:
    ascot5:
        description: Simulation tool used in fusion energy science and engineering
        version: main
        compiler: system
        build:
            stages:
                - target: ascot5_main
                  configurations:
                      options:
                          - name: MPI
                            description: Toggle MPI
                            enabled: false
                            enabled_value: 1
                            requires:
                                - mpi
                          - name: OMP
                            description: Toggle OpenMP
                            enabled: false
                            enabled_value: 1
                          - name: ACC
                            description: Toggle OpenACC
                            enabled: false
                            enabled_value: 1
                          - name: NSIMD
                            description: SIMD vector length used for CPU vectorization
                            enabled: false
                            enabled_value: 8
                          - name: FLAGS
                            description: C flags
                            enabled: true
                            enabled_value: -O3
                - target: libascot
                  configurations:
                      options:
                          - name: MPI
                            description: Toggle MPI
                            enabled: false
                            enabled_value: 1
                            requires:
                                - mpi
                          - name: OMP
                            description: Toggle OpenMP
                            enabled: false
                            enabled_value: 1
                          - name: ACC
                            description: Toggle OpenACC
                            enabled: false
                            enabled_value: 1
                          - name: NSIMD
                            description: SIMD vector length used for CPU vectorization
                            enabled: false
                            enabled_value: 8
                          - name: FLAGS
                            description: C flags
                            enabled: true
                            enabled_value: -O3
    hdf5:
        description: High-performance data management and storage suite
        version: 1.10.11
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-cxx
                      description: Compile the C++ interface
                      enabled: false
                      enabled_value:
                    - name: enable-fortran
                      description: Compile the Fortran interface
                      enabled: false
                      enabled_value:
                    - name: enable-parallel
                      description: Search for MPI-IO and MPI support
                      enabled: true
                      enabled_value:
                      requires:
                          - mpi
                    - name: prefix
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - ascot5
        - hdf5
        - openmpi
    targets:
        - ascot5
