                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${root.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${root.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${root.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
            # A bug makes it only possible to set one single path for the build rpath
            # Maybe one can also just simply disable this option
                      enabled_value: ${root.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${root.lib}
    geant4:
        description: Geant4 - A toolkit for the simulation of the passage of particles through matter
        version: 11.3.2
        compiler: system
        build:
