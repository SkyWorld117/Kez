                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${sio.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${sio.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
