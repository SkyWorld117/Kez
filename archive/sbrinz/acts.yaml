                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${sio.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${sio.lib}
    lcio:
        description: Linear Collider I/O - persistency framework for HEP and HEP-like applications
        version: 02-23
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
