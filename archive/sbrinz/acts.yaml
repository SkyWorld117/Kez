recipe:
    abstract_packages: {}
    dependencies:
        - acts
        - intel-oneapi-mkl
        - eigen
        - json
        - pythia
        - dd4hep
        - intel-oneapi-tbb
        - intel-oneapi
        - sio
        - lcio
        - root
        - geant4
        - hepmc3
        - xerces-c
        - boost
    targets:
        - acts
