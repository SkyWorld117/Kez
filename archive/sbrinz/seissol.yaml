---
kez:
    seissol:
        description: "SeisSol - an open-source numerical solver for wave propagation and dynamic rupture in earthquakes. Uses the ADER-DG method with high-order
            derivative time stepping on unstructured tetrahedral meshes, CPU and GPU (CUDA/HIP/SYCL) backends.\n"
        version: 1.3.2
        compiler: system
        patches:
            - name: fix-gemmforge-cmake-prefix.patch
              enabled: true
            - name: fix-sycl-device-compile-1.3.2.patch
              enabled: true
        build:
            configurations:
                environment:
                    - name: PATH
                      description: Add the AdaptiveCpp, clang (LLVM) and CUDA toolkit binaries to PATH
                      default: ${adaptivecpp.prefix}/bin:${llvm.prefix}/bin:${cuda.prefix}/bin:$PATH
                options:
                    - name: DEVICE_BACKEND
                      description: Compute device backend (none, cuda, hip, oneapi, acpp)
                      enabled: true
                      enabled_value: cuda
                    - name: DEVICE_ARCH
                      description: Device architecture for CUDA, e.g. sm_80 (valid only with a GPU backend)
                      enabled: true
                      enabled_value: sm_90
                    - name: CMAKE_CUDA_COMPILER
                      description: nvcc to use for the CUDA device code
                      enabled: true
                      enabled_value: ${cuda.prefix}/bin/nvcc
                      requires:
                          - cuda
                    - name: ASAGI
                      description: Enable ASAGI interface look-ups (requires easi built with ASAGI)
                      enabled: true
                      enabled_value: OFF
                    - name: USE_GRAPH_CAPTURING
                      description: Use CUDA graph capturing on supported GPUs
                      enabled: true
                      enabled_value: OFF
                    - name: HOST_ARCH
                      description: "Host CPU microarchitecture from SeisSol's list (noarch;wsm;snb;hsw;knc;knl;skx;naples;rome;milan;bergamo; thunderx2t99;power9;a64fx;neon;apple-m1;apple-m2).
                          \"native\" is NOT accepted upstream; noarch is the portable default.\n"
                      enabled: true
                      enabled_value: skx
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${seissol.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${hdf5.incflags} ${eigen.incflags} ${easi.incflags} 
                          ${metis.incflags} ${parmetis.incflags} ${cuda.incflags} ${netcdf.incflags} ${numactl.incflags} ${gemmforge.incflags} 
                          ${adaptivecpp.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${hdf5.incflags} ${eigen.incflags} ${easi.incflags} 
                          ${metis.incflags} ${parmetis.incflags} ${cuda.incflags} ${netcdf.incflags} ${numactl.incflags} ${gemmforge.incflags} 
                          ${adaptivecpp.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${hdf5.incflags} ${eigen.incflags} ${easi.incflags} 
                          ${metis.incflags} ${parmetis.incflags} ${cuda.incflags} ${netcdf.incflags} ${numactl.incflags} ${gemmforge.incflags} 
                          ${adaptivecpp.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${hdf5.incflags} ${eigen.incflags} ${easi.incflags} ${metis.incflags} 
                          ${parmetis.incflags} ${cuda.incflags} ${netcdf.incflags} ${numactl.incflags} ${gemmforge.incflags} ${adaptivecpp.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${easi.ldflags} ${metis.ldflags} ${parmetis.ldflags} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${cuda.ldflags} ${netcdf.ldflags} ${numactl.ldflags} 
                          ${gemmforge.ldflags} ${seissol.ldflags} ${mpi.libs} ${hdf5.libs} ${easi.libs} ${metis.libs} ${parmetis.libs} ${cuda.libs} 
                          ${netcdf.libs} ${numactl.libs} ${gklib.ldflags} ${adaptivecpp.ldflags} -L${llvm.prefix}/lib/x86_64-unknown-linux-gnu 
                          -Wl,-rpath,${llvm.prefix}/lib/x86_64-unknown-linux-gnu -lomp
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${easi.ldflags} ${metis.ldflags} ${parmetis.ldflags} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${cuda.ldflags} ${netcdf.ldflags} ${numactl.ldflags} 
                          ${gemmforge.ldflags} ${seissol.ldflags} ${mpi.libs} ${hdf5.libs} ${easi.libs} ${metis.libs} ${parmetis.libs} ${cuda.libs} 
                          ${netcdf.libs} ${numactl.libs} ${gklib.ldflags} ${adaptivecpp.ldflags} -L${llvm.prefix}/lib/x86_64-unknown-linux-gnu 
                          -Wl,-rpath,${llvm.prefix}/lib/x86_64-unknown-linux-gnu -lomp
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${easi.ldflags} ${metis.ldflags} ${parmetis.ldflags} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${cuda.ldflags} ${netcdf.ldflags} ${numactl.ldflags} 
                          ${gemmforge.ldflags} ${seissol.ldflags} ${mpi.libs} ${hdf5.libs} ${easi.libs} ${metis.libs} ${parmetis.libs} ${cuda.libs} 
                          ${netcdf.libs} ${numactl.libs} ${gklib.ldflags} ${adaptivecpp.ldflags} -L${llvm.prefix}/lib/x86_64-unknown-linux-gnu 
                          -Wl,-rpath,${llvm.prefix}/lib/x86_64-unknown-linux-gnu -lomp
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: 
                          ${compiler.lib};${mpi.lib};${hdf5.lib};${easi.lib};${metis.lib};${parmetis.lib};${cuda.lib};${netcdf.lib};${numactl.lib};${gemmforge.lib};${adaptivecpp.lib};${seissol.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: 
                          ${compiler.lib};${mpi.lib};${hdf5.lib};${easi.lib};${metis.lib};${parmetis.lib};${cuda.lib};${netcdf.lib};${numactl.lib};${gemmforge.lib};${adaptivecpp.lib};${seissol.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: 
                          ${mpi.prefix};${hdf5.prefix};${eigen.prefix};${easi.prefix};${metis.prefix};${parmetis.prefix};${cuda.prefix};${netcdf.prefix};${numactl.prefix};${numpy.prefix};${setuptools.prefix};${gemmforge.prefix};${adaptivecpp.prefix}
    setuptools:
        description: "Setuptools - the legacy Python build/packaging library. Pinned to the 80.10.x line because it is the last release that still provides
            the pkg_resources module, which legacy code generators (e.g. yateto used by SeisSol) import at build time; setuptools >80 removed it.\n"
        version: 80.10.2
    parmetis:
        description: ParMETIS is an MPI-based library for partitioning graphs, partitioning finite element meshes, and producing fill reducing 
            orderings for sparse matrices.
        version: main
        compiler: system
        build:
            stages:
                - target: config
                  configurations:
                      options:
                          - name: shared
                            description: Build shared library
                            enabled: true
                            enabled_value: 1
    numactl:
        description: NUMA support for Linux
        version: 2.0.19
        compiler: system
        build:
            configurations:
                options:
                    - name: prefix
                      enabled: true
                      enabled_value: ${numactl.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${numactl.ldflags}
    netcdf:
        description: An abstract package for merging netcdf-c and netcdf-fortran into a single package.
        compiler: system
    netcdf-fortran:
        description: Unidata netCDF Fortran library, providing the Fortran 77/90 APIs on top of the netCDF-C library
        version: 4.6.4
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-fortran.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${netcdf-c.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${netcdf-c.ldflags} ${netcdf-fortran.ldflags}
    netcdf-c:
        description: Unidata netCDF C library, a self-describing, portable, array-oriented set of software libraries and data formats for scientific 
            data, with the netCDF-4/HDF5 backend enabled
        version: 4.10.1
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries, required for --enable-plugins dynamic filter loading
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: enable-pnetcdf
                      description: Enable parallel netCDF (pnetCDF) support
                      enabled: false
                      enabled_value:
                    - name: with-default-chunk-size
                      description: Default chunk size in bytes for netCDF-4 variables
                      enabled: true
                      enabled_value: 4194304
                    - name: with-default-chunk-cache-size
                      description: Default per-variable chunk cache size in bytes, raised above the upstream default for large HPC datasets
                      enabled: true
                      enabled_value: 134217728
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-c.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} ${mpi.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${hdf5.ldflags} ${zlib.ldflags} ${zstd.ldflags} ${bzip2.ldflags} ${mpi.ldflags} 
                          ${netcdf-c.ldflags}
    metis:
        description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing 
            orderings for sparse matrices.
        version: 5.2.1
        compiler: system
        build:
            configurations:
                options:
                    - name: OPENMP
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value: 1
                    - name: SHARED
                      description: Build shared library
                      enabled: true
                      enabled_value: 1
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${metis.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${gklib.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${gklib.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${gklib.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${gklib.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${gklib.ldflags} ${metis.ldflags} ${gklib.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${gklib.ldflags} ${metis.ldflags} ${gklib.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${gklib.ldflags} ${metis.ldflags} ${gklib.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${gklib.lib};${metis.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${gklib.lib};${metis.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${gklib.prefix}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN
                      description: Build Fortran library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: HDF5_ENABLE_ZLIB_SUPPORT
                      description: Enable Zlib (deflate) compression filters
                      enabled: true
                      enabled_value: ON
                      requires:
                          - zlib
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix};${zlib.prefix}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    gklib:
        description: A library of various helper routines and frameworks used by many of the lab's software
        version: master
        compiler: system
    gemmforge:
        description: "gemmforge - SeisSol's GPU GEMM / tensor-contraction code generator. A pure-Python package (SeisSol requires >= 0.0.207) that is not
            published on PyPI at the required versions, so it is fetched from its Git repository and uv-installed into the environment's Python venv. SeisSol's
            GPU build discovers it via `python3 -c \"import gemmforge; gemmforge.print_cmake_path()\"` and `find_package(GemmForge 0.0.207 REQUIRED)`.\n"
        version: 0.0.208
        compiler: system
    adaptivecpp:
        description: "AdaptiveCpp (formerly hipSYCL / Open SYCL) - an independent SYCL implementation with multiple backends. SeisSol 1.3.x compiles its
            general SYCL offloading library (GPU dynamic rupture, streams, ...) with AdaptiveCpp targeting CUDA (ACPP_TARGETS=cuda:sm_90) even when the
            main device backend is CUDA, so this package provides the acpp compiler driver and its clang-based CUDA backend, built against the clang (LLVM
            20, NVPTX) and CUDA 12.9 tools.\n"
        version: 25.10.0
        compiler: system
        build:
            configurations:
                environment:
                    - name: PATH
                      description: Add the clang and CUDA toolkit binaries to PATH
                      default: ${llvm.prefix}/bin:${cuda.prefix}/bin:$PATH
                options:
                    - name: ACPP_COMPILER_FEATURE_PROFILE
                      description: "AdaptiveCpp compiler feature level. 'minimal' keeps the classic --acpp-targets=cuda/hip interop flows that SeisSol uses
                          while dropping the generic-JIT/stdpar/accelerated-CPU features; these require a libLLVM.so monolith that the official LLVM binary
                          distribution does not ship.\n"
                      enabled: true
                      enabled_value: minimal
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${adaptivecpp.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${llvm.incflags} ${cuda.incflags} ${python.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${llvm.incflags} ${cuda.incflags} ${python.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${llvm.incflags} ${cuda.incflags} ${python.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${llvm.incflags} ${cuda.incflags} ${python.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags} ${cuda.ldflags} ${python.ldflags} ${adaptivecpp.ldflags} ${cuda.libs} 
                          ${python.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags} ${cuda.ldflags} ${python.ldflags} ${adaptivecpp.ldflags} ${cuda.libs} 
                          ${python.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags} ${cuda.ldflags} ${python.ldflags} ${adaptivecpp.ldflags} ${cuda.libs} 
                          ${python.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${llvm.lib};${cuda.lib};${python.lib};${adaptivecpp.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${llvm.lib};${cuda.lib};${python.lib};${adaptivecpp.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${llvm.prefix};${cuda.prefix};${python.prefix}
    llvm:
        description: "Source-built LLVM 20.1.8 with Clang, LLD, flang and the NVPTX backend, providing the shared libLLVM.so that AdaptiveCpp's clang plugin
            needs to load (the official prebuilt LLVM binaries lack libLLVM.so and break the plugin).\n"
        version: 20.1.8
        compiler: system
        build:
            configurations:
                options:
                    - name: LLVM_TARGETS_TO_BUILD
                      description: "Target backends compiled into clang. NVPTX is mandatory for AdaptiveCpp to compile SYCL kernels to NVIDIA GPUs; add
                          the host target (X86 or AArch64) matching the machine.\n"
                      enabled: true
                      enabled_value: ${kez.arch.llvm};NVPTX
                    - name: LLVM_PARALLEL_LINK_JOBS
                      description: Cap parallel link jobs (each LLVM link uses a few GB of RSS)
                      enabled: true
                      enabled_value: ${KEZ_NPROC}
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${llvm.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${llvm.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${llvm.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${llvm.lib}
    numpy:
        description: Fundamental package for scientific computing with Python
        version: 2.4.6
    python:
        description: Python Programming Language
        version: 3.14.6
        compiler: system
        build:
