---
kez:
    paraview:
        description: "ParaView - an open-source, multi-platform data analysis and visualization application from Kitware. This recipe builds the headless
            client-server suite (pvserver, pvbatch, pvpython) for HPC: users render from their local ParaView GUI client and connect to pvserver launched
            on compute nodes.\n"
        version: 6.1.1
        compiler: system
        build:
            configurations:
                # OpenMPI's mpicc wrapper appends OMPI_LDFLAGS verbatim to its
                # link line; pointing it at the MPI's bundled PMIx/PRRTE keeps
                # CMake's FindMPI try-compile and the final links self-contained
                # (needed when the MPI bundles PMIx outside the default paths).
                environment:
                    - name: OMPI_LDFLAGS
                      description: Extra linker dirs/libs for the wrapped OpenMPI (its bundled PMIx/PRRTE)
                      value: -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -lpmix -lprrte
                options:
                    - name: PARAVIEW_USE_QT
                      description: Build the Qt GUI (off for headless HPC server builds)
                      enabled: true
                      enabled_value: OFF
                    - name: PARAVIEW_USE_EGL
                      description: Enable EGL offscreen rendering for GPU compute nodes without a display
                      enabled: true
                      enabled_value: OFF
                    - name: PARAVIEW_USE_OSMESA
                      description: Enable OSMesa software offscreen rendering (CPU-only fallback)
                      enabled: true
                      enabled_value: OFF
                    - name: PARAVIEW_USE_CUDA
                      # GPU rendering build. ParaView 6.1's bundled VTK-m is
                      # incompatible with the CUDA 13 thrust API
                      # (thrust::pair/distance moved), so the CUDA toolkit is
                      # pinned to 12.9 (cuda.version below), whose thrust is
                      # compatible with VTK-m.
                      description: Enable CUDA-based GPU compute rendering (VisKores/VTK-m device adapter)
                      enabled: true
                      enabled_value: ON
                      requires:
                          - cuda
                    - name: CMAKE_CUDA_ARCHITECTURES
                      description: CUDA architecture to target (e.g. 80 for Ampere, 90 for Hopper)
                      enabled: true
                      enabled_value: 90
                      requires:
                          - cuda

                    - name: CMAKE_CUDA_COMPILER
                      description: nvcc to use for the CUDA device code (pinned toolkit)
                      enabled: true
                      enabled_value: ${cuda.prefix}/bin/nvcc
                      requires:
                          - cuda

                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${paraview.prefix}
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${python.incflags} ${cuda.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${python.incflags} ${cuda.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${python.incflags} ${cuda.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${python.incflags} ${cuda.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${python.ldflags} ${cuda.ldflags} ${paraview.ldflags} ${mpi.libs} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${python.libs} ${cuda.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${python.ldflags} ${cuda.ldflags} ${paraview.ldflags} ${mpi.libs} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${python.libs} ${cuda.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${python.ldflags} ${cuda.ldflags} ${paraview.ldflags} ${mpi.libs} 
                          -L${mpi.prefix}/../pmix/lib -L${mpi.prefix}/../prrte/lib -Wl,-rpath,${mpi.prefix}/../pmix/lib 
                          -Wl,-rpath,${mpi.prefix}/../prrte/lib -lpmix -lprrte ${python.libs} ${cuda.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${python.lib};${cuda.lib};${paraview.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${python.lib};${cuda.lib};${paraview.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix};${python.prefix};${cuda.prefix}
    python:
        description: Python Programming Language
        version: 3.14.6
        compiler: system
        build:
            configurations:
                options:
                    - name: prefix
                      enabled: true
                      enabled_value: ${python.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${python.ldflags}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    cuda:
        description: NVIDIA CUDA Toolkit
        # Pinned to 12.9: ParaView 6.1's VTK-m does not compile against the
        # CUDA 13 thrust API.
        version: 12.9
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - paraview
        - python
        - openmpi
        - cuda
    targets:
        - paraview
