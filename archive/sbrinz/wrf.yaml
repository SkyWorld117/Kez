---
kez:
    wrf:
        description: Weather Research and Forecasting Model, a next-generation mesoscale numerical weather prediction system
        version: 4.8.0
        compiler: system
        build:
            configurations:
                options:
                    - name: WRF_CONFIG_SELECTION
                      description: "Select the appropriate configuration for the build system.\n 1. (serial)   2. (smpar)   3. (dmpar)   4. (dm+sm)   PGI
                          (pgf90/gcc)\n 5. (serial)   6. (smpar)   7. (dmpar)   8. (dm+sm)   PGI (pgf90/pgcc): SGI MPT\n 9. (serial)  10. (smpar)  11. (dmpar)\
                          \  12. (dm+sm)   PGI (pgf90/gcc): PGI accelerator\n13. (serial)  14. (smpar)  15. (dmpar)  16. (dm+sm)   INTEL (ifort/icc)\n \
                          \                                       17. (dm+sm)   INTEL (ifort/icc): Xeon Phi (MIC architecture)\n18. (serial)  19. (smpar)\
                          \  20. (dmpar)  21. (dm+sm)   INTEL (ifort/icc): Xeon (SNB with AVX mods) 22. (serial)  23. (smpar)  24. (dmpar)  25. (dm+sm)\
                          \   INTEL (ifort/icc): SGI MPT 26. (serial)  27. (smpar)  28. (dmpar)  29. (dm+sm)   INTEL (ifort/icc): IBM POE 30. (serial) \
                          \              31. (dmpar)                PATHSCALE (pathf90/pathcc) 32. (serial)  33. (smpar)  34. (dmpar)  35. (dm+sm)   GNU
                          (gfortran/gcc) 36. (serial)  37. (smpar)  38. (dmpar)  39. (dm+sm)   IBM (xlf90_r/cc_r) 40. (serial)  41. (smpar)  42. (dmpar)\
                          \  43. (dm+sm)   PGI (ftn/gcc): Cray XC CLE 44. (serial)  45. (smpar)  46. (dmpar)  47. (dm+sm)   CRAY CCE (ftn $(NOOMP)/cc):
                          Cray XE and XC 48. (serial)  49. (smpar)  50. (dmpar)  51. (dm+sm)   INTEL (ftn/icc): Cray XC 52. (serial)  53. (smpar)  54. (dmpar)\
                          \  55. (dm+sm)   PGI (pgf90/pgcc) 56. (serial)  57. (smpar)  58. (dmpar)  59. (dm+sm)   PGI (pgf90/gcc): -f90=pgf90 60. (serial)\
                          \  61. (smpar)  62. (dmpar)  63. (dm+sm)   PGI (pgf90/pgcc): -f90=pgf90 64. (serial)  65. (smpar)  66. (dmpar)  67. (dm+sm)  \
                          \ INTEL (ifort/icc): HSW/BDW 68. (serial)  69. (smpar)  70. (dmpar)  71. (dm+sm)   INTEL (ifort/icc): KNL MIC 72. (serial)  73.
                          (smpar)  74. (dmpar)  75. (dm+sm)   AMD (flang/clang) :  AMD ZEN1/ ZEN2/ ZEN3 Architectures 76. (serial)  77. (smpar)  78. (dmpar)\
                          \  79. (dm+sm)   INTEL (ifx/icx) : oneAPI LLVM 80. (serial)  81. (smpar)  82. (dmpar)  83. (dm+sm)   FUJITSU (frtpx/fccpx): FX10/FX100
                          SPARC64 IXfx/Xlfx\n"
                      enabled: true
                      enabled_value: 35
                      disabled_value:
                    - name: WRF_NESTING
                      description: Nesting level (0=none, 1=basic, 2=preset moves, 3=vortex following)
                      enabled: true
                      enabled_value: 1
                      disabled_value:
                    - name: WRF_BUILD_TARGET
                      description: "em_real (3d real case)\nem_quarter_ss (3d ideal case)\nem_b_wave (3d ideal case)\nem_les (3d ideal case)\nem_heldsuarez
                          (3d ideal case)\nem_tropical_cyclone (3d ideal case)\nem_hill2d_x (2d ideal case)\nem_squall2d_x (2d ideal case)\nem_squall2d_y
                          (2d ideal case)\nem_grav2d_x (2d ideal case)\nem_seabreeze2d_x (2d ideal case)\nem_scm_xy (1d ideal case)"
                      enabled: true
                      enabled_value: em_real
                      disabled_value:
                    - name: WRF_FCOPTIM
                      description: "Fortran optimization flags for the model.  Overrides FCOPTIM in configure.wrf.\n"
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                      disabled_value:
                    - name: WRF_FCNOOPT
                      description: "Fortran no-optimization flags.  WRF compiles a curated list of I/O, registry and restart routines (arch/noopt_exceptions)
                          with these flags precisely because they do not optimize reliably; raising them miscompiles the model and has hung runs at the
                          restart write.  Keep at the stanza default (-O0) unless you know what you are doing.\n"
                      enabled: true
                      enabled_value: -O0
                      disabled_value:
                    - name: WRF_FCREDUCEDOPT
                      description: "Fortran reduced optimization flags (used for the RUC land surface, module_sf_ruclsm.F).  Overrides FCREDUCEDOPT in configure.wrf,
                          whose stanza default tracks FCOPTIM.\n"
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                      disabled_value:
                    - name: WRF_CFLAGS_LOCAL
                      description: "Extra C compiler flags.  Appended to CFLAGS_LOCAL in configure.wrf, preserving stanza flags like -c and -w that are
                          required for correct compilation.\n"
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                      disabled_value:
    pnetcdf:
        description: Parallel netCDF is a parallel I/O library that provides a simple interface for writing and reading scientific data
        version: 1.15.1
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-cxx
                      description: Enable C++ interface
                      enabled: true
                      enabled_value:
                    - name: enable-fortran
                      description: Enable Fortran interface
                      enabled: true
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${pnetcdf.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${pnetcdf.ldflags}
    netcdf:
        description: An abstract package for merging netcdf-c and netcdf-fortran into a single package.
        compiler: system
    netcdf-fortran:
        description: Unidata netCDF Fortran library, providing the Fortran 77/90 APIs on top of the netCDF-C library
        version: 4.6.4
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-fortran.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${netcdf-c.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${netcdf-c.ldflags} ${netcdf-fortran.ldflags}
    netcdf-c:
        description: Unidata netCDF C library, a self-describing, portable, array-oriented set of software libraries and data formats for scientific 
            data, with the netCDF-4/HDF5 backend enabled
        version: 4.10.1
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries, required for --enable-plugins dynamic filter loading
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: enable-pnetcdf
                      description: Enable parallel netCDF (pnetCDF) support
                      enabled: false
                      enabled_value:
                    - name: with-default-chunk-size
                      description: Default chunk size in bytes for netCDF-4 variables
                      enabled: true
                      enabled_value: 4194304
                    - name: with-default-chunk-cache-size
                      description: Default per-variable chunk cache size in bytes, raised above the upstream default for large HPC datasets
                      enabled: true
                      enabled_value: 134217728
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-c.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} ${mpi.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${hdf5.ldflags} ${zlib.ldflags} ${zstd.ldflags} ${bzip2.ldflags} ${mpi.ldflags} 
                          ${netcdf-c.ldflags}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN
                      description: Build Fortran library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: HDF5_ENABLE_ZLIB_SUPPORT
                      description: Enable Zlib (deflate) compression filters
                      enabled: true
                      enabled_value: ON
                      requires:
                          - zlib
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix};${zlib.prefix}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    bzip2:
        description: A high-quality data compressor
        version: 1.0.8
        compiler: system
        build:
            stages:
                - target: -f Makefile-libbz2_so
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
                - target:
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - wrf
        - pnetcdf
        - netcdf
        - netcdf-fortran
        - netcdf-c
        - zstd
        - hdf5
        - zlib
        - openmpi
        - bzip2
    targets:
        - wrf
