                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes} ${ucx.includes} ${bzip2.includes} ${zfp.includes} ${sz3.includes} 
                          ${mgard.includes} ${libpng.includes} ${c-blosc2.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes} ${ucx.includes} ${bzip2.includes} ${zfp.includes} ${sz3.includes} 
                          ${mgard.includes} ${libpng.includes} ${c-blosc2.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes} ${ucx.includes} ${bzip2.includes} ${zfp.includes} ${sz3.includes} 
                          ${mgard.includes} ${libpng.includes} ${c-blosc2.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes} ${ucx.includes} ${bzip2.includes} ${zfp.includes} ${sz3.includes} 
                          ${mgard.includes} ${libpng.includes} ${c-blosc2.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${ucx.ldflags} ${bzip2.ldflags} ${zfp.ldflags} ${sz3.ldflags} 
                          ${mgard.ldflags} ${libpng.ldflags} ${c-blosc2.ldflags} ${mpi.libs} ${hdf5.libs} ${ucx.libs} ${bzip2.libs} ${zfp.libs} 
                          ${sz3.libs} ${mgard.libs} ${libpng.libs} ${c-blosc2.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${ucx.ldflags} ${bzip2.ldflags} ${zfp.ldflags} ${sz3.ldflags} 
                          ${mgard.ldflags} ${libpng.ldflags} ${c-blosc2.ldflags} ${mpi.libs} ${hdf5.libs} ${ucx.libs} ${bzip2.libs} ${zfp.libs} 
                          ${sz3.libs} ${mgard.libs} ${libpng.libs} ${c-blosc2.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${ucx.ldflags} ${bzip2.ldflags} ${zfp.ldflags} ${sz3.ldflags} 
                          ${mgard.ldflags} ${libpng.ldflags} ${c-blosc2.ldflags} ${mpi.libs} ${hdf5.libs} ${ucx.libs} ${bzip2.libs} ${zfp.libs} 
                          ${sz3.libs} ${mgard.libs} ${libpng.libs} ${c-blosc2.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: 
                          ${compiler.lib};${mpi.lib};${hdf5.lib};${ucx.lib};${bzip2.lib};${zfp.lib};${sz3.lib};${mgard.lib};${libpng.lib};${c-blosc2.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: 
                          ${compiler.lib};${mpi.lib};${hdf5.lib};${ucx.lib};${bzip2.lib};${zfp.lib};${sz3.lib};${mgard.lib};${libpng.lib};${c-blosc2.lib}
