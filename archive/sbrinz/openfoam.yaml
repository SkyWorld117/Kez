---
kez:
    openfoam:
        description: OpenFOAM is a free, open source CFD software package.
        version: 2412
        compiler: system
        build:
            configurations:
                environment:
                    - name: WM_COMPILER
                      description: Compiler for OpenFOAM
                      value: Gcc
                    - name: WM_PRECISION_OPTION
                      description: Precision option for OpenFOAM [DP | SP | SPDP]
                      value: DP
                    - name: WM_LABEL_SIZE
                      description: Label size for OpenFOAM [32 | 64]
                      value: 64
                    - name: WM_COMPILE_OPTION
                      description: Compile option for OpenFOAM [Opt | Dbg | Debug | Prof]
                      value: Opt
                    - name: FOAM_EXTRA_CFLAGS
                      description: Extra compiler flags for OpenFOAM to bake RPATH
                      value: -O3 ${flex.ldflags} ${openfoam.ldflags} ${gmp.ldflags} ${gmp.libs} ${mpfr.ldflags} ${mpfr.libs}
                    - name: FOAM_EXTRA_CXXFLAGS
                      description: Extra C++ compiler flags for OpenFOAM to bake RPATH
                      value: -O3 ${flex.ldflags} ${openfoam.ldflags} ${gmp.ldflags} ${gmp.libs} ${mpfr.ldflags} ${mpfr.libs}
    scotch:
        description: Scotch is a software package for graph and mesh partitioning, graph clustering, and sparse matrix ordering.
        version: 7.0.11
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${scotch.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${bison.includes} ${flex.includes} ${mpi.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${bison.includes} ${flex.includes} ${mpi.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${bison.includes} ${flex.includes} ${mpi.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${bison.includes} ${flex.includes} ${mpi.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${bison.ldflags} ${flex.ldflags} ${mpi.ldflags} ${bison.libs} ${flex.libs} ${mpi.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${bison.ldflags} ${flex.ldflags} ${mpi.ldflags} ${bison.libs} ${flex.libs} ${mpi.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${bison.ldflags} ${flex.ldflags} ${mpi.ldflags} ${bison.libs} ${flex.libs} ${mpi.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${bison.lib};${flex.lib};${mpi.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${bison.lib};${flex.lib};${mpi.lib}
    kahip:
        description: KaHIP is a Karlsruhe High Quality Partitioning software package.
        version: 3.25
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${kahip.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${metis.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${metis.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${metis.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${metis.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${metis.ldflags} ${mpi.libs} ${metis.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${metis.ldflags} ${mpi.libs} ${metis.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${metis.ldflags} ${mpi.libs} ${metis.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${metis.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${metis.lib}
    metis:
        description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing 
            orderings for sparse matrices.
        version: 5.1.0
        compiler: system
        build:
            configurations:
                options:
                    - name: OPENMP
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value: 1
                    - name: SHARED
                      description: Build shared library
                      enabled: true
                      enabled_value: 1
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${metis.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
    flex:
        description: Fast Lexical Analyzer Generator
        version: 2.6.4
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: prefix
                      enabled: true
                      enabled_value: ${flex.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
    fftw3:
        description: FFTW is a C library for computing the discrete Fourier transform in one or more dimensions, of arbitrary input size, and of both 
            real and complex data.
        version: 3.3.11
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-float
                      description: Build single-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: enable-long-double
                      description: Build long double-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: enable-quad-precision
                      description: Build quad-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: enable-sse
                      description: Build SSE-optimized version of the library [x86_64]
                      enabled: false
                      enabled_value:
                    - name: enable-sse2
                      description: Build SSE/SSE2-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: enable-avx
                      description: Build AVX-optimized version of the library [x86_64]
                      enabled: false
                      enabled_value:
                    - name: enable-avx2
                      description: Build AVX/AVX2-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: enable-avx512
                      description: Build AVX-512-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: enable-avx-128-fma
                      description: Build AVX-128-FMA-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: enable-neon
                      description: Build NEON-optimized version of the library [arm64]
                      enabled: true
                      enabled_value:
                    - name: enable-sve
                      description: Build SVE-optimized version of the library [arm64]
                      enabled: true
                      enabled_value:
                    - name: enable-fma
                      description: Enable FMA if the machine architecture "naturally" prefers it
                      enabled: true
                      enabled_value:
                    - name: enable-mpi
                      description: Enable MPI support
                      enabled: false
                      enabled_value:
                      requires:
                          - mpi
                    - name: enable-openmp
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
                    - name: prefix
                      enabled: true
                      enabled_value: ${fftw3.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags}
    cgal:
        description: CGAL is a software library that provides easy access to efficient and reliable geometric algorithms in the form of a C++ library.
