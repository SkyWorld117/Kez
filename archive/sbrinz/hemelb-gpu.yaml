---
kez:
    hemelb-gpu:
        description: HemePure-GPU LBM blood flow solver (UCL-CCS) with CUDA backend
        version: default
        compiler: system
        patches:
            - name: openmp_init.patch
              enabled: true
            - name: no_write_globalmem.patch
              enabled: true
            - name: no_cuda_debug.patch
              enabled: true
            - name: fast_kernel.patch
              enabled: true
            - name: enable_d3q15_fast.patch
              enabled: false
            - name: no_properties.patch
              enabled: true
        build:
            configurations:
                options:
                    - name: HEMELB_GPU_BACKEND
                      description: GPU backend (CUDA / HIP_CUDA / HIP_ROCM)
                      enabled: true
                      enabled_value: CUDA
                    - name: CMAKE_CUDA_ARCHITECTURES
                      description: CUDA compute capability (90 = H100, 80 = A100, 70 = V100)
                      enabled: true
                      enabled_value: 90
                    - name: HEMELB_CUDA_AWARE_MPI
                      description: Enable CUDA-aware MPI (requires CUDA-aware OpenMPI)
                      enabled: true
                      enabled_value: ON
                    - name: HEMELB_USE_MPI_PARALLEL_IO
                      description: Use MPI parallel I/O for reading geometry files
                      enabled: true
                      enabled_value: ON
                    - name: HEMELB_USE_VELOCITY_WEIGHTS_FILE
                      description: 'Inlet BC mode: OFF = pressure-pressure, ON = velocity-pressure'
                      enabled: true
                      enabled_value: OFF
                    - name: HEMELB_LATTICE
                      description: Lattice type [D3Q15, D3Q19, D3Q27]
                      enabled: true
                      enabled_value: D3Q19
                    - name: HEMELB_INLET_BOUNDARY
                      description: Inlet boundary condition type
                      enabled: true
                      enabled_value: NASHZEROTHORDERPRESSUREIOLET
                    - name: HEMELB_WALL_INLET_BOUNDARY
                      description: Wall-inlet corner boundary condition
                      enabled: true
                      enabled_value: NASHZEROTHORDERPRESSURESBB
                    - name: HEMELB_OUTLET_BOUNDARY
                      description: Outlet boundary condition type
                      enabled: true
                      enabled_value: NASHZEROTHORDERPRESSUREIOLET
                    - name: HEMELB_WALL_OUTLET_BOUNDARY
                      description: Wall-outlet corner boundary condition
                      enabled: true
                      enabled_value: NASHZEROTHORDERPRESSURESBB
                    - name: HEMELB_USE_MPI_WIN
                      description: MPI window-based communication
                      enabled: true
                      enabled_value: OFF
                    - name: CMAKE_CXX_FLAGS
                      description: Extra C++ flags for nvcc to find MPI headers
                      enabled: true
                      enabled_value: -O3 -std=c++11
                    - name: CMAKE_CUDA_FLAGS
                      description: Extra CUDA flags for nvcc to find MPI headers
                      enabled: true
                      enabled_value: -O3 -I${mpi.prefix}/include -I${hemelb-gpu.prefix}/include/tirpc
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hemelb-gpu.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.incflags} ${cuda.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.incflags} ${cuda.incflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${cuda.ldflags} ${mpi.libs} ${cuda.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${cuda.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${cuda.lib}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - hemelb-gpu
        - openmpi
        - cuda
    targets:
        - hemelb-gpu
