---
kez:
    dftbplus:
        description: DFTB+ - Density Functional Tight Binding molecular dynamics
        version: 25.1
        compiler: system
        patches:
            - name: mix_precision.patch
              enabled: false
        build:
            configurations:
                options:
                    - name: WITH_MPI
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - mpi
                    - name: WITH_OMP
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${dftbplus.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${blas.ldflags} ${lapack.ldflags} ${scalapack.ldflags} ${mpi.libs} 
                          ${blas.libs} ${lapack.libs} ${scalapack.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${scalapack.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${scalapack.lib}
    intel-oneapi-mkl:
        description: Intel oneAPI Math Kernel Library for high-performance math routines
        build:
            configurations:
                options:
                    - name: fortran_format
                      description: Fortran Format [ gf | intel ]
                      enabled: true
                      enabled_value: gf
                    - name: integer_size
                      description: Use ilp64 interface [ lp64 | ilp64 ]
                      enabled: true
                      enabled_value: lp64
                    - name: multithreaded
                      description: Use multithreading
                      enabled: false
                      enabled_value:
                    - name: multithreading_library
                      description: Multithreading library [ gnu | tbb ]
                      enabled: true
                      enabled_value: gnu
                    - name: mpi-family
                      description: Use MPI implementation (OpenMPI or MPICH) [ openmpi | intelmpi ]
                      enabled: true
                      enabled_value: openmpi
    intel-oneapi:
        version: 2026.0.1.27
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
recipe:
    abstract_packages:
        blas: intel-oneapi-mkl
        lapack: intel-oneapi-mkl
        mpi: openmpi
        scalapack: intel-oneapi-mkl
    dependencies:
        - dftbplus
        - intel-oneapi-mkl
        - intel-oneapi
        - openmpi
    targets:
        - dftbplus
