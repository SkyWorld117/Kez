---
kez:
    dftbplus:
        description: DFTB+ - Density Functional Tight Binding molecular dynamics
        version: 25.1
        compiler: gcc@13.4.0
        patches:
            - name: mix_precision.patch
              enabled: false
        build:
            configurations:
                options:
                    - name: WITH_MPI
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - mpi
                    - name: WITH_OMP
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: WITH_ELSI
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - elsi
                    - name: WITH_GPU
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - cuda
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${dftbplus.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${elsi.includes} ${cuda.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${elsi.includes} ${cuda.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${elsi.includes} ${cuda.includes}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${blas.ldflags} ${lapack.ldflags} ${scalapack.ldflags} ${elsi.ldflags} 
                          ${cuda.ldflags} ${dftbplus.ldflags} ${mpi.libs} ${blas.libs} ${lapack.libs} ${scalapack.libs} ${elsi.libs} ${cuda.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${scalapack.lib};${elsi.lib};${cuda.lib};${dftbplus.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${scalapack.lib};${elsi.lib};${cuda.lib};${dftbplus.lib}
    elsi:
        description: ELSI - EigenvaLue SIver (unified interface for eigensolvers)
        version: 2.12.0
        compiler: system
        build:
            configurations:
                options:
                    - name: elpa
                      description: Use external ELPA library
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${elsi.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -fallow-argument-mismatch ${mpi.includes} ${lapack.includes} ${scalapack.includes} ${elpa.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -fallow-argument-mismatch ${mpi.includes} ${lapack.includes} ${scalapack.includes} ${elpa.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -fallow-argument-mismatch ${mpi.includes} ${lapack.includes} ${scalapack.includes} ${elpa.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${lapack.includes} ${scalapack.includes} ${elpa.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${lapack.ldflags} ${scalapack.ldflags} ${elpa.ldflags} ${elsi.ldflags} 
                          ${mpi.libs} ${lapack.libs} ${scalapack.libs} ${elpa.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${lapack.ldflags} ${scalapack.ldflags} ${elpa.ldflags} ${elsi.ldflags} 
                          ${mpi.libs} ${lapack.libs} ${scalapack.libs} ${elpa.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${lapack.ldflags} ${scalapack.ldflags} ${elpa.ldflags} ${elsi.ldflags} 
                          ${mpi.libs} ${lapack.libs} ${scalapack.libs} ${elpa.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${lapack.lib};${scalapack.lib};${elpa.lib};${elsi.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${lapack.lib};${scalapack.lib};${elpa.lib};${elsi.lib}
    elpa:
        description: ELPA - Eigenvalue soLvers for Petaflop Applications (HPC optimized)
        version: 2026.02.001
        compiler: system
        patches:
            - name: sm80.patch
              enabled: false
        build:
            configurations:
                options:
                    - name: mpi
                      description: Enable MPI parallelization
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: openmp
                      description: Enable OpenMP for shared-memory parallelism
                      enabled: false
                      enabled_value:
                      disabled_value:
                    - name: disable-generic-kernels
                      description: Do NOT build generic kernels
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: disable-sse-kernels
                      description: Do NOT build SSE kernels
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: disable-sse-assembly-kernels
                      description: Do NOT build SSE assembly kernels
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: disable-avx-kernels
                      description: Do NOT build AVX kernels (Intel Sandy Bridge+)
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: disable-avx2-kernels
                      description: Do NOT build AVX2 kernels (Intel Haswell+, AMD EPYC snver2+)
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: disable-avx512-kernels
                      description: Do NOT build AVX-512 kernels (Intel Knights Landing+, AMD EPYC 7773X/72F3)
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: enable-nvidia-gpu-kernels
                      description: Build Nvidia GPU kernels (requires CUDA). Set compute capability with --with-NVIDIA-GPU-compute-capability
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - cuda
                    - name: enable-cuda-aware-mpi
                      description: Enable CUDA-aware MPI (experimental)
                      enabled: false
                      enabled_value:
                      disabled_value:
                      requires:
                          - cuda
                    - name: enable-gpu-ccl
                      description: Enable collective communication library (NCCL from NVHPC)
                      enabled: false
                      enabled_value:
                      disabled_value:
                      requires:
                          - cuda
                          - nvhpc
                    - name: with-nccl-path
                      description: Path to NCCL installation directory
                      enabled_value: ${nvhpc.nccl_prefix}
                      requires:
                          - nvhpc
                    - name: with-NVIDIA-GPU-compute-capability
                      description: NVIDIA GPU compute capabilities to build for (comma-separated, e.g. sm_60,sm_80)
                      enabled_value: sm_80
                    - name: enable-nvidia-sm80-gpu-kernels
                      description: Build Nvidia GPU kernels for compute capability 8.0+ (A100, H100, etc.)
                      enabled: true
                      enabled_value:
                      disabled_value:
                      requires:
                          - cuda
                    - name: disable-single-precision
                      description: Build for double precision only
                      enabled: false
                      enabled_value:
                    - name: disable-autotuning
                      description: Disable runtime autotuning
                      enabled: false
                      enabled_value:
                    - name: disable-timings
                      description: Disable internal timing measurements
                      enabled: true
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${elpa.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${cuda.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${cuda.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${cuda.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${scalapack.includes} ${cuda.includes}
    nvhpc:
        version: 26.5
    intel-oneapi-mkl:
        description: Intel oneAPI Math Kernel Library for high-performance math routines
        build:
            configurations:
                options:
                    - name: fortran_format
                      description: Fortran Format [ gf | intel ]
                      enabled: true
                      enabled_value: gf
                    - name: integer_size
                      description: Use ilp64 interface [ lp64 | ilp64 ]
                      enabled: true
                      enabled_value: lp64
                    - name: multithreaded
                      description: Use multithreading
                      enabled: false
                      enabled_value:
                    - name: multithreading_library
                      description: Multithreading library [ gnu | tbb ]
                      enabled: true
                      enabled_value: gnu
                    - name: mpi-family
                      description: Use MPI implementation (OpenMPI or MPICH) [ openmpi | intelmpi ]
                      enabled: true
                      enabled_value: openmpi
    intel-oneapi:
        version: 2026.1.0.192
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: gcc@13.4.0
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
recipe:
    abstract_packages:
        blas: intel-oneapi-mkl
        lapack: intel-oneapi-mkl
        mpi: openmpi
        scalapack: intel-oneapi-mkl
    dependencies:
        - dftbplus
        - elsi
        - elpa
        - nvhpc
        - intel-oneapi-mkl
        - intel-oneapi
        - openmpi
        - cuda
    targets:
        - dftbplus
