---
kez:
    sst-elements:
        description: Structural Simulation Toolkit Elements
        version: scc25
        compiler: system
        build:
            configurations:
                options:
                    - name: with-dramsim3
                      description: Enable DRAMSim3 support
                      enabled: false
                      enabled_value: ${dramsim3.prefix}
                      disabled_value:
                      requires:
                          - dramsim3
                    - name: with-pin
                      description: Enable Intel PIN support
                      enabled: false
                      enabled_value: ${intelpin.prefix}
                      disabled_value:
                      requires:
                          - intelpin
                    - name: with-goblin-hmcsim
                      description: Enable Goblin HMC Sim support
                      enabled: false
                      enabled_value: ${goblinhmcsim.prefix}
                      disabled_value:
                      requires:
                          - goblinhmcsim
                    - name: with-ramulator2
                      description: Enable Ramulator2 support
                      enabled: false
                      enabled_value: ${ramulator2.prefix}
                      disabled_value:
                      requires:
                          - ramulator2
                    - name: prefix
                      enabled: true
                      enabled_value: ${sst-elements.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${sst-core.includes} ${mpi.includes} ${python.includes} ${goblinhmcsim.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${sst-core.includes} ${mpi.includes} ${python.includes} ${goblinhmcsim.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${sst-core.includes} ${mpi.includes} ${python.includes} ${goblinhmcsim.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${sst-core.includes} ${mpi.includes} ${python.includes} ${goblinhmcsim.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${sst-core.ldflags} ${mpi.ldflags} ${python.ldflags} ${dramsim3.ldflags} ${intelpin.ldflags} 
                          ${goblinhmcsim.ldflags}
    sst-core:
        description: Structural Simulation Toolkit Core
        version: scc25
        compiler: system
        build:
            configurations:
                options:
                    - name: with-hdf5
                      description: Use HDF5 statistics format
                      enabled: false
                      enabled_value: ${hdf5.prefix}
                      disabled_value:
                      requires:
                          - hdf5
                    - name: CXXFLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: prefix
                      enabled: true
                      enabled_value: ${sst-core.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes} ${python.includes} ${hdf5.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${python.includes} ${hdf5.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${python.includes} ${hdf5.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${python.ldflags} ${hdf5.ldflags}
    ramulator2:
        description: RAM module simulator
        version: scc25
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${ramulator2.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
    python:
        description: Python Programming Language
        version: 3.13.9
        compiler: system
        build:
            configurations:
                options:
                    - name: prefix
                      enabled: true
                      enabled_value: ${python.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
    intelpin:
        description: Intel PIN
        version: 3.31
    hdf5:
        description: High-performance data management and storage suite
        version: 1.10.11
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-cxx
                      description: Compile the C++ interface
                      enabled: false
                      enabled_value:
                    - name: enable-fortran
                      description: Compile the Fortran interface
                      enabled: false
                      enabled_value:
                    - name: enable-parallel
                      description: Search for MPI-IO and MPI support
                      enabled: true
                      enabled_value:
                      requires:
                          - mpi
                    - name: prefix
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    goblinhmcsim:
        description: Goblin HMC Sim
        version: sst-8.0.0
        compiler: system
    dramsim3:
        description: DRAM Simulator 3
        version: 1.0.0
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${dramsim3.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib}
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - sst-elements
        - sst-core
        - ramulator2
        - python
        - intelpin
        - hdf5
        - openmpi
        - goblinhmcsim
        - dramsim3
    targets:
        - sst-elements
