---
kez:
    exascale-climate-emulator:
        description: Exascale Climate Emulator (ECE) is a software framework for emulating climate model output at exascale resolutions.
        version: scc25
        compiler: system
        build:
            configurations:
                options:
                    - name: BLA_VENDOR
                      description: BLAS vendor [Goto, ATLAS PhiPACK, CXML, DXML, SunPerf, SCSL, SGIMATH, IBMESSL, IBMESSLMT, Intel10_32 (intel mkl v10
                          32 bit), Intel10_64lp (intel mkl v10 64 bit, lp thread model, lp64 model), Intel10_64lp_seq (intel mkl v10 64 bit, 
                          sequential code, lp64 model), Intel( older versions of mkl 32 and 64 bit), ACML, ACML_MP, ACML_GPU, Apple, NAS, Generic]
                      enabled: true
                      enabled_value: Generic
                    - name: HICMA_PARSEC_HAVE_CUDA
                      description: Enable CUDA support in HiCMA
                      enabled: false
                      enabled_value: ON
                      requires:
                          - cuda
                    - name: PARSEC_GPU_WITH_CUDA
                      description: Enable CUDA support in PaRSEC
                      enabled: false
                      enabled_value: ON
                      requires:
                          - cuda
                    - name: CMAKE_CUDA_ARCHITECTURES
                      description: CUDA architectures
                      enabled_value: none
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${exascale-climate-emulator.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${cuda.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${cuda.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${cuda.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${blas.includes} ${lapack.includes} ${cuda.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${blas.ldflags} ${lapack.ldflags} ${cuda.ldflags} ${mpi.libs} ${blas.libs} 
                          ${lapack.libs} ${cuda.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${blas.ldflags} ${lapack.ldflags} ${cuda.ldflags} ${mpi.libs} ${blas.libs} 
                          ${lapack.libs} ${cuda.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${blas.ldflags} ${lapack.ldflags} ${cuda.ldflags} ${mpi.libs} ${blas.libs} 
                          ${lapack.libs} ${cuda.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${cuda.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${blas.lib};${lapack.lib};${cuda.lib}
    intel-oneapi-mkl:
        description: Intel oneAPI Math Kernel Library for high-performance math routines
        build:
            configurations:
                options:
                    - name: fortran_format
                      description: Fortran Format [ gf | intel ]
                      enabled: true
                      enabled_value: gf
                    - name: integer_size
                      description: Use ilp64 interface [ lp64 | ilp64 ]
                      enabled: true
                      enabled_value: lp64
                    - name: multithreaded
                      description: Use multithreading
                      enabled: false
                      enabled_value:
                    - name: multithreading_library
                      description: Multithreading library [ gnu | tbb ]
                      enabled: true
                      enabled_value: gnu
                    - name: mpi-family
                      description: Use MPI implementation (OpenMPI or MPICH) [ openmpi | intelmpi ]
                      enabled: true
                      enabled_value: openmpi
    intel-oneapi:
        version: 2026.0.1.27
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
recipe:
    abstract_packages:
        blas: intel-oneapi-mkl
        lapack: intel-oneapi-mkl
        mpi: openmpi
    dependencies:
        - exascale-climate-emulator
        - intel-oneapi-mkl
        - intel-oneapi
        - openmpi
        - cuda
    targets:
        - exascale-climate-emulator
