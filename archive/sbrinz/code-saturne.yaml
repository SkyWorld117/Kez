---
kez:
    code-saturne:
        description: "EDF's general-purpose Computational Fluid Dynamics (CFD) tool handling incompressible or expandable flows with or without heat transfer
            and turbulence, with dedicated modules for radiative heat transfer, combustion, magneto-hydrodynamics, compressible flows, two-phase flows,
            and atmospheric flows.\n"
        version: 9.2.0
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-debug
                      description: Reduce optimization for debugging
                      enabled: false
                      enabled_value:
                      disabled_value:
                    - name: disable-gui
                      description: "Disable the GUI. Recommended for server and HPC environments where PyQt5/PySide6 are not available.\n"
                      enabled: true
                      enabled_value:
                    - name: disable-frontend
                      description: Disable front-end elements
                      enabled: false
                      enabled_value:
                    - name: disable-backend
                      description: Disable back-end elements
                      enabled: false
                      enabled_value:
                    - name: with-hdf5
                      description: Path to HDF5 installation
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                      requires:
                          - hdf5
                    - name: with-metis
                      description: Path to METIS installation (graph partitioning)
                      enabled: true
                      enabled_value: ${metis.prefix}
                      requires:
                          - metis
                    - name: enable-cuda
                      description: Enable CUDA GPU offload
                      enabled: true
                      enabled_value:
                      requires:
                          - cuda
                    - name: NVCCFLAGS
                      description: Additional flags for NVCC compilation
                      enabled_value: -O3
                      requires:
                          - cuda
                      enabled: true
                    - name: with-nccl
                      description: Path to NCCL installation (NVIDIA Collective Communications Library)
                      enabled: true
                      enabled_value: ${nvhpc-nccl.prefix}
                      requires:
                          - cuda
                          - nvhpc-nccl
                    - name: prefix
                      enabled: true
                      enabled_value: ${code-saturne.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes} ${zlib.includes} ${hdf5.includes} ${metis.includes} ${cuda.includes} ${nvhpc-nccl.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${zlib.includes} ${hdf5.includes} ${metis.includes} ${cuda.includes} ${nvhpc-nccl.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${zlib.includes} ${hdf5.includes} ${metis.includes} ${cuda.includes} ${nvhpc-nccl.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${zlib.includes} ${hdf5.includes} ${metis.includes} ${cuda.includes} ${nvhpc-nccl.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${metis.ldflags} ${cuda.ldflags} 
                          ${nvhpc-nccl.ldflags} ${code-saturne.ldflags}
    nvhpc-nccl:
        description: NVIDIA Communications Collective Library (NCCL) for NVIDIA HPC SDK
    nvhpc:
        version: 26.5
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
    metis:
        description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing 
            orderings for sparse matrices.
        version: 5.1.0
        compiler: system
        build:
            configurations:
                options:
                    - name: OPENMP
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value: 1
                    - name: SHARED
                      description: Build shared library
                      enabled: true
                      enabled_value: 1
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${metis.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${metis.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${metis.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${metis.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${metis.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${metis.lib}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN_LIB
                      description: Build Fortran library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - code-saturne
        - nvhpc-nccl
        - nvhpc
        - cuda
        - metis
        - hdf5
        - zlib
        - openmpi
    targets:
        - code-saturne
