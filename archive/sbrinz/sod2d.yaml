---
kez:
    sod2d:
        description: Spectral high-Order coDe 2 solve partial Differential equations
        version: master
        compiler: system
        build:
            configurations:
                options:
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${sod2d.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
    hdf5:
        description: High-performance data management and storage suite
        version: 1.10.11
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-cxx
                      description: Compile the C++ interface
                      enabled: false
                      enabled_value:
                    - name: enable-fortran
                      description: Compile the Fortran interface
                      enabled: false
                      enabled_value:
                    - name: enable-parallel
                      description: Search for MPI-IO and MPI support
                      enabled: true
                      enabled_value:
                      requires:
                          - mpi
                    - name: prefix
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.includes}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - sod2d
        - hdf5
        - openmpi
    targets:
        - sod2d
