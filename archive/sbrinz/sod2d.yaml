---
kez:
    sod2d:
        description: Spectral high-Order coDe 2 solve partial Differential equations
        version: master
        compiler: nvhpc-compilers@26.5
        build:
            configurations:
                options:
                    - name: USE_GPU
                      enabled: true
                      enabled_value: ON
                    - name: GPU_CUDA
                      enabled: true
                      enabled_value: 13.2
                    - name: TOOL_MESHPART
                      enabled: true
                      enabled_value: ON
                    - name: USE_PORDER
                      enabled: true
                      enabled_value: 8
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${sod2d.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes} ${hdf5.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs} ${hdf5.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN_LIB
                      description: Build Fortran library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 ${mpi.includes}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${hdf5.ldflags} ${mpi.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${hdf5.lib}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: nvhpc-compilers@26.5
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - sod2d
        - hdf5
        - openmpi
    targets:
        - sod2d
