---
# ICON run on NVHPC 26.5 with OpenACC+CUDA GPU support.
#   Compiler stack : nvhpc (nvc/nvc++/nvfortran) + NVHPC-built OpenMPI
#   GPU            : --enable-gpu=openacc+cuda, nvcc from the kez cuda vendor,
#                    OpenACC device code clocked for sm_90 (CUDAFLAGS / FCFLAGS
#                    -gpu=cc90) - adjust to the target GPU.
#   CUDA vendor    : cuda 13.3 (same libcudart.so.13 the NVHPC OpenMPI links).
#   BLAS/LAPACK    : intel-oneapi-mkl with the gf interface (nvfortran mangles
#                    Fortran names like gfortran, e.g. dgemm_).
# The Fortran-facing deps (openmpi, netcdf-fortran, eccodes) are built with the
# NVHPC compiler; the pure-C libs stay compiler-independent (C ABI).
kez:
    icon:
        description: "ICON - ICOsahedral Non-hydrostatic model. The German weather and climate model developed by DWD, MPI-M, KIT and ECMWF for global numerical
            weather prediction and climate, atmosphere and ocean modelling. Source is BSD-3 licensed and distributed through DKRZ GitLab.\n"
        version: 2026.04
        compiler: nvhpc-compilers@26.5
        patches:
            - name: fix-nvhpc-init-generic-collision.patch
              enabled: true
        build:
            configurations:
                options:
                    - name: enable-openmp
                      description: Enable OpenMP shared-memory parallelism
                      # NVHPC GPU build: OpenMP must be off (nvfortran rejects the
                      # !$omp do inside !$ACC PARALLEL LOOP of fortran-support).
                      enabled: false
                      enabled_value:
                    - name: enable-atmo
                      description: Enable the atmosphere component (dynamical core)
                      enabled: true
                      enabled_value:
                    - name: enable-ocean
                      description: Enable the ocean component
                      enabled: false
                      enabled_value:
                    - name: enable-jsbach
                      description: Enable the JSBACH land-biosphere component
                      enabled: false
                      enabled_value:
                    - name: enable-yaxt
                      description: Enable the YAXT communication abstraction (recommended for performance)
                      enabled: true
                      enabled_value:
                    - name: enable-grib2
                      description: Enable GRIB2 output (requires eccodes with Fortran interface)
                      enabled: true
                      enabled_value:
                    - name: enable-parallel-netcdf
                      description: Enable parallel netCDF I/O (add pnetcdf to the environment when enabled)
                      enabled: false
                      enabled_value:
                    - name: enable-gpu
                      description: Enable GPU support, value like openacc+cuda (requires the CUDA toolkit)
                      enabled: true
                      enabled_value: openacc+cuda
                      requires:
                          - cuda
                    - name: CUDACXX
                      description: CUDA C++ compiler (nvcc) for the GPU build (CUDACXX)
                      enabled: true
                      enabled_value: ${cuda.prefix}/bin/nvcc
                      requires:
                          - cuda
                    - name: CUDAFLAGS
                      description: CUDA C++ compiler flags for the GPU build (CUDAFLAGS), e.g. -arch=sm_90
                      enabled: true
                      enabled_value: -arch=sm_90
                      requires:
                          - cuda
                    - name: prefix
                      enabled: true
                      enabled_value: ${icon.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags} ${zlib.incflags} ${blas.incflags} ${lapack.incflags} 
                          ${libfyaml.incflags} ${eccodes.incflags} ${libaec.incflags} ${libxml2.incflags} ${cuda.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags} ${zlib.incflags} 
                          ${blas.incflags} ${lapack.incflags} ${libfyaml.incflags} ${eccodes.incflags} ${libaec.incflags} ${libxml2.incflags} 
                          ${cuda.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags} ${zlib.incflags} 
                          ${blas.incflags} ${lapack.incflags} ${libfyaml.incflags} ${eccodes.incflags} ${libaec.incflags} ${libxml2.incflags} 
                          ${cuda.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native -acc=gpu -gpu=cc90 ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags} 
                          ${zlib.incflags} ${blas.incflags} ${lapack.incflags} ${libfyaml.incflags} ${eccodes.incflags} ${libaec.incflags} 
                          ${libxml2.incflags} ${cuda.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${netcdf.ldflags} ${hdf5.ldflags} ${zlib.ldflags} ${blas.ldflags} 
                          ${lapack.ldflags} ${libfyaml.ldflags} ${eccodes.ldflags} ${libaec.ldflags} ${libxml2.ldflags} ${cuda.ldflags} 
                          ${icon.ldflags}
    nvhpc-compilers:
        description: NVIDIA HPC compiler suite
    nvhpc:
        version: 26.5
    libxml2:
        description: A library for parsing XML documents.
        version: 2.15.3
        compiler: system
        build:
            configurations:
                options:
                    - name: prefix
                      enabled: true
                      enabled_value: ${libxml2.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${zlib.incflags} ${xz.incflags} ${python.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${zlib.incflags} ${xz.incflags} ${python.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${zlib.incflags} ${xz.incflags} ${python.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${zlib.incflags} ${xz.incflags} ${python.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${zlib.ldflags} ${xz.ldflags} ${python.ldflags} ${libxml2.ldflags}
    python:
        description: Python Programming Language
        version: 3.14.6
        compiler: system
        build:
            configurations:
                options:
                    - name: prefix
                      enabled: true
                      enabled_value: ${python.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${python.ldflags}
    libaec:
        description: "libaec - Adaptive Entropy Coding library. Provides both the libaec codec and libsz, a drop-in implementation of the historical Szip
            compression API used by HDF5/NetCDF4 (eccodes, RegCM, ICON).\n"
        version: 1.1.7
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${libaec.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${libaec.ldflags}
    libfyaml:
        description: "libfyaml - \"I love you YAML\", a C parsing library for YAML 1.2. Fast and dependency-free (only libc + pthread); used by the ICON
            model for YAML namelists.\n"
        version: 1.0.0-alpha8
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${libfyaml.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${libfyaml.ldflags}
    intel-oneapi-mkl:
        description: Intel oneAPI Math Kernel Library for high-performance math routines
        build:
            configurations:
                options:
                    - name: fortran_format
                      description: Fortran Format [ gf | intel ]
                      enabled: true
                      enabled_value: gf
                    - name: integer_size
                      description: Use ilp64 interface [ lp64 | ilp64 ]
                      enabled: true
                      enabled_value: lp64
                    - name: multithreaded
                      description: Use multithreading
                      enabled: false
                      enabled_value:
                    - name: multithreading_library
                      description: Multithreading library [ gnu | tbb ]
                      enabled: true
                      enabled_value: gnu
                    - name: mpi-family
                      description: Use MPI implementation (OpenMPI or MPICH) [ openmpi | intelmpi ]
                      enabled: true
                      enabled_value: openmpi
    intel-oneapi:
        version: 2026.1.0.192
    netcdf:
        description: An abstract package for merging netcdf-c and netcdf-fortran into a single package.
        compiler: system
    netcdf-fortran:
        description: Unidata netCDF Fortran library, providing the Fortran 77/90 APIs on top of the netCDF-C library
        version: 4.6.4
        compiler: nvhpc-compilers@26.5
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-fortran.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${netcdf-c.incflags}
                    # -fPIC is mandatory: libtool does not know nvfortran's PIC
                    # flag, so shared libnetcdff.so objects must be PIC by hand.
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -fPIC -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -fPIC -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -fPIC -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${netcdf-c.ldflags} ${netcdf-fortran.ldflags}
    netcdf-c:
        description: Unidata netCDF C library, a self-describing, portable, array-oriented set of software libraries and data formats for scientific 
            data, with the netCDF-4/HDF5 backend enabled
        version: 4.10.1
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries, required for --enable-plugins dynamic filter loading
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: enable-pnetcdf
                      description: Enable parallel netCDF (pnetCDF) support
                      enabled: false
                      enabled_value:
                    - name: with-default-chunk-size
                      description: Default chunk size in bytes for netCDF-4 variables
                      enabled: true
                      enabled_value: 4194304
                    - name: with-default-chunk-cache-size
                      description: Default per-variable chunk cache size in bytes, raised above the upstream default for large HPC datasets
                      enabled: true
                      enabled_value: 134217728
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-c.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} ${mpi.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${hdf5.ldflags} ${zlib.ldflags} ${zstd.ldflags} ${bzip2.ldflags} ${mpi.ldflags} 
                          ${netcdf-c.ldflags}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN
                      description: Build Fortran library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: HDF5_ENABLE_ZLIB_SUPPORT
                      description: Enable Zlib (deflate) compression filters
                      enabled: true
                      enabled_value: ON
                      requires:
                          - zlib
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix};${zlib.prefix}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: nvhpc-compilers@26.5
    eccodes:
        description: "ecCodes - ECMWF's open-source package for encoding and decoding GRIB and BUFR meteorological data, with C and Fortran interfaces.
            Provides -leccodes and -leccodes_f90 for NWP models such as ICON.\n"
        version: 2.48.0
        compiler: nvhpc-compilers@26.5
        build:
            configurations:
                options:
                    - name: ENABLE_AEC
                      description: Enable AEC (libaec, WMO CCSDS) support; OFF by default despite ecbuild's ON default
                      enabled: true
                      enabled_value: OFF
                    - name: ENABLE_JPG
                      description: Enable JPEG2000 support (requires a JPEG2000 backend)
                      enabled: true
                      enabled_value: OFF
                    - name: ENABLE_NETCDF
                      description: Enable NetCDF support for the grib_to_netcdf tool (add netcdf to the environment when enabled)
                      enabled: false
                      enabled_value: ON
                    - name: ENABLE_EXAMPLES
                      description: Build example programs
                      enabled: true
                      enabled_value: OFF
                    - name: ENABLE_MEMFS
                      description: Build with in-memory file-system support
                      enabled: true
                      enabled_value: OFF
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${eccodes.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${eccodes.ldflags}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${eccodes.ldflags}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${eccodes.ldflags}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${eccodes.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${eccodes.lib}
    cuda:
        description: NVIDIA CUDA Toolkit
        version: 13.3
    cmake:
        description: CMake Build System
        version: 4.4.0
        compiler: system
    bzip2:
        description: A high-quality data compressor
        version: 1.0.8
        compiler: system
        build:
            stages:
                - target: -f Makefile-libbz2_so
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
                - target:
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
recipe:
    abstract_packages:
        blas: intel-oneapi-mkl
        lapack: intel-oneapi-mkl
        mpi: openmpi
    dependencies:
        - icon
        - nvhpc-compilers
        - nvhpc
        - libxml2
        - python
        - xz
        - libaec
        - libfyaml
        - intel-oneapi-mkl
        - intel-oneapi
        - netcdf
        - netcdf-fortran
        - netcdf-c
        - zstd
        - hdf5
        - zlib
        - openmpi
        - eccodes
        - cuda
        - cmake
        - bzip2
    targets:
        - icon
