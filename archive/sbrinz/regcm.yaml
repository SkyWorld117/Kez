---
kez:
    libaec:
        description: 'libaec - Adaptive Entropy Coding library. Provides both the libaec codec and libsz, a drop-in implementation of the historical Szip
            compression API used by HDF5/NetCDF4 (eccodes, RegCM, ICON). '
        version: 1.1.7
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${libaec.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${compiler.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${compiler.fort}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${libaec.ldflags}
    regcm:
        description: "RegCM5 - the Abdus Salam ICTP regional climate model. A flexible, netCDF-based limited-area modeling system with multiple model physics
            and chemistry options, primarily used for regional climate simulations and the CORDEX initiative.\n"
        version: 5.0.0
        compiler: system
        build:
            configurations:
                options:
                    - name: with-szip
                      description: Path to the libaec/Szip installation (HDF5/NetCDF4 compression; add libaec to the environment when enabled)
                      enabled: true
                      enabled_value: ${libaec.prefix}
                    - name: enable-pnetcdf
                      description: Enable parallel netCDF (PnetCDF) I/O (add pnetcdf to the environment when enabled)
                      enabled: false
                      enabled_value:
                    - name: enable-nc4-filters
                      description: Enable HDF5-4 compression filters for netCDF4 output (add c-blosc2/bzip2 to the environment when enabled)
                      enabled: false
                      enabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${regcm.prefix}
                    - name: CC
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${netcdf.incflags} ${hdf5.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${netcdf.ldflags} ${hdf5.ldflags} ${regcm.ldflags}
    netcdf:
        description: An abstract package for merging netcdf-c and netcdf-fortran into a single package.
        compiler: system
    netcdf-fortran:
        description: Unidata netCDF Fortran library, providing the Fortran 77/90 APIs on top of the netCDF-C library
        version: 4.6.4
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-fortran.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${compiler.cxx}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${netcdf-c.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${netcdf-c.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${netcdf-c.ldflags} ${netcdf-fortran.ldflags}
    netcdf-c:
        description: Unidata netCDF C library, a self-describing, portable, array-oriented set of software libraries and data formats for scientific 
            data, with the netCDF-4/HDF5 backend enabled
        version: 4.10.1
        compiler: system
        build:
            configurations:
                options:
                    - name: enable-shared
                      description: Build shared libraries, required for --enable-plugins dynamic filter loading
                      enabled: true
                      enabled_value:
                      disabled_value:
                    - name: enable-pnetcdf
                      description: Enable parallel netCDF (pnetCDF) support
                      enabled: false
                      enabled_value:
                    - name: with-default-chunk-size
                      description: Default chunk size in bytes for netCDF-4 variables
                      enabled: true
                      enabled_value: 4194304
                    - name: with-default-chunk-cache-size
                      description: Default per-variable chunk cache size in bytes, raised above the upstream default for large HPC datasets
                      enabled: true
                      enabled_value: 134217728
                    - name: prefix
                      enabled: true
                      enabled_value: ${netcdf-c.prefix}
                    - name: CXX
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: FC
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CPPFLAGS
                      enabled: true
                      enabled_value: ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} ${mpi.incflags}
                    - name: CFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: CXXFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: FCFLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${hdf5.incflags} ${zlib.incflags} ${zstd.incflags} ${bzip2.incflags} 
                          ${mpi.incflags}
                    - name: LDFLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${hdf5.ldflags} ${zlib.ldflags} ${zstd.ldflags} ${bzip2.ldflags} ${mpi.ldflags} 
                          ${netcdf-c.ldflags}
    hdf5:
        description: High-performance data management and storage suite
        version: 2.1.1
        compiler: system
        build:
            configurations:
                options:
                    - name: BUILD_SHARED_LIBS
                      description: Build shared libraries
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_CPP_LIB
                      description: Build C++ library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_FORTRAN
                      description: Build Fortran library
                      enabled: false
                      enabled_value: ON
                    - name: HDF5_BUILD_HL_LIB
                      description: Build High Level library
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_BUILD_TOOLS
                      description: Build tools
                      enabled: true
                      enabled_value: ON
                    - name: HDF5_ENABLE_PARALLEL
                      description: Enable parallel support
                      enabled: true
                      enabled_value: ON
                      requires:
                          - mpi
                    - name: HDF5_ENABLE_ZLIB_SUPPORT
                      description: Enable Zlib (deflate) compression filters
                      enabled: true
                      enabled_value: ON
                      requires:
                          - zlib
                    - name: CMAKE_INSTALL_PREFIX
                      enabled: true
                      enabled_value: ${hdf5.prefix}
                    - name: CMAKE_BUILD_TYPE
                      enabled: true
                      enabled_value: Release
                    - name: CMAKE_C_COMPILER
                      enabled: true
                      enabled_value: ${mpi.c}
                    - name: CMAKE_CXX_COMPILER
                      enabled: true
                      enabled_value: ${mpi.cxx}
                    - name: CMAKE_Fortran_COMPILER
                      enabled: true
                      enabled_value: ${mpi.fort}
                    - name: CMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3 -march=native -mtune=native ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_CUDA_FLAGS
                      enabled: true
                      enabled_value: -O3 -Xptxas -O3 ${mpi.incflags} ${zlib.incflags}
                    - name: CMAKE_EXE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_SHARED_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_MODULE_LINKER_FLAGS
                      enabled: true
                      enabled_value: ${compiler.ldflags} ${mpi.ldflags} ${zlib.ldflags} ${hdf5.ldflags} ${mpi.libs} ${zlib.libs}
                    - name: CMAKE_BUILD_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_INSTALL_RPATH
                      enabled: true
                      enabled_value: ${compiler.lib};${mpi.lib};${zlib.lib};${hdf5.lib}
                    - name: CMAKE_PREFIX_PATH
                      enabled: true
                      enabled_value: ${mpi.prefix};${zlib.prefix}
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    bzip2:
        description: A high-quality data compressor
        version: 1.0.8
        compiler: system
        build:
            stages:
                - target: -f Makefile-libbz2_so
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
                - target:
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - regcm
        - libaec
        - netcdf
        - netcdf-fortran
        - netcdf-c
        - zstd
        - hdf5
        - zlib
        - openmpi
        - bzip2
    targets:
        - regcm
