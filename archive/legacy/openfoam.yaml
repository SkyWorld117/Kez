---
kez:
    openfoam:
        description: OpenFOAM is a free, open source CFD software package.
        version: 2412
        compiler: system
        build:
            configurations:
                environment:
                    - name: WM_COMPILER
                      description: Compiler for OpenFOAM
                      value: Gcc
                    - name: WM_PRECISION_OPTION
                      description: Precision option for OpenFOAM [DP | SP | SPDP]
                      value: DP
                    - name: WM_LABEL_SIZE
                      description: Label size for OpenFOAM [32 | 64]
                      value: 64
                    - name: WM_COMPILE_OPTION
                      description: Compile option for OpenFOAM [Opt | Dbg | Debug | Prof]
                      value: Opt
                    - name: FOAM_EXTRA_CFLAGS
                      description: Extra compiler flags for OpenFOAM to bake RPATH
                      value: -O3 ${flex.ldflags} ${openfoam.ldflags} ${gmp.ldflags} ${gmp.libs} ${mpfr.ldflags} ${mpfr.libs}
                    - name: FOAM_EXTRA_CXXFLAGS
                      description: Extra C++ compiler flags for OpenFOAM to bake RPATH
                      value: -O3 ${flex.ldflags} ${openfoam.ldflags} ${gmp.ldflags} ${gmp.libs} ${mpfr.ldflags} ${mpfr.libs}
    scotch6:
        description: Scotch is a software package for graph and mesh partitioning, graph clustering, and sparse matrix ordering.
        version: 6.1.3
        compiler: system
        build:
            stages:
                - target: scotch ptscotch
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC ${scotch6.ldflags} -UCOMMON_FILE_COMPRESS -DCOMMON_RANDOM_FIXED_SEED -DSCOTCH_DETERMINISTIC 
                                -DSCOTCH_RENAME -DIDXSIZE64 -Drestrict=__restrict -DINTSIZE64

    kahip:
        description: KaHIP is a Karlsruhe High Quality Partitioning software package.
        version: 3.25
        compiler: system
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3 ${metis.includes}
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3 ${metis.includes}
    metis:
        description: METIS is a set of serial programs for partitioning graphs, partitioning finite element meshes, and producing fill reducing 
            orderings for sparse matrices.
        version: 5.1.0
        compiler: system
        build:
            configurations:
                options:
                    - name: -DOPENMP
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value: 1
                    - name: -DSHARED
                      description: Build shared library
                      enabled: true
                      enabled_value: 1
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    fftw3:
        description: FFTW is a C library for computing the discrete Fourier transform in one or more dimensions, of arbitrary input size, and of both 
            real and complex data.
        version: 3.3.11
        compiler: system
        build:
            configurations:
                options:
                    - name: --enable-float
                      description: Build single-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: --enable-long-double
                      description: Build long double-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: --enable-long-double
                      description: Build long double-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: --enable-quad-precision
                      description: Build quad-precision version of the library
                      enabled: false
                      enabled_value:
                    - name: --enable-sse
                      description: Build SSE-optimized version of the library [x86_64]
                      enabled: false
                      enabled_value:
                    - name: --enable-sse2
                      description: Build SSE/SSE2-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: --enable-avx
                      description: Build AVX-optimized version of the library [x86_64]
                      enabled: false
                      enabled_value:
                    - name: --enable-avx2
                      description: Build AVX/AVX2-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: --enable-avx512
                      description: Build AVX-512-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: --enable-avx-128-fma
                      description: Build AVX-128-FMA-optimized version of the library [x86_64]
                      enabled: true
                      enabled_value:
                    - name: --enable-neon
                      description: Build NEON-optimized version of the library [arm64]
                      enabled: false
                      enabled_value:
                    - name: --enable-sve
                      description: Build SVE-optimized version of the library [arm64]
                      enabled: false
                      enabled_value:
                    - name: --enable-fma
                      description: Enable FMA if the machine architecture "naturally" prefers it
                      enabled: true
                      enabled_value:
                    - name: --enable-mpi
                      description: Enable MPI support
                      enabled: false
                      enabled_value:
                      requires: [mpi]
                    - name: --enable-openmp
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
    cgal:
        description: CGAL is a software library that provides easy access to efficient and reliable geometric algorithms in the form of a C++ library.
        version: 6.1.1
        compiler: system
    boost:
        description: Boost C++ Libraries
        version: 1.89.0
        compiler: system
        build:
            configurations:
                options:
                    - name: cxxflags
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
    adios2:
        description: The Adaptable Input Output System version 2
        version: v2.12.1
        compiler: system
    c-blosc2:
        description: A high-performance compressor optimized for binary data
        version: 3.0.1
        compiler: system
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    libpng:
        description: A library for reading and writing PNG images
        version: 1.6.58
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
    flex:
        description: Fast Lexical Analyzer Generator
        version: 2.6.4
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
    bison:
        description: Bison is a general-purpose parser generator that converts a grammar description for an LALR(1) context-free grammar into a C 
            program to parse that grammar.
        version: 3.8.2
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
    sz3:
        description: SZ3 is a compressed floating-point array library.
        version: 3.3.2
        compiler: system
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    hdf5:
        description: High-performance data management and storage suite
        version: 1.10.11
        compiler: system
        build:
            configurations:
                options:
                    - name: --enable-cxx
                      description: Compile the C++ interface
                      enabled: false
                      enabled_value:
                    - name: --enable-parallel
                      description: Search for MPI-IO and MPI support
                      enabled: true
                      enabled_value:
                      requires: [mpi]
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: CXXFLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: system
    zfp:
        description: ZFP is a compressed floating-point array library.
        version: 1.0.1
        compiler: system
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    ucx:
        description: Unified Communication X
        version: 1.20.0
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: CXXFLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    rdma-core:
        description: RDMA core userspace libraries and daemons
    bzip2:
        description: A high-quality data compressor
        version: 1.0.8
        compiler: system
        build:
            stages:
                - target: -f Makefile-libbz2_so
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
                - target:
                  configurations:
                      options:
                          - name: CFLAGS
                            description: C compiler flags
                            enabled: true
                            enabled_value: -O3 -fPIC -D_FILE_OFFSET_BITS=64
    mgard:
        description: MGARD is a multigrid-based lossy compression library for scientific data.
        version: 1.6.0
        compiler: system
        build:
            configurations:
                options:
                    - name: -DMGARD_ENABLE_OPENMP
                      description: Enable OpenMP support
                      enabled: true
                      enabled_value: ON
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    protobuf:
        description: Protocol Buffers - Google's data interchange format
        version: 25.9
        compiler: system
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
                    - name: -DCMAKE_CXX_FLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
recipe:
    abstract_packages:
        fftw3-api: fftw3
        mpi: openmpi
    dependencies:
        - openfoam
        - scotch6
        - kahip
        - metis
        - fftw3
        - cgal
        - boost
        - adios2
        - c-blosc2
        - libpng
        - flex
        - bison
        - gmp
        - sz3
        - hdf5
        - openmpi
        - zfp
        - mpfr
        - ucx
        - rdma-core
        - bzip2
        - mgard
        - protobuf
        - zlib
        - zstd
    targets:
        - openfoam
