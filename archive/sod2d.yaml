---
cheese:
    sod2d:
        description: Spectral high-Order coDe 2 solve partial Differential equations
        version: master@/scratch/zyi/Applications/source/SOD2D/sod2d_gitlab
        compiler: nvhpc-compilers@26.3
        build:
            configurations:
                options:
                    - name: -DCMAKE_C_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_CXX_FLAGS
                      enabled: true
                      enabled_value: -O3
                    - name: -DCMAKE_Fortran_FLAGS
                      enabled: true
                      enabled_value: -O3
    hdf5:
        description: High-performance data management and storage suite
        version: 1.10.11@/scratch/zyi/tmp/hdf5-1.10.11
        compiler: system
        build:
            configurations:
                options:
                    - name: --enable-cxx
                      description: Compile the C++ interface
                      enabled: false
                      enabled_value:
                    - name: --enable-fortran
                      description: Compile the Fortran interface
                      enabled: true
                      enabled_value:
                    - name: --enable-parallel
                      description: Search for MPI-IO and MPI support
                      enabled: true
                      enabled_value:
                      requires: [mpi]
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
                    - name: CXXFLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
                    - name: FCFLAGS
                      description: Fortran compiler flags
                      enabled: true
                      enabled_value: -O3 -fPIC
    openmpi:
        description: Open Source Implementation of the Message Passing Interface
        version: 5.0.10
        compiler: nvhpc-compilers@26.3
recipe:
    abstract_packages:
        mpi: openmpi
    dependencies:
        - sod2d
        - hdf5
        - openmpi
    targets:
        - sod2d
