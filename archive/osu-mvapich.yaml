---
kez:
    osu:
        description: Ohio State University Micro-Benchmarks
        version: 7.5.1
        compiler: system
        build:
            configurations:
                options:
                    - name: CFLAGS
                      description: C compiler flags
                      enabled: true
                      enabled_value: -O3
                    - name: CXXFLAGS
                      description: C++ compiler flags
                      enabled: true
                      enabled_value: -O3
    mvapich:
        description: High-Performance MPI Library for InfiniBand and RDMA
        version: 4.1
        compiler: system
recipe:
    abstract_packages:
        mpi: mvapich
    dependencies:
        - osu
        - mvapich
    targets:
        - osu
